<script src="../site/assets/os.js"></script>
<script>
(function () {
  "use strict";
  var V = window.VEILOS;
  var q = "";

  function timeAgo(ts) {
    var s = Math.max(1, Math.floor((Date.now() - ts) / 1000));
    if (s < 60) return s + "s ago";
    var m = Math.floor(s / 60);
    if (m < 60) return m + "m ago";
    var h = Math.floor(m / 60);
    if (h < 24) return h + "h ago";
    var d = Math.floor(h / 24);
    if (d < 30) return d + "d ago";
    return new Date(ts).toLocaleDateString();
  }

  function render() {
    var list = V.historyAll();
    var query = q.trim().toLowerCase();
    if (query) {
      list = list.filter(function (v) {
        return v.host.toLowerCase().indexOf(query) > -1 || (v.title || "").toLowerCase().indexOf(query) > -1 || v.url.toLowerCase().indexOf(query) > -1;
      });
    }
    var hosts = {};
    list.forEach(function (v) { hosts[v.host] = 1; });
    document.getElementById("hist-stats").textContent = Object.keys(hosts).length + " sites · " + list.length + " page loads";

    var emptyEl = document.getElementById("hist-empty");
    var listEl = document.getElementById("hist-list");
    document.getElementById("hist-clear").style.display = list.length ? "" : "none";
    if (!list.length) {
      emptyEl.style.display = "";
      listEl.innerHTML = "";
      emptyEl.querySelector("p").textContent = query ? "Nothing matches that filter." : "No history yet — go browse something.";
      return;
    }
    emptyEl.style.display = "none";

    var html = "";
    list.forEach(function (v) {
      var label = v.title || v.url.replace(/^https?:\/\//, "");
      html += '<li class="group flex items-center gap-3 rounded-xl border border-zinc-800/70 bg-zinc-900/40 p-3 transition hover:border-emerald-500/40 hover:bg-zinc-900/70">' +
        '<button type="button" data-revisit="' + V.esc(v.url) + '" class="flex min-w-0 flex-1 items-center gap-3 text-left" aria-label="Revisit ' + V.esc(label) + '">' +
        '<img src="https://icons.duckduckgo.com/ip3/' + V.esc(v.host) + '.ico" alt="" width="40" height="40" loading="lazy" class="h-10 w-10 shrink-0 rounded-xl bg-zinc-800 object-contain p-1"/>' +
        '<span class="min-w-0 flex-1"><span class="block truncate text-[13.5px] font-medium text-zinc-100">' + V.esc(label) + "</span>" +
        '<span class="block truncate text-[11.5px] text-zinc-500">' + V.esc(v.host) + " · " + timeAgo(v.at) + "</span></span>" +
        '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-arrow-up-right size-4 shrink-0 text-zinc-600 opacity-0 transition group-hover:opacity-100 group-hover:text-emerald-400"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></button>' +
        '<button type="button" data-rm="' + V.esc(v.url) + '" aria-label="Remove ' + V.esc(label) + ' from history" class="flex size-8 shrink-0 items-center justify-center rounded-lg text-zinc-500 opacity-0 transition hover:bg-red-500/15 hover:text-red-300 group-hover:opacity-100"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-trash-2 size-3.5"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg></button></li>';
    });
    listEl.innerHTML = html;
    listEl.querySelectorAll("[data-revisit]").forEach(function (b) {
      b.addEventListener("click", function () { window.open(b.getAttribute("data-revisit"), "_blank", "noopener"); });
    });
    listEl.querySelectorAll("[data-rm]").forEach(function (b) {
      b.addEventListener("click", function () {
        V.lsSet("veil.mirror.history", JSON.stringify(V.historyAll().filter(function (v) { return v.url !== b.getAttribute("data-rm"); })));
        render();
      });
    });
  }

  document.getElementById("hist-q").addEventListener("input", function () { q = this.value; render(); });
  document.getElementById("hist-clear").addEventListener("click", function () {
    V.lsSet("veil.mirror.history", "[]");
    render();
  });
  render();
})();
</script>
</body>
