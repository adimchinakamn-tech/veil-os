        return { z: z, n: z, s: "" };
      }

      function renderSelect() {
        var opts = CITIES.filter(function (c) { return zones.indexOf(c.z) < 0; })
          .map(function (c) { return '<option value="' + c.z + '">' + c.n + " \u2014 " + c.s + "</option>"; });
        zsel.innerHTML = opts.length ? opts.join("") : '<option value="">All cities added</option>';
        zadd.disabled = !opts.length;
      }

      function buildCards() {
        refs = [];
        if (!zones.length) {
          cardsEl.innerHTML = '<div class="empty">No cities yet.<br>Pick one above and press <b>Add city</b> \u2014 clocks tick with real zone rules (DST included).</div>';
          return;
        }
        var now = new Date();
        cardsEl.innerHTML = zones.map(function (z) {
          var c = cityOf(z);
          return '<div class="card" data-z="' + z + '">' +
            clockSVG() +
            '<div class="meta"><div class="city">' + c.n + '</div><div class="sub" data-r="sub"></div></div>' +
            '<div class="dig"><div class="t" data-r="t"></div><div class="dt" data-r="dt"></div></div>' +
            '<button class="rm" data-rm="' + z + '" aria-label="Remove ' + c.n + '">\u00d7</button>' +
          "</div>";
        }).join("");
        var list = cardsEl.querySelectorAll(".card");
        for (var i = 0; i < list.length; i++) {
          var el = list[i];
          refs.push({
            z: el.getAttribute("data-z"),
            hh: el.querySelector(".hh"), mh: el.querySelector(".mh"), sh: el.querySelector(".sh"),
            t: el.querySelector('[data-r="t"]'), sub: el.querySelector('[data-r="sub"]'), dt: el.querySelector('[data-r="dt"]'),
            lastMin: -1, lastOff: "", lastDay: -1
          });
        }
        tick(true);
      }

      function tick(force) {
        var now = new Date();
        var localK = ymd(new Intl.DateTimeFormat("en-US", { year: "numeric", month: "2-digit", day: "2-digit" }).format(now));
        for (var i = 0; i < refs.length; i++) {
          var r = refs[i];
          var p = zoneParts(r.z, now);
          var tstr = (h12 ? p.h : pad2(p.h)) + ":" + pad2(p.m) + ":" + pad2(p.s);
          var ap = h12 ? " <small>" + (p.ap || "") + "</small>" : "";
          r.t.innerHTML = tstr + ap;
          var hA = (p.h % 12 + p.m / 60) * 30, mA = (p.m + p.s / 60) * 6, sA = p.s * 6;
          r.hh.style.transform = "rotate(" + hA.toFixed(2) + "deg)";
          r.mh.style.transform = "rotate(" + mA.toFixed(2) + "deg)";
          r.sh.style.transform = "rotate(" + sA.toFixed(2) + "deg)";
          var minuteChanged = r.lastMin !== p.m;
          if (force || minuteChanged) {
            r.lastMin = p.m;
            var off = offsetStr(r.z, now);
            if (off !== r.lastOff) { r.lastOff = off; }
            r.sub.textContent = cityOf(r.z).s + " \u00b7 " + off;
            var dstr = "", badge = "";
            try {
              dstr = dateFmt(r.z).format(now);
              var zk = ymd(keyFmt(r.z).format(now));
              if (zk && localK && zk !== localK) badge = zk > localK ? "Tomorrow" : "Yesterday";
            } catch (e) {}
            r.dt.innerHTML = (p.h >= 6 && p.h < 18 ? SUN : MOON) + "<span>" + dstr + "</span>" + (badge ? '<span class="badge">' + badge + "</span>" : "");
          }
        }
      }

      /* ---- actions ---- */
      function addCity() {
        var z = zsel.value;
        if (!z || zones.indexOf(z) >= 0) return;
        zones.push(z);
        save("zones", zones);
        renderSelect();
        buildCards();
        toast(cityOf(z).n + " added", "ok");
      }
      function removeCity(z) {
        zones = zones.filter(function (x) { return x !== z; });
        save("zones", zones);
        renderSelect();
        buildCards();
      }

      zadd.addEventListener("click", addCity);
      zsel.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); addCity(); }
        e.stopPropagation();
      });
      wrap.addEventListener("click", function (e) {
        var rm = e.target.closest ? e.target.closest("[data-rm]") : null;
        if (rm) { removeCity(rm.getAttribute("data-rm")); return; }
        var hb = e.target.closest ? e.target.closest("[data-h12]") : null;
        if (hb) {
          h12 = hb.getAttribute("data-h12") === "1";
          save("h12", h12);
          wrap.querySelectorAll("[data-h12]").forEach(function (b) { b.classList.toggle("on", b === hb); });
          F = {};
          tick(true);
        }
      });

      renderSelect();
      buildCards();
      var iv = setInterval(function () { tick(false); }, 1000);

      return {
        onClose: function () {
          if (iv) { clearInterval(iv); iv = 0; }
        }
      };
    }
  };
})();

</script>
<script>
/* Sulfur OS app — Weather: live conditions through the tunnel.
   wttr.in's JSON API needs no key; the OS's tunnel fetches it. */
(function () {
"use strict";
var REG = window.SulfurApps || (window.SulfurApps = {});
REG["weather"] = {
    id: "weather", name: "Weather", desc: "live conditions for any city, through the tunnel.",
    icon: "weather", color: "#0ea5e9", cat: "tool", w: 560, h: 640,
    mount: function (root, ctx) {
        root.className = "so-module";
        var st = document.createElement("style");
        st.textContent = [
            ".wx{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 18px;background:radial-gradient(120% 90% at 50% 0%,#12293a 0%,#0c0d18 65%);color:#e4e4e7;overflow:auto}",
            ".wx form{display:flex;gap:8px;width:100%;max-width:380px}",
            ".wx .cur{display:flex;align-items:center;gap:16px;width:100%;max-width:380px;background:rgba(14,165,233,.1);border:1px solid rgba(14,165,233,.3);border-radius:17px;padding:20px 24px}",
            ".wx .big{font-size:44px;font-weight:800;letter-spacing:-.03em}",
            ".wx .meta{display:flex;flex-direction:column;gap:2px}",
            ".wx .meta b{font-size:16px}",
            ".wx .meta span{font-size:12px;color:#7dd3fc}",
            ".wx .fc{display:flex;gap:8px;width:100%;max-width:380px;overflow-x:auto}",
            ".wx .day{flex-shrink:0;width:86px;background:rgba(24,26,38,.6);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px}",
            ".wx .day b{font-size:11px;color:#7dd3fc;letter-spacing:.06em}",
            ".wx .day .t{font-weight:700;font-size:13px}",
            ".wx .st{font-size:12px;color:#a1a1aa;max-width:380px;text-align:center}"
        ].join("\n");
        root.appendChild(st);
        var last = ctx.storage.get("city", "") || "";
        var wrap = document.createElement("div");
        wrap.className = "wx";
        wrap.innerHTML =
            "<form><input class='so-input' style='flex:1' placeholder='city (e.g. Baltimore)' value='" + last.replace(/'/g, "&#39;") + "' aria-label='city'><button class='so-btn primary' style='--acc:#0ea5e9' type='submit'>get</button></form>" +
            "<div class='st'>weather by wttr.in, fetched through the veil tunnel</div>";
        root.appendChild(wrap);
        var form = wrap.querySelector("form");
        form.addEventListener("submit", function (e) {
            e.preventDefault();
            var city = form.querySelector("input").value.trim();
            if (!city) return;
            ctx.storage.set("city", city);
            load(city);
        });
        function load(city) {
            var stEl = wrap.querySelector(".st");
            stEl.textContent = "loading " + city + "…";
            ctx.tunnel.json("https://wttr.in/" + encodeURIComponent(city) + "?format=j1").then(function (d) {
                var c = (d.current_condition || [])[0] || {};
                var area = ((d.weather || [])[0] || {});
                var name = (area.areaName || city).toString();
                var desc = (c.weatherDesc || [{}])[0].value || "";
                var celsius = parseInt(c.temp_C || "0", 10);
                wrap.querySelectorAll(".cur,.fc").forEach(function (n) { n.remove(); });
                var cur = document.createElement("div");
                cur.className = "cur";
                cur.innerHTML = "<span class='big'>" + celsius + "°<small style='font-size:19px;font-weight:600;color:#7dd3fc'>C</small></span>" +
                    "<span class='meta'><b>" + name + " — " + desc + "</b>" +
                    "<span>feels " + c.FeelsLikeC + "°C · humidity " + c.humidity + "% · wind " + c.windspeedKmph + " km/h</span>" +
                    "<span>" + (c.localObsDateTime || "") + "</span></span>";
                wrap.insertBefore(cur, stEl);
                var fc = document.createElement("div");
                fc.className = "fc";
                (d.weather || []).slice(0, 3).forEach(function (day) {
                    var dEl = document.createElement("div");
                    dEl.className = "day";
                    dEl.innerHTML = "<b>" + (day.date || "").slice(5) + "</b>" +
                        "<span class='t'>" + day.mintempC + "°–" + day.maxtempC + "°</span>" +
                        "<span style='color:#a1a1aa'>☀ " + ((day.hourly || [])[4] || {}).chanceofsunshine + "%</span>" +
                        "<span style='color:#a1a1aa'>☂ " + ((day.hourly || [])[4] || {}).chanceofrain + "%</span>";
                    fc.appendChild(dEl);
                });
                wrap.insertBefore(fc, stEl);
                stEl.textContent = "live — " + name.toLowerCase() + ", via wttr.in";
                ctx.setTitle("Weather — " + name);
            }).catch(function (err) {
                stEl.textContent = "couldn't reach wttr.in (" + (err && err.message || "unreachable") + ") — is the tunnel up?";
            });
        }
        if (last) load(last);
    }
};
})();

</script>
<script>
/* Sulfur OS app — YouTube Search: queries YouTube through the
   tunnel and lists videos with thumbnails; picks open straight in
   the veil's full browser. No API key — it scrapes the public
   search page's ytInitialData JSON. */
(function () {
"use strict";
var REG = window.SulfurApps || (window.SulfurApps = {});
REG["ytsearch"] = {
    id: "ytsearch", name: "YouTube Search", desc: "search youtube through the tunnel — results open in the veil.",
    icon: "yt", color: "#ff0033", cat: "media", w: 720, h: 700,
    mount: function (root, ctx) {
        root.className = "so-module";
        var st = document.createElement("style");
        st.textContent = [
            ".yt{min-height:100%;display:flex;flex-direction:column;background:#0c0d18;color:#e4e4e7}",
            ".yt *{box-sizing:border-box}",
            ".yt form{display:flex;gap:8px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.07);background:#101120;position:sticky;top:0;z-index:2}",
            ".yt form input{flex:1;background:#14151f;border:1px solid rgba(255,255,255,.1);border-radius:99px;padding:10px 17px;color:#e4e4e7;outline:none;font-size:13.5px}",
            ".yt form input:focus{border-color:rgba(255,0,51,.5)}",
            ".yt .res{flex:1;overflow:auto;padding:12px 16px 22px;display:flex;flex-direction:column;gap:11px}",
            ".yt .vid{display:flex;gap:13px;background:rgba(24,26,38,.55);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:11px;cursor:pointer;transition:background .15s,transform .12s;text-align:left}",
            ".yt .vid:hover{background:rgba(36,39,58,.85);transform:translateY(-2px)}",
            ".yt .th{width:168px;height:94px;flex-shrink:0;border-radius:9px;background:#18181b;object-fit:cover;display:block}",
            ".yt .vi{min-width:0;display:flex;flex-direction:column;gap:4px}",
            ".yt .vi b{font-size:13.5px;line-height:1.4;color:#fafafa;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}",
            ".yt .vi span{font-size:11.5px;color:#a1a1aa}",
            ".yt .st{padding:20px;font-size:12.5px;color:#71717a;text-align:center}"
        ].join("\n");
        root.appendChild(st);
        var wrap = document.createElement("div");
        wrap.className = "yt";
        wrap.innerHTML =
            "<form><input type='text' placeholder='search youtube…' aria-label='youtube search' autocomplete='off'>" +
            "<button class='so-btn primary' style='--acc:#ff0033' type='submit'>search</button></form>" +
            "<div class='res'><div class='st'>searches run through the veil tunnel — results open in the veil browser</div></div>";
        root.appendChild(wrap);
        var form = wrap.querySelector("form"), res = wrap.querySelector(".res");
        form.addEventListener("submit", function (e) {
            e.preventDefault();
            var q = form.querySelector("input").value.trim();
            if (!q) return;
            res.innerHTML = "<div class='st'>searching “" + q.replace(/</g, "&lt;") + "”…</div>";
            ctx.tunnel.text("https://www.youtube.com/results?search_query=" + encodeURIComponent(q), {
                headers: { accept: "text/html" }
            }).then(function (html) {
                var vids = [];
                var m = /ytInitialData\s*=\s*(\{.+?\});<\/script>/.exec(html);
                if (!m) { res.innerHTML = "<div class='st'>couldn't parse the results — YouTube may be gating this network.</div>"; return; }
                var data;
                try { data = JSON.parse(m[1]); } catch (err) { res.innerHTML = "<div class='st'>results JSON didn't parse.</div>"; return; }
                var walk = function (node) {
                    if (!node || typeof node !== "object" || vids.length >= 24) return;
                    var vr = node.videoRenderer || node.compactVideoRenderer;
                    if (vr && vr.videoId && vr.title) {
                        var title = (((vr.title.runs || [])[0]) || {}).text || "";
                        var who = (((vr.ownerText && vr.ownerText.runs) || [])[0] || {}).text || "";
                        var views = ((vr.shortViewCountText && vr.shortViewCountText.simpleText) || "");
                        var len = ((vr.lengthText && vr.lengthText.simpleText) || "");
                        var th = ((vr.thumbnail && vr.thumbnail.thumbnails) || [])[0];
                        vids.push({ id: vr.videoId, title: title, who: who, views: views, len: len, thumb: th ? th.url : "" });
                    }
                    for (var k in node) { if (vids.length >= 24) break; if (node[k] && typeof node[k] === "object") walk(node[k]); }
                };
                walk(data);
                if (!vids.length) { res.innerHTML = "<div class='st'>no results parsed — try another query.</div>"; return; }
                res.innerHTML = "";
                vids.forEach(function (v) {
                    var b = document.createElement("button");
                    b.className = "vid";
                    b.type = "button";
                    b.innerHTML = (v.thumb ? "<img class='th' src='" + v.thumb.replace(/^http:/, "https:") + "' alt='' loading='lazy'>" : "<span class='th'></span>") +
                        "<span class='vi'><b>" + v.title.replace(/</g, "&lt;") + "</b>" +
                        "<span>" + v.who + (v.views ? " · " + v.views : "") + (v.len ? " · " + v.len : "") + "</span></span>";
                    b.addEventListener("click", function () {
                        try { parent.__veilShell.engineNavigate("https://www.youtube.com/watch?v=" + v.id); ctx.toast("opening in the veil"); }
                        catch (e) { window.open("https://www.youtube.com/watch?v=" + v.id, "_blank"); }
                    });
                    res.appendChild(b);
                });
                ctx.setTitle("YT — " + q.slice(0, 16));
            }).catch(function (err) {
                res.innerHTML = "<div class='st'>search failed (" + (err && err.message || "unreachable") + ") — the tunnel needs the veil engine.</div>";
            });
        });
    }
};
})();
