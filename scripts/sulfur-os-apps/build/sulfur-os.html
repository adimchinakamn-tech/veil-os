<script>
/* Sulfur OS app — Calendar (tools pack) */
(function () {
  "use strict";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function uid() {
    return "e" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  var REG = window.SulfurApps || (window.SulfurApps = {});
  REG["calendar"] = {
    id: "calendar",
    name: "Calendar",
    desc: "Month grid with events, colored dots and a day list",
    icon: "custom:M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z",
    color: "#f59e0b",
    cat: "tool",
    w: 760, h: 560,
    mount: function (root, ctx) {
      ctx = ctx || {};
      var toast = ctx.toast || function () {};
      var store = ctx.storage || null;
      root.classList.add("sa-calendar");
      root.style.setProperty("--acc", "#f59e0b");
      root.style.setProperty("--accd", "rgba(245,158,11,.16)");
      root.style.setProperty("--accf", "rgba(245,158,11,.9)");

      var COLORS = ["#f59e0b", "#14b8a6", "#a78bfa", "#f43f5e", "#38bdf8", "#34d399", "#eab308", "#f472b6"];
      var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      var DOW = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];

      function load(k, d) {
        try {
          var v = store ? store.get(k, null) : null;
          if (v == null || v === "") return d;
          var p = JSON.parse(v);
          return p == null ? d : p;
        } catch (e) { return d; }
      }
      function save(k, v) {
        try { if (store) store.set(k, JSON.stringify(v)); } catch (e) { /* full */ }
      }

      /* ---- state ---- */
      var events = load("events", []);
      if (Object.prototype.toString.call(events) !== "[object Array]") events = [];
      events = events.filter(function (e) {
        return e && typeof e.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && typeof e.title === "string";
      });
      events.forEach(function (e) {
        if (!e.id) e.id = uid();
        if (COLORS.indexOf(e.color) < 0) e.color = COLORS[0];
      });

      var today = new Date();
      var viewY = today.getFullYear();
      var viewM = today.getMonth();
      var sel = null;          // "YYYY-MM-DD"
      var editId = null;       // event being inline-edited
      var adding = false;      // "add another" keep-focus mode

      function keyOf(y, m, d) { return y + "-" + pad2(m + 1) + "-" + pad2(d); }
      function todayKey() { return keyOf(today.getFullYear(), today.getMonth(), today.getDate()); }
      function eventsOn(k) {
        return events.filter(function (e) { return e.date === k; });
      }
      function monthCount() {
        var pre = viewY + "-" + pad2(viewM + 1);
        return events.filter(function (e) { return e.date.indexOf(pre) === 0; }).length;
      }
      function saveEvents() { save("events", events); }

      /* ---- dom ---- */
      var css = document.createElement("style");
      css.textContent = [
        ".sa-calendar{position:relative;width:100%;height:100%;min-width:0;min-height:0;display:flex;flex-direction:column;background:#131316;color:#e4e4e7;font:13px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;box-sizing:border-box}",
        ".sa-calendar *{box-sizing:border-box}",
        ".sa-calendar .bar{flex:none;display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid #27272a;flex-wrap:wrap}",
        ".sa-calendar .bar h2{margin:0;font-size:14px;font-weight:600;letter-spacing:.2px;color:#e4e4e7;min-width:128px;text-align:center}",
        ".sa-calendar .cnt{color:#71717a;font-size:12px;margin-left:auto;margin-right:6px}",
        ".sa-calendar .btn{min-height:34px;min-width:34px;padding:0 12px;border-radius:10px;border:1px solid #27272a;background:#18181b;color:#e4e4e7;font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,border-color .15s,color .15s,transform .06s;user-select:none}",
        ".sa-calendar .btn:hover{background:#1f1f23;border-color:#3f3f46}",
        ".sa-calendar .btn:active{transform:translateY(1px)}",
        ".sa-calendar .btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}",
        ".sa-calendar .btn.pri{background:var(--acc);border-color:var(--acc);color:#17130a;font-weight:600}",
        ".sa-calendar .btn.pri:hover{filter:brightness(1.12)}",
        ".sa-calendar .btn.sq{width:34px;padding:0;font-size:16px;color:#a1a1aa}",
        ".sa-calendar .btn:disabled{opacity:.4;cursor:default;transform:none}",
        ".sa-calendar .body{flex:1;min-height:0;display:flex;flex-wrap:wrap;overflow:hidden}",
        ".sa-calendar .main{flex:1 1 340px;min-width:280px;display:flex;flex-direction:column;overflow:hidden}",
        ".sa-calendar .dow{flex:none;display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid #27272a;text-align:center;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:#71717a}",
        ".sa-calendar .dow div{padding:5px 0}",
        ".sa-calendar .grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;overflow:auto}",
        ".sa-calendar .cell{position:relative;border:0;border-right:1px solid #1e1e22;border-bottom:1px solid #1e1e22;background:transparent;color:inherit;font:inherit;text-align:left;padding:3px 4px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;cursor:pointer;min-width:0;overflow:hidden}",
        ".sa-calendar .cell:nth-child(7n){border-right:0}",
        ".sa-calendar .cell:hover{background:#ffffff08}",
        ".sa-calendar .cell:focus-visible{outline:2px solid var(--acc);outline-offset:-2px;z-index:1}",
        ".sa-calendar .cell.off{cursor:default;background:#10101399}",
        ".sa-calendar .cell.off:hover{background:#10101399}",
        ".sa-calendar .cell.sel{background:var(--accd);box-shadow:inset 0 0 0 1px var(--accf)}",
        ".sa-calendar .dnum{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#d4d4d8;flex:none}",
        ".sa-calendar .cell.today .dnum{background:var(--acc);color:#17130a;font-weight:700}",
        ".sa-calendar .chip{max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:5px;padding:0 4px;font-size:10px;line-height:15px;color:#fff}",
        ".sa-calendar .dots{display:flex;align-items:center;gap:3px;flex-wrap:wrap;min-height:6px}",
        ".sa-calendar .dot{width:6px;height:6px;border-radius:50%;flex:none}",
        ".sa-calendar .more{font-size:10px;color:#71717a}",
        ".sa-calendar .side{flex:0 0 236px;max-width:236px;display:flex;flex-direction:column;border-left:1px solid #27272a;min-height:0;overflow:hidden}",
        ".sa-calendar .shead{flex:none;padding:10px 12px 8px;border-bottom:1px solid #27272a}",
        ".sa-calendar .shead h3{margin:0;font-size:13px;font-weight:600;color:#e4e4e7}",
        ".sa-calendar .shead p{margin:2px 0 0;font-size:11.5px;color:#71717a}",
        ".sa-calendar .addrow{flex:none;display:flex;gap:6px;padding:10px 10px;border-bottom:1px solid #27272a}",
        ".sa-calendar .inp{flex:1;min-width:0;min-height:34px;border-radius:10px;border:1px solid #27272a;background:#0e0e11;color:#e4e4e7;padding:0 10px;font:inherit}",
        ".sa-calendar .inp:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2px var(--accd)}",
        ".sa-calendar .inp:focus-visible{outline:none}",
        ".sa-calendar .list{flex:1;min-height:0;overflow:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px}",
        ".sa-calendar .ev{display:flex;align-items:center;gap:8px;border:1px solid #27272a;background:#18181b;border-radius:12px;padding:7px 9px;min-width:0}",
        ".sa-calendar .evdot{width:10px;height:10px;border-radius:50%;flex:none;cursor:pointer;border:1px solid #ffffff22}",
        ".sa-calendar .evdot:hover{transform:scale(1.25)}",
        ".sa-calendar .evtitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:#e4e4e7;cursor:text;padding:2px 0}",
        ".sa-calendar .evtitle:hover{color:#fff;text-decoration:underline dotted #52525b}",
        ".sa-calendar .evdel{flex:none;width:24px;height:24px;border:0;background:transparent;color:#71717a;border-radius:7px;cursor:pointer;font-size:14px;line-height:1}",
        ".sa-calendar .evdel:hover{color:#f43f5e;background:#f43f5e1a}",
        ".sa-calendar .evdel:focus-visible{outline:2px solid var(--acc);outline-offset:1px}",
        ".sa-calendar .evedit{flex:1;min-width:0;min-height:28px;border-radius:8px;border:1px solid var(--acc);background:#0e0e11;color:#e4e4e7;padding:0 8px;font:inherit;font-size:12.5px}",
        ".sa-calendar .evedit:focus{outline:none}",
        ".sa-calendar .empty{margin:auto;text-align:center;color:#71717a;font-size:12.5px;padding:24px 12px;line-height:1.7}",
        ".sa-calendar .khint{flex:none;padding:6px 10px;border-top:1px solid #27272a;font-size:10.5px;color:#52525b;letter-spacing:.3px}",
        ".sa-calendar kbd{font:10px ui-monospace,monospace;background:#1f1f23;border:1px solid #3f3f46;border-radius:4px;padding:1px 4px;color:#a1a1aa}"
      ].join("\n");
      root.appendChild(css);

      var wrap = document.createElement("div");
      wrap.className = "sa-calendar";
      root.appendChild(wrap);
      wrap.innerHTML =
        '<div class="bar">' +
          '<button class="btn sq" data-act="prev" aria-label="Previous month" title="Previous month (Left)">&#8249;</button>' +
          '<h2 id="mtitle"></h2>' +
          '<button class="btn sq" data-act="next" aria-label="Next month" title="Next month (Right)">&#8250;</button>' +
          '<span class="cnt" id="mcount"></span>' +
          '<button class="btn" data-act="today">Today</button>' +
        '</div>' +
        '<div class="body">' +
          '<div class="main">' +
            '<div class="dow">' + DOW.map(function (d) { return "<div>" + d + "</div>"; }).join("") + '</div>' +
            '<div class="grid" id="grid" role="grid" aria-label="Days"></div>' +
          '</div>' +
          '<div class="side">' +
            '<div class="shead"><h3 id="dtitle">Select a date</h3><p id="dsub"></p></div>' +
            '<div class="addrow">' +
              '<input class="inp" id="addinp" placeholder="Add event&hellip;" aria-label="New event title" maxlength="120" disabled>' +
              '<button class="btn pri" id="addbtn" aria-label="Add event" title="Add event (Enter)">+</button>' +
            '</div>' +
            '<div class="list" id="elist"></div>' +
            '<div class="khint"><kbd>&larr;</kbd><kbd>&rarr;</kbd> month &nbsp; <kbd>&uarr;</kbd><kbd>&darr;</kbd> day &nbsp; <kbd>T</kbd> today</div>' +
          '</div>' +
        '</div>';

      var gridEl = wrap.querySelector("#grid");
      var mtitle = wrap.querySelector("#mtitle");
      var mcount = wrap.querySelector("#mcount");
      var dtitle = wrap.querySelector("#dtitle");
      var dsub = wrap.querySelector("#dsub");
      var elist = wrap.querySelector("#elist");
      var addinp = wrap.querySelector("#addinp");
      var addbtn = wrap.querySelector("#addbtn");

      /* ---- render ---- */
      function renderGrid() {
        mtitle.textContent = MONTHS[viewM] + " " + viewY;
        mcount.textContent = monthCount() ? monthCount() + " event" + (monthCount() === 1 ? "" : "s") : "";
        var first = new Date(viewY, viewM, 1).getDay();
        var dim = new Date(viewY, viewM + 1, 0).getDate();
        var tk = todayKey();
        var html = [];
        for (var i = 0; i < first; i++) html.push('<button class="cell off" tabindex="-1" disabled aria-hidden="true"></button>');
        for (var d = 1; d <= dim; d++) {
          var k = keyOf(viewY, viewM, d);
          var evs = eventsOn(k);
          var cls = "cell" + (k === tk ? " today" : "") + (k === sel ? " sel" : "");
          var inner = '<span class="dnum">' + d + "</span>";
          if (evs.length) {
            inner += '<span class="chip" style="background:' + evs[0].color + 'cc">' + esc(evs[0].title) + "</span>";
            var dots = evs.slice(0, 4).map(function (e) { return '<i class="dot" style="background:' + e.color + '"></i>'; }).join("");
            if (evs.length > 4) dots += '<i class="more">+' + (evs.length - 4) + "</i>";
            inner += '<span class="dots">' + dots + "</span>";
          }
          html.push('<button class="' + cls + '" data-date="' + k + '" role="gridcell" aria-label="' + k + (evs.length ? ", " + evs.length + " events" : "") + '">' + inner + "</button>");
        }
        gridEl.innerHTML = html.join("");
      }

      function renderSide() {
        if (!sel) {
          dtitle.textContent = "Select a date";
          dsub.textContent = "Click any day to see and add events";
          addinp.disabled = true;
          addbtn.disabled = true;
          elist.innerHTML = '<div class="empty">Pick a day on the grid.<br>Events show up here with colored dots.</div>';
          return;
        }
        var dt = new Date(sel + "T00:00:00");
        var wd = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][dt.getDay()];
        dtitle.textContent = wd + ", " + MONTHS[dt.getMonth()] + " " + dt.getDate();
        dsub.textContent = sel + " \u00b7 " + eventsOn(sel).length + " event" + (eventsOn(sel).length === 1 ? "" : "s");
        addinp.disabled = false;
        addbtn.disabled = false;
        var evs = eventsOn(sel);
        if (!evs.length) {
          elist.innerHTML = '<div class="empty">No events this day.<br>Type a title above and press <b>+</b> or Enter.</div>';
          return;
        }
        elist.innerHTML = evs.map(function (e) {
          if (e.id === editId) {
            return '<div class="ev"><input class="evedit" data-edit="' + e.id + '" value="' + esc(e.title) + '" aria-label="Edit event title"></div>';
          }
          return '<div class="ev" data-id="' + e.id + '">' +
            '<span class="evdot" style="background:' + e.color + '" title="Cycle color" data-cyc="' + e.id + '"></span>' +
            '<span class="evtitle" data-editgo="' + e.id + '" title="Click to edit">' + esc(e.title) + "</span>" +
            '<button class="evdel" data-del="' + e.id + '" aria-label="Delete event" title="Delete">&times;</button>' +
          "</div>";
        }).join("");
        var ed = elist.querySelector(".evedit");
        if (ed) {
          ed.focus();
          ed.setSelectionRange(ed.value.length, ed.value.length);
          ed.addEventListener("keydown", function (ev) {
            if (ev.key === "Enter") { commitEdit(ed.value); }
            else if (ev.key === "Escape") { editId = null; renderSide(); }
            ev.stopPropagation();
          });
          ed.addEventListener("blur", function () { commitEdit(ed.value); });
        }
      }

      function commitEdit(val) {
        if (!editId) return;
        var v = String(val || "").trim();
        for (var i = 0; i < events.length; i++) {
          if (events[i].id === editId) {
            if (v) { events[i].title = v.slice(0, 120); toast("Event updated", "ok"); }
            else { events.splice(i, 1); toast("Empty title — event removed", "warn"); }
            break;
          }
        }
        editId = null;
        saveEvents();
        renderGrid();
        renderSide();
      }

      function render() { renderGrid(); renderSide(); }

      /* ---- actions ---- */
      function shiftMonth(n) {
        var m = viewM + n, y = viewY;
        if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
        if (y < 1900 || y > 2100) return;
        viewM = m; viewY = y;
        renderGrid();
      }
      function goToday() {
        viewY = today.getFullYear(); viewM = today.getMonth();
        sel = todayKey();
        render();
      }
      function shiftSel(days) {
        var base = sel ? new Date(sel + "T00:00:00") : new Date(today.getFullYear(), today.getMonth(), today.getDate());
        base.setDate(base.getDate() + days);
        viewY = base.getFullYear(); viewM = base.getMonth();
        sel = keyOf(viewY, viewM, base.getDate());
        render();
      }
      function addEvent() {
        var t = addinp.value.trim();
        if (!sel || !t) { if (!t) toast("Type an event title first", "warn"); return; }
        events.push({ id: uid(), date: sel, title: t.slice(0, 120), color: COLORS[events.length % COLORS.length] });
        saveEvents();
        addinp.value = "";
        render();
        addinp.focus();
        toast("Event added to " + sel, "ok");
      }

      /* ---- events (delegated) ---- */
      wrap.addEventListener("click", function (e) {
        var el = e.target.closest ? e.target.closest("[data-act],[data-date],[data-del],[data-cyc],[data-editgo]") : null;
        if (!el) return;
        if (el.hasAttribute("data-act")) {
          var a = el.getAttribute("data-act");
          if (a === "prev") shiftMonth(-1);
          else if (a === "next") shiftMonth(1);
          else if (a === "today") goToday();
          return;
        }
        if (el.hasAttribute("data-date")) {
          sel = el.getAttribute("data-date");
          viewY = Number(sel.slice(0, 4)); viewM = Number(sel.slice(5, 7)) - 1;
          render();
          if (adding) { addinp.focus(); }
          return;
        }
        if (el.hasAttribute("data-del")) {
          var id = el.getAttribute("data-del");
          for (var i = 0; i < events.length; i++) {
            if (events[i].id === id) { toast("Deleted \u201c" + events[i].title.slice(0, 40) + "\u201d", "info"); events.splice(i, 1); break; }
          }
          saveEvents(); render();
          return;
        }
        if (el.hasAttribute("data-cyc")) {
          var cid = el.getAttribute("data-cyc");
          events.forEach(function (ev) {
            if (ev.id === cid) ev.color = COLORS[(COLORS.indexOf(ev.color) + 1) % COLORS.length];
          });
          saveEvents(); render();
          return;
        }
        if (el.hasAttribute("data-editgo")) {
          editId = el.getAttribute("data-editgo");
          renderSide();
        }
      });

      addbtn.addEventListener("click", addEvent);
      addinp.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); addEvent(); }
        e.stopPropagation();
      });

      root.addEventListener("keydown", function (e) {
        var t = e.target;
        if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
        if (e.key === "ArrowLeft") { e.preventDefault(); shiftMonth(-1); }
        else if (e.key === "ArrowRight") { e.preventDefault(); shiftMonth(1); }
        else if (e.key === "ArrowUp") { e.preventDefault(); shiftSel(-7); }
        else if (e.key === "ArrowDown") { e.preventDefault(); shiftSel(7); }
        else if (e.key === "t" || e.key === "T") { e.preventDefault(); goToday(); }
        else if (e.key === "Enter") { e.preventDefault(); if (sel) addinp.focus(); }
      });

      goToday();
      return {
        onClose: function () { /* no timers — nothing to clean up */ }
      };
    }
  };
})();

        '<div class="hrow">',

        '  <button data-a="italic" title="Italic" aria-label="Italic"><i>I</i></button>',

      var DEFAULT = "# Welcome to **Sulfur Markdown**\n\nA tiny editor with a live preview \u2014 everything runs offline in one file.\n\n## Features\n- Headings, **bold**, *italic*, ~~strike~~\n- `inline code` and fenced blocks\n- Nested lists\n  - like this one\n- [links](https://example.com) open in a new tab\n\n1. ordered lists\n2. also work\n\n> Block quotes look like this.\n\n---\n\n```js\nfunction greet(name) {\n  return \"Hello, \" + name;\n}\n```\n\nHTML in your text, like <script>alert(1)<\/script>, is escaped and shown as plain text.\n";

      var timeouts = [];
      function t(fn, ms) { var id = setTimeout(fn, ms); timeouts.push(id); return id; }

      function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;");
      }

      /* ---- clipboard with fallback (helper node stays inside root) ---- */
      function copyText(text, okMsg) {
        var legacy = function () {
          try {
            var ta = document.createElement("textarea");
            ta.value = text; ta.setAttribute("readonly", "");
            ta.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
            root.appendChild(ta);
            ta.select(); ta.setSelectionRange(0, text.length);
            var ok = document.execCommand("copy");
            root.removeChild(ta);
            ctx.toast(ok ? (okMsg || "Copied") : "Copy failed", ok ? "ok" : "warn");
          } catch (e) { ctx.toast("Copy failed", "warn"); }
        };
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () { ctx.toast(okMsg || "Copied", "ok"); }, legacy);
            return;
          }
        } catch (e) {}
        legacy();
      }

      /* ================= tiny markdown renderer ================= */
      function inline(s) {
        var codes = [];
        var x = esc(s);
        x = x.replace(/`([^`\n]+)`/g, function (m, c) { codes.push("<code>" + c + "</code>"); return "\u0000I" + (codes.length - 1) + "\u0000"; });
        x = x.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        x = x.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*/g, "$1<em>$2</em>");
        x = x.replace(/~~([^~]+)~~/g, "<del>$1</del>");
        x = x.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, txt, url) {
          var safe = (/^(https?:\/\/|mailto:|\/\/|#|\/)/i.test(url)) ? url : "#";
          return "<a href=\"" + safe + "\" target=\"_blank\" rel=\"noopener noreferrer\">" + txt + "</a>";
        });
        x = x.replace(/\u0000I(\d+)\u0000/g, function (m, i) { return codes[+i] || ""; });
        return x;
      }
      var HR = /^(\s*)(-{3,}|\*{3,}|_{3,})\s*$/;
      var LI = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
      var HD = /^(#{1,4})\s+(.*)$/;
      function blockStart(line) {
        return HD.test(line) || /^>\s?/.test(line) || LI.test(line) || HR.test(line) ||
          /^\u0000B\d+\u0000\s*$/.test(line);
      }
      function processLines(lines, codes) {
        var out = [], i = 0;
        while (i < lines.length) {
          var line = lines[i];
          if (!line.trim()) { i++; continue; }
          var bm = /^\u0000B(\d+)\u0000\s*$/.exec(line);

            continue;
          }
          if (LI.test(line)) {
            var items = [];
            while (i < lines.length) {
              var m = LI.exec(lines[i]);
              if (!m) break;
              items.push({ ind: Math.min(3, Math.floor(m[1].replace(/\t/g, "  ").length / 2)), ord: /\d/.test(m[2][0]), txt: m[3] });

            if (pos < items.length && items[pos].ind > indent) html += parse(items[pos].ind);
            html += "</li>";
          }
          return html + "</" + (ord ? "ol" : "ul") + ">";
        }

        var s = String(src == null ? "" : src).replace(/```[^\n]*\n([\s\S]*?)(?:```|(?![\s\S]))/g, function (m, c) {

          return "\u0000B" + (codes.length - 1) + "\u0000";
        });
        var html = processLines(s.split("\n"), codes);
        return html.replace(/\u0000B(\d+)\u0000/g, function (m, i) { return codes[+i] || ""; });
      }
      /* ================= end renderer ================= */

      /* ---- editor wiring ---- */
      var ta = $("ta"), pv = $("pv");
      function update() {
        try { pv.innerHTML = renderMD(ta.value); } catch (e) { pv.textContent = "Render error"; }
        var v = ta.value;
        $("w").textContent = (v.match(/\S+/g) || []).length;
        $("c").textContent = v.length;
        $("l").textContent = v ? v.split("\n").length : 1;
        scheduleSave();
      }
      ta.addEventListener("input", update);

      /* ---- toolbar ---- */
      function wrapSel(before, after) {
        var s = ta.selectionStart, e = ta.selectionEnd;
        ta.setRangeText(before + ta.value.slice(s, e) + after, s, e);
        ta.focus();
        ta.setSelectionRange(s + before.length, e + before.length);
        update();
      }
      function prefixLines(pfx) {
        var v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
        var ls = v.lastIndexOf("\n", s - 1) + 1;
        var le = v.indexOf("\n", e); if (le < 0) le = v.length;
        var lines = v.slice(ls, le).split("\n");
        var all = lines.length > 0 && lines.every(function (l) { return l.indexOf(pfx) === 0; });
        var out = lines.map(function (l) { return all ? l.slice(pfx.length) : pfx + l; }).join("\n");
        ta.setRangeText(out, ls, le);
        ta.focus();
        ta.setSelectionRange(ls, ls + out.length);
        update();
      }
      Array.prototype.forEach.call(wrap.querySelectorAll(".tools button"), function (b) {
        b.addEventListener("click", function () {
          var a = b.getAttribute("data-a");
          if (a === "bold") wrapSel("**", "**");
          else if (a === "italic") wrapSel("*", "*");
          else if (a === "code") wrapSel("`", "`");
          else if (a === "h") prefixLines("## ");
          else if (a === "quote") prefixLines("> ");
          else if (a === "ul") prefixLines("- ");
          else if (a === "ol") prefixLines("1. ");
        });
      });

      /* ---- tab inserts two spaces (indent / outdent selection) ---- */
      ta.addEventListener("keydown", function (e) {
        if (e.key !== "Tab" || e.ctrlKey || e.metaKey || e.altKey) return;
        e.preventDefault();
        var v = ta.value, s = ta.selectionStart, en = ta.selectionEnd;
        if (s === en && !e.shiftKey) { ta.setRangeText("  ", s, en, "end"); }
        else {
          var ls = v.lastIndexOf("\n", s - 1) + 1;
          var le = v.indexOf("\n", en); if (le < 0) le = v.length;
          var lines = v.slice(ls, le).split("\n");
          var out = lines.map(function (l) {
            if (e.shiftKey) { return l.replace(/^ {1,2}/, "") || ""; }
            return "  " + l;
          }).join("\n");
          ta.setRangeText(out, ls, le);
          ta.setSelectionRange(ls, ls + out.length);
        }
        update();
      });

      /* ---- export & copy ---- */
      $("exportMd").addEventListener("click", function () {
        try {
          var b = new Blob([ta.value], { type: "text/markdown;charset=utf-8" });
          var u = URL.createObjectURL(b);
          var a = document.createElement("a");
          a.href = u; a.download = "sulfur-note.md";
          root.appendChild(a); a.click(); a.remove();
          t(function () { try { URL.revokeObjectURL(u); } catch (e) {} }, 4000);
          ctx.toast("Exported .md", "ok");
        } catch (err) { ctx.toast("Export failed", "warn"); }
      });
      $("copyHtml").addEventListener("click", function () { copyText(renderMD(ta.value), "HTML copied"); });

      /* ---- autosave / restore ---- */
      var saveT = 0, savedT = 0;
      function scheduleSave() { if (saveT) clearTimeout(saveT); saveT = t(saveNow, 700); }
      function saveNow() {
        ctx.storage.set("draft", ta.value);
        $("savedTxt").textContent = "Saved";
        $("saved").classList.add("show");
        if (savedT) clearTimeout(savedT);
        savedT = t(function () { $("saved").classList.remove("show"); }, 2200);
      }
      (function restore() {
        var restored = false;
        try {
          var raw = ctx.storage.get("draft", "");
          if (typeof raw === "string" && raw.length > 0 && raw !== DEFAULT) { ta.value = raw; restored = true; }
          else ta.value = DEFAULT;
        } catch (e) { ta.value = DEFAULT; }
        update();
        if (restored) ctx.toast("Draft restored", "info");
      })();

      return {
        onClose: function () {
          for (var i = 0; i < timeouts.length; i++) clearTimeout(timeouts[i]);
          timeouts.length = 0;
          saveT = 0; savedT = 0;
        }
      };
    }
  };
})();

<script>
/* Sulfur OS app — JSON Formatter (tools pack) */
(function () {
  "use strict";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var SAMPLE = '{\n  "name": "Sulfur OS",\n  "version": 2,\n  "offline": true,\n  "packs": ["games", "tools"],\n  "window": {\n    "w": 640,\n    "h": 480,\n    "min": { "w": 300, "h": 240 }\n  },\n  "notes": null\n}';

  var REG = window.SulfurApps || (window.SulfurApps = {});

    color: "#2dd4bf",

      var parsed = null, parseErr = null, outText = "", debTimer = 0;

      }

          return 0;
        }
        var t = 0, ks = Object.keys(v);

      }

      /* ---- dom ---- */
      var css = document.createElement("style");
      css.textContent = [

        ".sa-json-formatter .seg button:hover{background:#1f1f23;color:#e4e4e7}",

        ".sa-json-formatter .seg.small{margin-left:0}",
        ".sa-json-formatter .seg.small button{min-height:28px;padding:0 10px;font-size:12px}",
        ".sa-json-formatter .main{flex:1;min-height:0;display:flex;flex-wrap:wrap;overflow:hidden}",
        ".sa-json-formatter .pane{flex:1 1 300px;min-width:240px;display:flex;flex-direction:column;min-height:0;overflow:hidden}",
        ".sa-json-formatter .ph{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid #27272a;font-size:11px;color:#71717a;text-transform:uppercase;letter-spacing:.8px}",
        ".sa-json-formatter .ph .grow{flex:1}",
        ".sa-json-formatter .mini{min-height:24px;min-width:24px;padding:0 6px;border:0;border-radius:6px;background:transparent;color:#71717a;font:inherit;font-size:11px;cursor:pointer}",
        ".sa-json-formatter .mini:hover{color:#e4e4e7;background:#1f1f23}",
        ".sa-json-formatter .mini:focus-visible{outline:2px solid var(--acc);outline-offset:1px}",
        ".sa-json-formatter textarea{flex:1;min-height:0;width:100%;resize:none;border:0;background:#0e0e11;color:#e4e4e7;padding:10px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;overflow:auto}",
        ".sa-json-formatter textarea:focus{outline:none}",
        ".sa-json-formatter .outwrap{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}",

        ".sa-json-formatter .em{font-size:11.5px;color:#a1a1aa;margin-top:2px}",
        ".sa-json-formatter .es{margin:6px 0 0;font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#e4e4e7;white-space:pre;overflow:auto}",
        ".sa-json-formatter .es .c{color:#f87171}",
        ".sa-json-formatter .tree{flex:1;min-height:0;overflow:auto;padding:8px 10px;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0e0e11}",
        ".sa-json-formatter .tn{--d:0}",
        ".sa-json-formatter .tc{display:none;padding-left:16px;border-left:1px solid #27272a;margin-left:7px}",
        ".sa-json-formatter .tn.open>.tc{display:block}",
        ".sa-json-formatter .row{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap;min-width:0}",
        ".sa-json-formatter .tg{flex:none;width:18px;height:18px;border:0;border-radius:5px;background:transparent;font:10px/18px ui-monospace,monospace;cursor:pointer;transition:transform .12s;color:#a1a1aa}",
        ".sa-json-formatter .tg:hover{background:#1f1f23;color:#e4e4e7}",
        ".sa-json-formatter .tg:focus-visible{outline:2px solid var(--acc);outline-offset:1px}",
        ".sa-json-formatter .tg::before{content:'\\25b8';display:inline-block;transition:transform .12s}",
        ".sa-json-formatter .tn.open>.row .tg::before{transform:rotate(90deg)}",
        ".sa-json-formatter .tn.leaf>.row{padding-left:18px}",
        ".sa-json-formatter .row .sp{flex:none;width:18px}",
        ".sa-json-formatter .tk{color:#7dd3fc;word-break:break-all}",
        ".sa-json-formatter .tv{word-break:break-all;min-width:0}",
        ".sa-json-formatter .pv{color:#71717a;font-size:11px}",
        ".sa-json-formatter .tv.s{color:#86efac}",
        ".sa-json-formatter .tv.n{color:#fcd34d}",
        ".sa-json-formatter .tv.b{color:#f0abfc}",

      ].join("\n");
      root.appendChild(css);

      var wrap = document.createElement("div");
      wrap.className = "sa-json-formatter";
      root.appendChild(wrap);
      wrap.innerHTML =
        '<div class="bar">' +
          '<button class="btn pri" data-act="format">Format</button>' +
          '<button class="btn" data-act="minify">Minify</button>' +
          '<button class="btn" data-act="validate">Validate</button>' +
          '<button class="btn" data-act="sample">Sample</button>' +
          '<button class="btn" data-act="copy">Copy</button>' +
          '<button class="btn" data-act="clear">Clear</button>' +
          '<button class="btn tog' + (sort ? " on" : "") + '" data-act="sort" aria-pressed="' + sort + '">Sort keys</button>' +
          '<div class="seg small" role="group" aria-label="Indent">' +
            '<button type="button" data-ind="2">2</button><button type="button" data-ind="4">4</button><button type="button" data-ind="tab">Tab</button>' +
          '</div>' +
          '<div class="seg" role="group" aria-label="Output view">' +
            '<button type="button" data-view="text">Text</button><button type="button" data-view="tree">Tree</button>' +
          '</div>' +
        '</div>' +
        '<div class="main">' +
          '<div class="pane">' +
            '<div class="ph">Input<span class="grow"></span><span id="instats"></span></div>' +

          '</div>' +
          '<div class="pane outwrap">' +
            '<div class="status" id="status"></div>' +

            '<div class="ph" id="treebar" hidden>Tree<span class="grow"></span><button class="mini" data-act="expandall">expand all</button><button class="mini" data-act="collapseall">collapse all</button></div>' +

          '</div>' +
        '</div>';

      var inTa = wrap.querySelector("#in");
      var outTa = wrap.querySelector("#out");
      var statusEl = wrap.querySelector("#status");
      var errBox = wrap.querySelector("#errbox");
      var treeEl = wrap.querySelector("#tree");
      var treeBar = wrap.querySelector("#treebar");
      var inStats = wrap.querySelector("#instats");
      inTa.value = raw;

      function errInfo(e) {
        var msg = (e && e.message) || String(e);

        var m2 = msg.match(/line (\d+)(?: column (\d+))?/);
        if (m2) { line = parseInt(m2[1], 10); col = m2[2] ? parseInt(m2[2], 10) : null; }

          for (var i = 0; i < off && i < raw.length; i++) {
            if (raw.charCodeAt(i) === 10) { line++; col = off - i; }

        } else if (line != null && col == null) { col = 1; }
        if (line == null) { line = 1; col = 1; }
        return { msg: msg, line: line, col: col, off: off };
      }

      function renderErr() {
        if (!parseErr) { errBox.hidden = true; errBox.innerHTML = ""; return; }
        var info = errInfo(parseErr);
        var lines = raw.split("\n");
        var lt = lines[Math.min(info.line - 1, lines.length - 1)] || "";
        var caret = new Array(Math.max(0, info.col - 1) + 1).join(" ") + "^";
        errBox.hidden = false;
        errBox.innerHTML =
          '<div class="eh">\u2717 Parse error \u2014 line ' + info.line + ", column " + info.col +
          (info.off != null ? ' <span style="font-weight:400">(offset ' + info.off + ")</span>" : "") + "</div>" +
          '<div class="em">' + esc(info.msg) + "</div>" +
          '<pre class="es">' + esc(lt.length > 400 ? lt.slice(0, 400) + "\u2026" : lt) + "\n" + '<span class="c">' + esc(caret) + "</span></pre>";
      }

      function valClass(v) {
        if (typeof v === "string") return "s";
        if (typeof v === "number") return "n";
        if (typeof v === "boolean") return "b";
        return "z";
      }
      function leafHTML(v) {
        var s = v === null ? "null" : (typeof v === "string" ? JSON.stringify(v) : String(v));
        return '<span class="tv ' + valClass(v) + '">' + esc(s.length > 4000 ? s.slice(0, 4000) + "\u2026" : s) + "</span>";
      }
      function treeHTML(val, key, depth) {
        var isArr = Object.prototype.toString.call(val) === "[object Array]";
        var k = key == null ? "" : '<span class="tk">' + esc(JSON.stringify(key)) + ':</span>';
        if (val === null || typeof val !== "object") {
          return '<div class="tn leaf"><div class="row">' + k + leafHTML(val) + "</div></div>";
        }
        var keys = isArr ? val : Object.keys(val);
        var n = keys.length;
        var prev = isArr ? "[\u2026] " + n + " item" + (n === 1 ? "" : "s") : "{\u2026} " + n + " key" + (n === 1 ? "" : "s");
        var open = depth < 2 ? " open" : "";
        var kids = "";
        for (var i = 0; i < n; i++) {
          var ck = isArr ? null : keys[i];
          var cv = isArr ? keys[i] : val[ck];
          kids += treeHTML(cv, ck, depth + 1);
        }
        return '<div class="tn' + open + '"><div class="row">' +
          '<button class="tg" aria-label="Toggle branch"></button>' + k +
          '<span class="pv">' + (n === 0 ? (isArr ? "[]" : "{}") : prev) + "</span></div>" +
          '<div class="tc">' + kids + "</div></div>";
      }

      function renderStatus() {
        var st = "";
        if (!raw.trim()) {
          statusEl.innerHTML = '<span class="bad">Empty input</span>';
        } else if (parseErr) {
          var info = errInfo(parseErr);

        } else {
          st = '<span class="ok">\u2713 Valid JSON</span>';
          var statsTxt = rootType(parsed) + " \u00b7 " + countNodes(parsed) + " nodes \u00b7 " + countKeys(parsed) + " keys \u00b7 depth " + maxDepth(parsed) + " \u00b7 " + raw.length + " chars \u00b7 " + byteLen(outText) + " B";
          st += '<span class="stats">' + esc(statsTxt) + "</span>";
          statusEl.innerHTML = st;
        }

      }

      function renderOut() {
        outTa.value = outText;
        if (view === "text") {

        } else {

      }

      function refresh() {
        parseNow();
        buildOut(false);
        renderErr();
        renderStatus();
        renderOut();

      function setView(v) {

          } else fallback();
        } catch (e) { fallback(); }
      }

      /* ---- interactions ---- */
      inTa.addEventListener("input", function () {
        raw = inTa.value;
        save("raw", raw);
        if (debTimer) clearTimeout(debTimer);
        debTimer = setTimeout(function () { debTimer = 0; refresh(); }, 250);
      });
      inTa.addEventListener("keydown", function (e) { e.stopPropagation(); });

      outTa.addEventListener("click", function () {
        outTa.focus();
        outTa.select();
      });

      wrap.addEventListener("click", function (e) {
        var tg = e.target.closest ? e.target.closest(".tg") : null;
        if (tg) {
          var tn = tg.closest(".tn");
          if (tn) tn.classList.toggle("open");

        var b = e.target.closest ? e.target.closest("[data-act],[data-view],[data-ind]") : null;

        if (b.hasAttribute("data-ind")) {
          var iv2 = b.getAttribute("data-ind");

        var a = b.getAttribute("data-act");

          parseNow();

          raw = outText; inTa.value = raw; save("raw", raw);
          refresh();
          toast("Formatted", "ok");
        } else if (a === "minify") {
          parseNow();
          if (parseErr || parsed == null) { refresh(); toast("Cannot minify \u2014 invalid JSON", "warn"); return; }
          buildOut(true);
          raw = outText; inTa.value = raw; save("raw", raw);
          refresh();
          toast("Minified to " + raw.length + " chars", "ok");
        } else if (a === "validate") {
          parseNow();
          if (parseErr) {
            var info = errInfo(parseErr);
            refresh();
            toast("Invalid \u2014 line " + info.line + ", col " + info.col, "warn");
          } else {
            refresh();
            toast("Valid JSON \u00b7 " + countNodes(parsed) + " nodes", "ok");
          }
        } else if (a === "sample") {
          raw = SAMPLE; inTa.value = raw; save("raw", raw); refresh();
        } else if (a === "copy") {
          copyOut();
        } else if (a === "clear") {
          raw = ""; inTa.value = ""; save("raw", raw); refresh();
        } else if (a === "sort") {
          sort = !sort;
          save("sort", sort);
          b.classList.toggle("on", sort);
          b.setAttribute("aria-pressed", String(sort));
          refresh();
        } else if (a === "expandall") {
          treeEl.querySelectorAll(".tn").forEach(function (n) { n.classList.add("open"); });
        } else if (a === "collapseall") {
          treeEl.querySelectorAll(".tn").forEach(function (n) { n.classList.remove("open"); });
        }
      });

      root.addEventListener("keydown", function (e) {
        if ((e.ctrlKey || e.metaKey) && (e.key === "Enter" || e.key === "\n")) {
          e.preventDefault();
          wrap.querySelector('[data-act="format"]').click();
        }
      });

      wrap.querySelectorAll("[data-ind]").forEach(function (b) {
        b.classList.toggle("on", String(b.getAttribute("data-ind")) === String(indent));
      });
      wrap.querySelectorAll("[data-view]").forEach(function (b) {
        b.classList.toggle("on", b.getAttribute("data-view") === view);
      });
      refresh();

      return {
        onClose: function () {
          if (debTimer) { clearTimeout(debTimer); debTimer = 0; }
        }
      };

      /* ---- clipboard with fallback (helper node stays inside root) ---- */
      function copyText(text, okMsg) {

            root.removeChild(ta);
            ctx.toast(ok ? (okMsg || "Copied") : "Copy failed", ok ? "ok" : "warn");
          } catch (e) { ctx.toast("Copy failed", "warn"); }
        };
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () { ctx.toast(okMsg || "Copied", "ok"); }, legacy);
            return;
          }
        } catch (e) {}

      /* ---- unbiased random int [0,n) ---- */
      function rnd(n) {

            do { crypto.getRandomValues(buf); } while (buf[0] >= lim);
            return buf[0] % n;
          }
        } catch (e) {}
        return Math.floor(Math.random() * n);

      /* ---- state (options persisted; history memory-only) ---- */
      var mode = "pw", len = 20, wordCount = 5, sep = " ";

      try {

        if (raw) {
          var d = JSON.parse(raw);
          if (d && typeof d === "object") {
            if (d.len >= 8 && d.len <= 64) len = d.len;
            if (d.words >= 4 && d.words <= 8) wordCount = d.words;
            if (typeof d.lower === "boolean") sets.lower = d.lower;
            if (typeof d.upper === "boolean") sets.upper = d.upper;
            if (typeof d.nums === "boolean") sets.nums = d.nums;
            if (typeof d.syms === "boolean") sets.syms = d.syms;
            if (typeof d.amb === "boolean") amb = d.amb;
            if (d.sep === "-" || d.sep === " ") sep = d.sep;
            if (d.mode === "pw" || d.mode === "pp") mode = d.mode;

      function persistOpts() {
        ctx.storage.set("opts", JSON.stringify({ mode: mode, len: len, words: wordCount, lower: sets.lower, upper: sets.upper, nums: sets.nums, syms: sets.syms, amb: amb, sep: sep }));

      function pool() {
        var p = "";
        if (sets.lower) p += LOWER;
        if (sets.upper) p += UPPER;
        if (sets.nums) p += NUMS;

      /* ---- strength ---- */
      function tierOf(bits) {
        if (bits < 28) return ["Very weak", "#ef4444"];
        if (bits < 36) return ["Weak", "#f97316"];
        if (bits < 60) return ["Fair", "#eab308"];
        if (bits < 100) return ["Strong", "#f59e0b"];
        return ["Excellent", "#fde047"];

        var s = Math.pow(2, bits - 1) / 1e10;

        var r = function (x) { return x >= 100 ? Math.round(x) : Math.round(x * 10) / 10; };
        if (s < 1) return "instant";
        if (s < 60) return r(s) + " seconds";
        if (s < 3600) return r(s / 60) + " minutes";
        if (s < 86400) return r(s / 3600) + " hours";
        if (s < 31557600) return r(s / 86400) + " days";

        if (y < 1e3) return r(y) + " years";
        if (y < 1e6) return r(y / 1e3) + " thousand years";
        if (y < 1e9) return r(y / 1e6) + " million years";
        if (y < 1e12) return r(y / 1e9) + " billion years";
        if (y < 1e15) return r(y / 1e12) + " trillion years";
        var e = Math.floor(Math.log10(y));
        return (y / Math.pow(10, e)).toFixed(1) + "\u00D710^" + e + " years";
      }

      /* ---- generate & paint ---- */

        var h = Math.floor(Math.random() * 360), s = 40 + Math.floor(Math.random() * 60), l = 25 + Math.floor(Math.random() * 55);
        var nx = hsl2hex(h, s, l);
        $("hexin").value = nx.toUpperCase();
        setHex(nx);
      });

      /* ---- value copy buttons ---- */
      Array.prototype.forEach.call(wrap.querySelectorAll(".cp"), function (b) {
        b.addEventListener("click", function () {
          var what = b.getAttribute("data-copy"), txt;
          if (what === "hex") txt = hex.toUpperCase();
          else if (what === "rgb") txt = $("vRgb").textContent;
          else txt = $("vHsl").textContent;
          copyText(txt, what.toUpperCase() + " copied");
        });
      });

      /* ---- shades & tints ---- */
      function renderStrip() {
        var strip = $("strip");
        strip.innerHTML = "";
        for (var k = 0; k < 11; k++) {
          var c;
          if (k < 5) c = mix(hex, "#000000", (5 - k) / 5);
          else if (k === 5) c = hex;
          else c = mix(hex, "#ffffff", (k - 5) / 5);
          var b = document.createElement("button");
          b.style.background = c;
          b.title = c.toUpperCase();
          b.setAttribute("aria-label", "Copy " + c.toUpperCase());
          if (k === 5) b.className = "cur";
          (function (cc) { b.addEventListener("click", function () { copyText(cc.toUpperCase(), cc.toUpperCase() + " copied"); }); })(c);
          strip.appendChild(b);
        }
      }

      /* ---- saved palette ---- */
      var persistT = 0;
      function persistPal() {
        ctx.storage.set("palette", JSON.stringify(pal));
      }
      function renderPal() {
        var grid = $("palgrid");
        grid.innerHTML = "";
        $("palCount").textContent = pal.length + " / " + MAXPAL;
        $("palempty").style.display = pal.length ? "none" : "";
        pal.forEach(function (c, i) {
          var b = document.createElement("button");
          b.className = "psw" + (c === hex ? " cur" : "");
          b.style.background = c;
          b.title = esc(c.toUpperCase()) + " \u2014 click to load, right-click to remove";
          b.setAttribute("aria-label", "Load " + c.toUpperCase() + ". Press Delete to remove.");
          b.addEventListener("click", function () {
            $("hexin").value = c.toUpperCase();
            setHex(c);
          });
          b.addEventListener("contextmenu", function (e) {
            e.preventDefault();
            removeAt(i);
          });
          b.addEventListener("keydown", function (e) {
            if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); removeAt(i); }
          });
          var rm = document.createElement("span");
          rm.className = "rm";
          rm.textContent = "\u00D7";
          rm.setAttribute("aria-hidden", "true");
          rm.addEventListener("click", function (e) { e.stopPropagation(); removeAt(i); });
          b.appendChild(rm);
          grid.appendChild(b);
        });
      }
      function removeAt(i) {
        var c = pal.splice(i, 1);
        renderPal(); persistPal();
        if (c.length) ctx.toast(c[0].toUpperCase() + " removed", "info");
      }
      $("addBtn").addEventListener("click", function () {
        var i = pal.indexOf(hex);
        if (i >= 0) pal.splice(i, 1);
        pal.unshift(hex);
        var dropped = false;
        while (pal.length > MAXPAL) { pal.pop(); dropped = true; }
        renderPal(); persistPal();
        ctx.toast(dropped ? "Saved \u2014 oldest color dropped" : hex.toUpperCase() + " saved", "ok");
      });

      /* ---- hue bar gradient (static rainbow) ---- */
      $("hBar").style.background = "linear-gradient(90deg,#f00,#ff0 16.6%,#0f0 33.3%,#0ff 50%,#00f 66.6%,#f0f 83.3%,#f00)";
      setHex("#f59e0b");

      return {
        onClose: function () {
          if (persistT) clearTimeout(persistT);
        }
      };
    }
  };
})();

      var $ = function (name) { return wrap.querySelector('[data-el="' + name + '"]'); };

      function setColor(col) {

        });

        cv.style.cursor = m === "eraser" ? "cell" : "crosshair";

      /* ---- drawing ---- */
      function pos(e) {
        var r = cv.getBoundingClientRect();
        return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
      }
      function begin(p) {
        drawing = true; last = p; lastMid = p;

        c.beginPath(); c.arc(p.x, p.y, brush / 2, 0, Math.PI * 2); c.fill();

        if (!drawing) return;

        c.beginPath();
        c.moveTo(lastMid.x, lastMid.y);
        c.quadraticCurveTo(last.x, last.y, mid.x, mid.y);
        c.stroke();
        last = p; lastMid = mid;

      function endStroke() {
        if (!drawing) return;

        if (undoS.length > 31) undoS.shift();

        e.preventDefault();

      cv.addEventListener("pointerup", endStroke);
      cv.addEventListener("pointercancel", endStroke);

      function ghost() {
        if (mode === "eraser") { ghostEl.style.background = "rgba(161,161,170,.15)"; ghostEl.style.borderColor = "rgba(251,191,36,.9)"; }

      }

        var r = cv.getBoundingClientRect(), sr = stage.getBoundingClientRect();

        ghostEl.style.display = "block";
      }
      cv.addEventListener("pointerenter", function () { ghost(); });
      cv.addEventListener("pointerleave", function () { ghostEl.style.display = "none"; });

      /* ---- history ---- */
      function undo() {
        if (undoS.length < 2) return;
        redoS.push(undoS.pop());
        c.putImageData(undoS[undoS.length - 1], 0, 0);
        syncHist();
      }
      function redo() {
        if (!redoS.length) return;
        var snap = redoS.pop();
        undoS.push(snap);
        c.putImageData(snap, 0, 0);
        syncHist();
      }
      function syncHist() {
        $("undo").disabled = undoS.length < 2;
        $("redo").disabled = !redoS.length;
      }
      $("undo").addEventListener("click", undo);
      $("redo").addEventListener("click", redo);
      syncHist();

      /* ---- clear / save ---- */
      function wipe() {
        c.fillStyle = BG; c.fillRect(0, 0, W, H);
        try { undoS.push(c.getImageData(0, 0, W, H)); } catch (e) {}
        if (undoS.length > 31) undoS.shift();

      }
      $("clear").addEventListener("click", function () {
        confirmDlg("Clear drawing?", "The whole canvas goes back to blank. Undo can bring it back.", "Clear").then(function (ok) {
          if (!ok) return;

        });
      });
      $("png").addEventListener("click", function () {
        try {
          var a = document.createElement("a");
          a.href = cv.toDataURL("image/png");
          a.download = "sulfur-drawing.png";
          root.appendChild(a); a.click(); a.remove();
          ctx.toast("PNG saved", "ok");
        } catch (err) { ctx.toast("Save failed", "warn"); }
      });

      /* ---- timer ---- */

        T.running = !!run; T.endAt = Date.now() + T.remain;

      function startPause() {
        if (T.running) { T.remain = Math.max(0, T.endAt - Date.now()); T.running = false; paintT(); return; }

      $("reset").addEventListener("click", function () { T.running = false; setPhase(T.phase, false); });

          set.done++; set.doneDay = today(); persist();

        }

      function bump(key, d) {

        var v = set[key] + d;
        if (v < lim[0] || v > lim[1]) return;
        set[key] = v;

        $("bVal").textContent = set.brk;
        $("longVal").textContent = longMin();

          T.total = phaseMin(T.phase) * 60000; T.remain = T.total; paintT();
        } else if (T.running) ctx.toast("Applies from the next phase", "info");
      }

        b.addEventListener("click", function () { bump(b.getAttribute("data-k"), parseInt(b.getAttribute("data-d"), 10)); });
      });

      var SW = { running: false, t0: 0, acc: 0, laps: [] };
      function swNow() { return SW.acc + (SW.running ? Math.max(0, performance.now() - SW.t0) : 0); }

        var t = Math.floor(ms), cs = Math.floor((t % 1000) / 10);
        var s = Math.floor(t / 1000) % 60, m = Math.floor(t / 60000);

        return p2(m) + ":" + p2(s) + "." + (cs < 10 ? "0" : "") + cs;
      }
      function paintSW() {
        var clockEl = $("swClock");
        clockEl.textContent = "";
        var txt = fmtSW(swNow());
        var a = document.createElement("span"); a.textContent = txt.slice(0, 5);
        var b = document.createElement("span"); b.style.opacity = ".55"; b.textContent = txt.slice(5);
        clockEl.appendChild(a); clockEl.appendChild(b);
        $("swStart").textContent = SW.running ? "Stop" : (SW.acc > 0 ? "Resume" : "Start");
        $("swLap").disabled = !SW.running;
        $("swReset").disabled = SW.running;
      }
      $("swStart").addEventListener("click", function () {
        if (SW.running) { SW.acc = swNow(); SW.running = false; }
        else { SW.running = true; SW.t0 = performance.now(); }
        paintSW(); paintTitle();

      $("swLap").addEventListener("click", function () {
        if (!SW.running) return;
        SW.laps.unshift(swNow());
        if (SW.laps.length > 200) SW.laps.pop();

      });
      $("swReset").addEventListener("click", function () {
        SW.running = false; SW.acc = 0; SW.laps = [];
        renderLaps(); paintSW(); paintTitle();
      });
      function renderLaps() {
        var box = $("laps");
        box.innerHTML = "";
        if (!SW.laps.length) {
          var p = document.createElement("p");
          p.className = "laps-empty";
          p.textContent = "No laps yet \u2014 hit Lap while the stopwatch runs.";
          box.appendChild(p); return;
        }
        SW.laps.forEach(function (t, i) {
          var n = SW.laps.length - i;
          var split = t - (SW.laps[i + 1] || 0);
          var row = document.createElement("div");
          row.className = "lap";
          var c1 = document.createElement("span"); c1.className = "n"; c1.textContent = "LAP " + (n < 10 ? "0" : "") + n;
          var c2 = document.createElement("span"); c2.className = "s"; c2.textContent = fmtSW(split);
          var c3 = document.createElement("span"); c3.className = "tot"; c3.textContent = fmtSW(t);
          row.appendChild(c1); row.appendChild(c2); row.appendChild(c3);
          box.appendChild(row);
        });
      }

      /* ---- window title tick (OS-level, not document.title) ---- */
      function paintTitle() {
        var t = "Pomodoro";
        if (mode === "timer") {
          var remain = T.running ? Math.max(0, T.endAt - Date.now()) : T.remain;
          if (T.running || remain < T.total) t = fmt(remain) + " \u00B7 " + phaseName(T.phase);
        } else if (SW.running) t = fmtSW(swNow()).slice(0, 8) + " \u00B7 stopwatch";
        try { ctx.setTitle(t); } catch (e) {}
      }

      /* ---- init ---- */
      $("fVal").textContent = set.focus;
      $("bVal").textContent = set.brk;
      $("longVal").textContent = longMin();
      paintMute();
      setPhase("focus", false);
      paintSW();
      renderLaps();
      var swInt = setInterval(function () { if (mode === "stop" && SW.running) { paintSW(); paintTitle(); } }, 53);
      try { root.focus({ preventScroll: true }); } catch (e) { root.focus(); }

      return {
        onClose: function () {
          clearInterval(timerInt);
          clearInterval(swInt);
          try { if (actx && actx.close) actx.close(); } catch (e) {}
        }
      };
    }
  };
})();

        if (!sw.laps.length) {
          lapsEl.innerHTML = '<div class="empty">No laps yet \u2014 press <b>Lap</b> while running.</div>';
          return;
        }
        var best = null, worst = null;
        if (sw.laps.length >= 2) {
          best = Infinity; worst = -Infinity;
          sw.laps.forEach(function (l) {
            best = Math.min(best, l.split);
            worst = Math.max(worst, l.split);
          });
          if (best === worst) { best = worst = null; }
        }
        var rows = [];
        for (var i = sw.laps.length - 1; i >= 0; i--) {
          var l = sw.laps[i];
          var cls = "lap";
          var tag = "";
          if (best != null && l.split === best) { cls += " best"; tag = '<span class="tag">best</span>'; }
          else if (worst != null && l.split === worst) { cls += " worst"; tag = '<span class="tag">worst</span>'; }
          rows.push('<div class="' + cls + '"><span class="n">Lap ' + l.n + '</span><span class="sp">' + fmtSW(l.split) + "</span>" + tag + '<span class="tt">' + fmtSW(l.total) + "</span></div>");
        }
        lapsEl.innerHTML = rows.join("");
      }
      function swToggle() {
        if (sw.running) {
          sw.elapsed = swElapsed();
          sw.running = false;
          toast("Paused at " + fmtSW(sw.elapsed), "info");
        } else {
          sw.startedAt = Date.now();
          sw.running = true;
          ensureAC();
        }
        saveSw();
        renderSw();
        ensureLoop();
      }
      function swLap() {
        if (!sw.running) return;
        var total = swElapsed();
        var lastTotal = sw.laps.length ? sw.laps[sw.laps.length - 1].total : 0;
        var split = total - lastTotal;
        sw.laps.push({ n: sw.laps.length + 1, total: total, split: split });
        if (sw.laps.length > 200) sw.laps = sw.laps.slice(-200);
        saveSw();
        renderSw();
        toast("Lap " + sw.laps.length + " \u2014 " + fmtSW(split), "ok");
      }
      function swReset() {
        var had = swElapsed() > 0 || sw.laps.length;
        sw.running = false;
        sw.elapsed = 0;
        sw.startedAt = 0;
        sw.laps = [];
        saveSw();
        renderSw();
        if (had) toast("Stopwatch reset", "info");
      }

      /* ---- timer ---- */
      var alarmDone = false;
      function setTmInputsFromMs(ms) {
        tmin.value = String(Math.floor(ms / 60000));
        tsec.value = String(Math.floor((ms % 60000) / 1000));
      }
      function markPreset(min) {
        wrap.querySelectorAll("#presets .chip").forEach(function (c) {
          c.classList.toggle("on", Number(c.getAttribute("data-min")) === min && tm.total === min * 60000);
        });
      }
      function renderTm() {
        var rem = tmRemaining();
        tmtime.textContent = fmtTM(rem);
        var frac = tm.total > 0 ? rem / tm.total : 0;
        prog.style.strokeDasharray = CIRC.toFixed(2);
        prog.style.strokeDashoffset = (CIRC * (1 - frac)).toFixed(2);
        tmgo.textContent = tm.running ? "Pause" : (rem < tm.total && rem > 0 ? "Resume" : "Start");
        tmgo.disabled = tm.total <= 0;
        tmin.disabled = tm.running;
        tsec.disabled = tm.running;
        var done = alarmDone && !tm.running && rem <= 0;
        ringwrap.classList.toggle("done", done);
        tmoff.hidden = !done;
      }
      function tmToggle() {
        ensureAC();
        if (tm.running) {
          tm.remaining = Math.max(0, tm.endAt - Date.now());
          tm.running = false;
          toast("Timer paused \u2014 " + fmtTM(tm.remaining) + " left", "info");
        } else {
          var rem = tmRemaining();
          if (rem <= 0) rem = tm.total;
          if (rem <= 0) { toast("Set a duration first", "warn"); return; }
          alarmDone = false;
          tm.endAt = Date.now() + rem;
          tm.running = true;
        }
        saveTm();
        renderTm();
        ensureLoop();
      }
      function tmReset() {
        tm.running = false;
        tm.remaining = tm.total;
        alarmDone = false;
        saveTm();
        renderTm();
      }
      function tmFinish() {
        tm.running = false;
        tm.remaining = 0;
        alarmDone = true;
        saveTm();
        renderTm();
        beep();
        toast("Time is up \u2014 " + fmtTM(tm.total) + " elapsed", "warn");
      }
      function setTmMs(ms) {
        if (tm.running) return;
        tm.total = ms;
        tm.remaining = ms;
        alarmDone = false;
        setTmInputsFromMs(ms);
        saveTm();
        renderTm();
      }
      function fromInputs() {
        if (tm.running) return;
        var m = Math.max(0, Math.min(999, parseInt(tmin.value, 10) || 0));
        var s = Math.max(0, Math.min(59, parseInt(tsec.value, 10) || 0));
        var ms = (m * 60 + s) * 1000;
        setTmMs(ms);
        markPreset(m + s / 60);
      }

      /* ---- loop ---- */
      function ensureLoop() {
        if (!raf && (sw.running || tm.running)) raf = requestAnimationFrame(loopStep);
      }
      function loopStep() {
        raf = 0;
        if (sw.running) renderSw();
        if (tm.running) {
          if (tmRemaining() <= 0) { tmFinish(); }
          else renderTm();
        }
        if (sw.running || tm.running) raf = requestAnimationFrame(loopStep);
      }

      /* ---- wiring ---- */
      swgo.addEventListener("click", swToggle);
      swlap.addEventListener("click", swLap);
      swreset.addEventListener("click", swReset);
      lapclear.addEventListener("click", function () {
        sw.laps = [];
        saveSw();
        renderSw();
        toast("Laps cleared", "info");
      });
      tmgo.addEventListener("click", tmToggle);
      tmreset.addEventListener("click", tmReset);
      tmoff.addEventListener("click", function () {
        alarmDone = false;
        renderTm();
        tmreset.focus();
      });
      [tmin, tsec].forEach(function (inp) {
        inp.addEventListener("input", fromInputs);
        inp.addEventListener("keydown", function (e) { e.stopPropagation(); });
      });
      wrap.addEventListener("click", function (e) {
        var tabB = e.target.closest ? e.target.closest("[data-tab]") : null;
        if (tabB) {
          tab = tabB.getAttribute("data-tab");
          vsw.hidden = tab !== "sw";
          vtm.hidden = tab !== "tm";
          wrap.querySelectorAll("[data-tab]").forEach(function (b) {
            var on = b === tabB;
            b.classList.toggle("on", on);
            b.setAttribute("aria-selected", String(on));
          });
          return;
        }
        var chip = e.target.closest ? e.target.closest("[data-min]") : null;
        if (chip) {
          var min = Number(chip.getAttribute("data-min"));
          setTmMs(min * 60000);
          wrap.querySelectorAll("#presets .chip").forEach(function (c) {
            c.classList.toggle("on", c === chip);
          });
        }
      });

      root.addEventListener("keydown", function (e) {
        var t = e.target;
        if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
        if (e.key === " ") {
          e.preventDefault();
          if (tab === "sw") swToggle(); else tmToggle();
        } else if (e.key === "l" || e.key === "L") {
          e.preventDefault();
          swLap();
        } else if (e.key === "r" || e.key === "R") {
          e.preventDefault();
          if (tab === "sw") swReset(); else tmReset();
        }
      });

      /* init */
      setTmInputsFromMs(tm.total);
      markPreset(Math.round(tm.total / 60000));
      if (tm.running && tmRemaining() <= 0) { tmFinish(); }
      renderSw();
      renderTm();
      ensureLoop();

      return {
        onClose: function () {
          if (raf) { cancelAnimationFrame(raf); raf = 0; }
          if (sw.running) { sw.elapsed = swElapsed(); sw.running = false; sw.startedAt = 0; saveSw(); }
          if (tm.running) { tm.remaining = tmRemaining(); tm.running = false; tm.endAt = 0; saveTm(); }
        }
      };
    }
  };
})();
