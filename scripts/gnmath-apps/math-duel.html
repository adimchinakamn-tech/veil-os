<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gn-math — duel</title>
<meta name="description" content="GN-Math Duel — two players, one screen, mental math head-to-head.">
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  background-color: #0a0907;
  background-image:
    linear-gradient(rgba(245,158,11,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(245,158,11,.05) 1px, transparent 1px),
    linear-gradient(rgba(245,158,11,.09) 1px, transparent 1px),
    linear-gradient(90deg, rgba(245,158,11,.09) 1px, transparent 1px);
  background-size: 26px 26px, 26px 26px, 130px 130px, 130px 130px;
  color: #fafafa; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  padding: 18px; position: relative;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 115%, rgba(0,0,0,.55), transparent 65%);
}
button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 8px; }

.app { width: 100%; max-width: 520px; position: relative; z-index: 1; }
.brand { display: flex; align-items: baseline; gap: 8px; margin-bottom: 18px; user-select: none; }
.brand b { font-weight: 700; font-size: 15px; letter-spacing: .04em; }
.brand b span { color: #f59e0b; }
.brand em { font-style: normal; font-size: 10.5px; color: #71717a; letter-spacing: .14em; }

.setup h1 { font-size: clamp(22px, 5.4vw, 30px); font-weight: 700; line-height: 1.15; margin-bottom: 6px; }
.setup .sub { color: #a1a1aa; font-size: 12.5px; margin-bottom: 20px; }
.names { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 16px; }
.field label { display: block; font-size: 10px; letter-spacing: .16em; color: #71717a; margin-bottom: 6px; text-transform: uppercase; }
.field label.p1 { color: #34d399; } .field label.p2 { color: #fbbf24; }
.field input {
  width: 100%; padding: 12px 13px; border-radius: 11px; background: #18181b; border: 1px solid #27272a;
  color: #fafafa; font: inherit; font-size: 14px;
}
.field input:focus { border-color: #f59e0b; outline: none; }
.rounds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 8px; }
.chip {
  padding: 11px 4px; border-radius: 11px; background: #18181b; border: 1px solid #27272a;
  text-align: center; transition: border-color .12s, background .12s, transform .12s;
}
.chip b { display: block; font-size: 16px; font-weight: 700; }
.chip span { font-size: 9px; color: #71717a; letter-spacing: .06em; }
.chip:hover { border-color: #3f3f46; transform: translateY(-1px); }
.chip[aria-pressed="true"] { background: rgba(245,158,11,.12); border-color: #f59e0b; }
.chip[aria-pressed="true"] b { color: #fbbf24; }
.start {
  width: 100%; margin-top: 16px; padding: 15px 18px; border-radius: 14px;
  background: #f59e0b; color: #1c1207; font-weight: 700; font-size: 15px;
  box-shadow: 0 8px 24px rgba(245,158,11,.25); transition: transform .12s, box-shadow .12s;
}
.start:hover { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(245,158,11,.35); }

/* ── play ── */
.duel-hud { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin-bottom: 20px; }
.duel-p { padding: 11px 12px; border-radius: 12px; background: #18181b; border: 1px solid #27272a; text-align: center; transition: border-color .25s, box-shadow .25s, background .25s; }
.duel-p .nm { font-size: 11px; letter-spacing: .08em; color: #71717a; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.duel-p .sc { font-size: 26px; font-weight: 700; line-height: 1.15; }
.duel-p.a { border-color: rgba(52,211,153,.55); box-shadow: 0 0 0 1px rgba(52,211,153,.25), 0 6px 18px rgba(52,211,153,.12); background: rgba(52,211,153,.08); }
.duel-p.a .sc { color: #34d399; }
.duel-p.b { border-color: rgba(251,191,36,.55); box-shadow: 0 0 0 1px rgba(251,191,36,.25), 0 6px 18px rgba(251,191,36,.1); background: rgba(251,191,36,.07); }
.duel-p.b .sc { color: #fbbf24; }
.duel-mid { text-align: center; font-size: 11px; color: #71717a; line-height: 1.5; }
.duel-mid b { color: #d4d4d8; font-size: 14px; }
.turn-banner { text-align: center; margin-bottom: 16px; padding: 9px; border-radius: 10px; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; user-select: none; }
.turn-banner.a { background: rgba(52,211,153,.12); color: #34d399; }
.turn-banner.b { background: rgba(251,191,36,.12); color: #fbbf24; }
.stage { text-align: center; margin-bottom: 18px; user-select: none; }
.q { font-size: clamp(38px, 10vw, 56px); font-weight: 700; line-height: 1; letter-spacing: -.02em; }
.q .op { color: #f59e0b; padding: 0 .12em; }
.ans {
  margin-top: 10px; font-size: clamp(22px, 6vw, 30px); font-weight: 700; color: #34d399;
  display: inline-flex; align-items: center; padding: 3px 13px; border-radius: 12px; min-width: 110px; min-height: 46px;
  background: rgba(255,255,255,.03); border: 1px solid #27272a; justify-content: center;
}
.ans.empty { color: #52525b; font-weight: 400; }
@keyframes caret { 0%,45% { opacity: 1; } 50%,100% { opacity: 0; } }
.ans .caret { width: 2px; height: 1em; background: #f59e0b; margin-left: 3px; animation: caret 1.1s step-end infinite; }
@keyframes shake { 10%,90% { transform: translateX(-2px); } 20%,80% { transform: translateX(4px); } 30%,50%,70% { transform: translateX(-6px); } 40%,60% { transform: translateX(6px); } }
.stage.shake .ans { color: #ef4444; border-color: rgba(239,68,68,.5); animation: shake .45s cubic-bezier(.36,.07,.19,.97) both; }
.tleft { text-align: center; font-size: 11px; color: #52525b; margin-bottom: 14px; letter-spacing: .1em; }
.tleft b { color: #d4d4d8; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
.tleft.urgent { animation: pulse 1s ease-in-out infinite; color: #fbbf24; }
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.key {
  padding: 12px 0; border-radius: 12px; background: #18181b; border: 1px solid #27272a;
  font-size: 18px; font-weight: 700; min-height: 50px; transition: transform .08s, background .08s, border-color .08s;
}
.key:hover { background: #1f1f23; border-color: #3f3f46; }
.key:active { transform: scale(.94); }
.key.op { color: #fbbf24; }
.key.go { background: rgba(52,211,153,.14); border-color: rgba(52,211,153,.4); color: #34d399; grid-column: span 2; }
.hint { margin-top: 12px; text-align: center; font-size: 10px; color: #52525b; letter-spacing: .08em; }
.quit { position: absolute; top: 0; right: 0; padding: 7px 10px; border-radius: 9px; color: #71717a; font-size: 11px; }
.quit:hover { color: #d4d4d8; background: rgba(255,255,255,.05); }

/* steal toast */
.toast {
  position: absolute; left: 50%; top: 8px; transform: translateX(-50%);
  padding: 7px 14px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: .04em;
  background: rgba(245,158,11,.16); border: 1px solid rgba(245,158,11,.5); color: #fbbf24;
  opacity: 0; pointer-events: none; transition: opacity .25s, top .25s; z-index: 5; white-space: nowrap;
}
.toast.show { opacity: 1; top: 2px; }

/* ── handoff between turns ── */
.handoff { text-align: center; padding: 26px 0; }
.handoff .who { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; margin-bottom: 10px; }
.handoff .who.a { color: #34d399; } .handoff .who.b { color: #fbbf24; }
.handoff h2 { font-size: clamp(24px, 6vw, 34px); font-weight: 700; margin-bottom: 22px; }
.handoff .ready { padding: 13px 26px; border-radius: 13px; background: #f59e0b; color: #1c1207; font-weight: 700; font-size: 14px; }
.handoff p { margin-top: 14px; color: #71717a; font-size: 11.5px; }

/* ── results ── */
.res { text-align: center; }
.res .medal { font-size: 12px; letter-spacing: .2em; color: #f59e0b; margin-bottom: 10px; text-transform: uppercase; }
.res h2 { font-size: clamp(28px, 7vw, 42px); font-weight: 700; line-height: 1.1; margin-bottom: 6px; }
.res h2.a { color: #34d399; } .res h2.b { color: #fbbf24; }
.res .rsub { color: #a1a1aa; font-size: 12.5px; margin-bottom: 20px; }
.resgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 18px; }
.resp { border-radius: 12px; padding: 14px 10px; background: #18181b; border: 1px solid #27272a; }
.resp .nm { font-size: 10px; color: #71717a; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.resp .v { font-size: 22px; font-weight: 700; margin-bottom: 3px; }
.resp .v.a { color: #34d399; } .resp .v.b { color: #fbbf24; }
.resp .d { font-size: 10.5px; color: #71717a; }
.again { width: 100%; padding: 14px; border-radius: 13px; background: #f59e0b; color: #1c1207; font-weight: 700; font-size: 14px; }
.homebtn { margin-top: 9px; width: 100%; padding: 11px; border-radius: 13px; border: 1px solid #27272a; color: #a1a1aa; font-size: 12.5px; }
.homebtn:hover { color: #fafafa; border-color: #3f3f46; }

@media (max-height: 640px) {
  .stage { margin-bottom: 12px; } .ans { min-height: 38px; margin-top: 7px; }
  .key { padding: 9px 0; min-height: 42px; }
  .duel-hud { margin-bottom: 12px; } .turn-banner { margin-bottom: 10px; padding: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  .ans .caret, .stage.shake .ans, .tleft.urgent, .toast { animation: none; transition: none; }
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
"use strict";
/* gn-math duel — two players, alternating turns, steals on misses. */
(function () {
  var app = document.getElementById("app");
  var TURN_MS = 15000;
  var ROUNDS = [5, 7, 10];
  var rounds = 7;
  var D = [
    { max: 12, label: "gentle" },
    { max: 25, label: "brisk" },
    { max: 99, label: "spicy" }
  ];
  var di = 1;
  var players = [{ name: "Player 1" }, { name: "Player 2" }];
  var LS = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function makeQuestion() {
    var max = D[di].max;
    var kind = rand(0, 3);
    if (kind === 0) { var a = rand(2, max), b = rand(2, max); return { a: a, b: b, op: "+", answer: a + b }; }
    if (kind === 1) { var x = rand(2, max), y = rand(2, max); if (y > x) { var t = x; x = y; y = t; } return { a: x, b: y, op: "−", answer: x - y }; }
    if (kind === 2) { var m = rand(2, Math.min(12, max)), n = rand(2, Math.min(12, max)); return { a: m, b: n, op: "×", answer: m * n }; }
    var dv = rand(2, Math.min(12, max)), q = rand(2, Math.min(12, max));
    return { a: dv * q, b: dv, op: "÷", answer: q };
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }

  function renderSetup() {
    var last = LS.get("gnm:duel:names");
    if (last) { try { var p = JSON.parse(last); players[0].name = p[0]; players[1].name = p[1]; } catch (e) {} }
    app.innerHTML =
      '<div class="brand"><b>gn<span>-</span>math</b><em>DUEL · 2 PLAYERS</em></div>' +
      '<div class="setup">' +
      '<h1>Two brains.<br>One screen.</h1>' +
      '<p class="sub">Alternate turns of mental math. Miss one and the other player can steal it. Highest total wins.</p>' +
      '<div class="names">' +
      '<div class="field"><label class="p1" for="p1">Player 1 · green</label><input id="p1" maxlength="14" value="' + esc(players[0].name) + '"></div>' +
      '<div class="field"><label class="p2" for="p2">Player 2 · amber</label><input id="p2" maxlength="14" value="' + esc(players[1].name) + '"></div>' +
      '</div>' +
      '<div class="group" style="margin-bottom:8px"><div class="lbl" style="font-size:10px;letter-spacing:.18em;color:#71717a;margin-bottom:7px">Questions each</div>' +
      '<div class="rounds">' +
      ROUNDS.map(function (r) { return '<button type="button" class="chip" data-r="' + r + '" aria-pressed="' + (r === rounds) + '"><b>' + r + '</b><span>questions</span></button>'; }).join("") +
      '</div></div>' +
      '<div class="group" style="margin-bottom:8px"><div class="lbl" style="font-size:10px;letter-spacing:.18em;color:#71717a;margin-bottom:7px">Heat</div>' +
      '<div class="rounds">' +
      D.map(function (d, i) { return '<button type="button" class="chip" data-d="' + i + '" aria-pressed="' + (i === di) + '"><b>' + d.label + '</b><span>to ' + d.max + '</span></button>'; }).join("") +
      '</div></div>' +
      '<button type="button" class="start" id="start">Begin the duel</button>' +
      '</div>';
    app.querySelectorAll("[data-r]").forEach(function (b) {
      b.addEventListener("click", function () { rounds = Number(b.getAttribute("data-r")); renderSetup(); });
    });
    app.querySelectorAll("[data-d]").forEach(function (b) {
      b.addEventListener("click", function () { di = Number(b.getAttribute("data-d")); renderSetup(); });
    });
    document.getElementById("start").addEventListener("click", function () {
      players[0].name = document.getElementById("p1").value.trim() || "Player 1";
      players[1].name = document.getElementById("p2").value.trim() || "Player 2";
      LS.set("gnm:duel:names", JSON.stringify([players[0].name, players[1].name]));
      startDuel();
    });
  }

  var game = null;
  function startDuel() {
    game = {
      turn: 0, qIndex: 0, q: null, input: "", timer: null, end: 0, steal: false,
      ps: [
        { name: players[0].name, score: 0, right: 0, miss: 0, steals: 0 },
        { name: players[1].name, score: 0, right: 0, miss: 0, steals: 0 }
      ]
    };
    nextQuestion();
  }
  function nextQuestion() {
    game.q = makeQuestion();
    game.input = "";
    game.steal = false;
    renderTurn();
    startTimer();
  }
  function startTimer() {
    clearInterval(game.timer);
    game.end = Date.now() + TURN_MS;
    game.timer = setInterval(tick, 200);
    tick();
  }
  function tick() {
    if (!game) return;
    var left = Math.max(0, game.end - Date.now());
    var el = document.getElementById("tleft");
    if (el) {
      el.innerHTML = "<b>" + Math.ceil(left / 1000) + "s</b> on the clock";
      el.classList.toggle("urgent", left < 5000);
    }
    if (left <= 0) {
      clearInterval(game.timer);
      timeUp();
    }
  }
  function renderTurn() {
    var p = game.ps[game.turn];
    var other = game.ps[1 - game.turn];
    var side = game.turn === 0 ? "a" : "b";
    app.innerHTML =
      '<button type="button" class="quit" id="quit">✕ quit</button>' +
      '<div class="toast" id="toast"></div>' +
      '<div class="duel-hud">' +
      '<div class="duel-p a' + (game.turn === 0 ? "" : "") + '"><div class="nm">' + esc(game.ps[0].name) + '</div><div class="sc">' + game.ps[0].score + '</div></div>' +
      '<div class="duel-mid"><b>' + (game.qIndex + 1) + '</b> of ' + rounds + '<br>' + (game.steal ? "steal!" : "turn") + '</div>' +
      '<div class="duel-p b"><div class="nm">' + esc(game.ps[1].name) + '</div><div class="sc">' + game.ps[1].score + '</div></div>' +
      '</div>' +
      '<div class="turn-banner ' + side + '">' + (game.steal ? "steal chance — " : "") + esc(p.name) + (game.steal ? " avenges" : " is up") + '</div>' +
      '<div class="stage" id="stage">' +
      '<div class="q">' + game.q.a + '<span class="op">' + game.q.op + '</span>' + game.q.b + '</div>' +
      '<div class="ans empty" id="ans">…</div>' +
      '</div>' +
      '<div class="tleft" id="tleft"><b>15s</b> on the clock</div>' +
      '<div class="pad" id="pad"></div>' +
      '<div class="hint">type · enter locks it in</div>';
    document.querySelectorAll(".duel-p").forEach(function (d) { d.classList.remove("a", "b"); });
    document.querySelectorAll(".duel-p")[0].className = "duel-p " + (game.turn === 0 ? "a" : "");
    document.querySelectorAll(".duel-p")[1].className = "duel-p " + (game.turn === 1 ? "b" : "");
    var pad = document.getElementById("pad");
    "1234567890".split("").forEach(function (d) {
      var k = document.createElement("button");
      k.type = "button"; k.className = "key"; k.textContent = d;
      k.addEventListener("click", function () { press(d); });
      pad.appendChild(k);
    });
    var bk = document.createElement("button");
    bk.type = "button"; bk.className = "key op"; bk.innerHTML = "⌫";
    bk.addEventListener("click", function () { press("bk"); });
    pad.appendChild(bk);
    var go = document.createElement("button");
    go.type = "button"; go.className = "key go"; go.innerHTML = "lock it ↵";
    go.addEventListener("click", submit);
    pad.appendChild(go);
    document.getElementById("quit").addEventListener("click", function () {
      if (game) clearInterval(game.timer);
      game = null; renderSetup();
    });
    updateHUD();
  }
  function updateHUD() {
    var el = document.querySelector(".duel-mid");
    if (el) el.innerHTML = "<b>" + (game.qIndex + 1) + "</b> of " + rounds + "<br>" + (game.steal ? "steal!" : "turn");
    document.querySelectorAll(".duel-p .sc")[0].textContent = String(game.ps[0].score);
    document.querySelectorAll(".duel-p .sc")[1].textContent = String(game.ps[1].score);
  }
  function updAns() {
    var a = document.getElementById("ans");
    if (!a) return;
    a.className = game.input ? "ans" : "ans empty";
    a.innerHTML = game.input ? game.input + '<span class="caret"></span>' : "…";
  }
  function press(k) {
    if (!game) return;
    if (k === "bk") game.input = game.input.slice(0, -1);
    else if (game.input.length < 7) game.input += k;
    updAns();
  }
  function flashSteal(msg) {
    var t = document.getElementById("toast");
    if (!t) return;
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 1800);
  }
  function submit() {
    if (!game || !game.input) return;
    clearInterval(game.timer);
    var val = parseInt(game.input, 10);
    if (val === game.q.answer) {
      var gain = game.steal ? 15 : 10;
      game.ps[game.turn].score += gain;
      game.ps[game.turn].right++;
      if (game.steal) { game.ps[game.turn].steals++; flashSteal("stolen! +" + gain); }
      advance();
    } else {
      game.ps[game.turn].miss++;
      var st = document.getElementById("stage");
      if (st) { st.classList.add("shake"); }
      if (!game.steal) {
        setTimeout(function () {
          game.steal = true;
          game.turn = 1 - game.turn;
          game.input = "";
          flashSteal("missed — " + esc(game.ps[game.turn].name) + " can steal");
          renderTurn(); startTimer();
        }, 650);
      } else {
        setTimeout(function () { flashSteal("both missed — answer was " + game.q.answer); setTimeout(advance, 900); }, 500);
      }
    }
  }
  function timeUp() {
    if (!game) return;
    if (!game.steal) {
      game.steal = true;
      game.turn = 1 - game.turn;
      game.input = "";
      flashSteal("time! " + esc(game.ps[game.turn].name) + " can steal");
      renderTurn(); startTimer();
    } else {
      flashSteal("nobody got it — answer was " + game.q.answer);
      setTimeout(function () { if (game) advance(); }, 1100);
    }
  }
  function advance() {
    game.qIndex++;
    if (game.qIndex >= rounds) { finishDuel(); return; }
    game.turn = game.qIndex % 2;
    nextQuestion();
  }
  function finishDuel() {
    clearInterval(game.timer);
    var a = game.ps[0], b = game.ps[1];
    var winner = a.score > b.score ? 0 : b.score > a.score ? 1 : -1;
    var medal = winner === -1 ? "dead even" : "takes the duel";
    app.innerHTML =
      '<div class="brand"><b>gn<span>-</span>math</b><em>DUEL RESULTS</em></div>' +
      '<div class="res">' +
      '<div class="medal">' + medal + '</div>' +
      (winner === -1
        ? '<h2>' + a.score + " — " + b.score + '</h2><p class="rsub">nobody blinks. rematch.</p>'
        : '<h2 class="' + (winner === 0 ? "a" : "b") + '">' + esc(game.ps[winner].name) + '</h2><p class="rsub">' + game.ps[winner].score + " over " + game.ps[1 - winner].score + '</p>') +
      '<div class="resgrid">' +
      '<div class="resp"><div class="nm">' + esc(a.name) + '</div><div class="v a">' + a.score + '</div><div class="d">' + a.right + " right · " + a.miss + " missed · " + a.steals + " stolen</div></div>" +
      '<div class="resp"><div class="nm">' + esc(b.name) + '</div><div class="v b">' + b.score + '</div><div class="d">' + b.right + " right · " + b.miss + " missed · " + b.steals + " stolen</div></div>" +
      '</div>' +
      '<button type="button" class="again" id="again">↵ rematch</button>' +
      '<button type="button" class="homebtn" id="home">back to setup</button>' +
      '</div>';
    document.getElementById("again").addEventListener("click", startDuel);
    document.getElementById("home").addEventListener("click", renderSetup);
    game = null;
  }

  document.addEventListener("keydown", function (e) {
    if (!game) {
      if (e.key === "Enter") {
        var s = document.getElementById("start");
        if (s) { e.preventDefault(); s.click(); return; }
        var ag = document.getElementById("again");
        if (ag) { e.preventDefault(); ag.click(); }
      }
      return;
    }
    if (document.activeElement && document.activeElement.tagName === "INPUT") return;
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === "Backspace") { e.preventDefault(); press("bk"); }
    else if (e.key === "Enter") { e.preventDefault(); submit(); }
  });

  renderSetup();
})();
</script>
</body>
</html>
