<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Drawing Pad — Sulfur OS</title>
<style>
:root{color-scheme:dark;--bg:#09090b;--card:#18181b;--bd:#27272a;--bd2:#3f3f46;--tx:#e4e4e7;--mut:#a1a1aa;--dim:#71717a;--amber:#f59e0b;--amber-h:#fbbf24;--tint:rgba(245,158,11,.14);--mono:ui-monospace,Menlo,Consolas,monospace;--sh:0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{display:block}
.topbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(24,24,27,.92);border-bottom:1px solid var(--bd);flex:none}
.tb-icon{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#fbbf24,#d97706);color:#1c1206;display:grid;place-items:center;flex:none}
.tb-name{font-weight:700;font-size:14.5px;white-space:nowrap}
.chip{font-size:10px;font-weight:800;letter-spacing:.18em;color:var(--amber);background:var(--tint);border:1px solid rgba(245,158,11,.35);padding:2px 8px;border-radius:999px;flex:none}
.spacer{flex:1}
.ibtn{width:40px;height:40px;display:grid;place-items:center;border-radius:8px;background:#202024;border:1px solid var(--bd);transition:background .12s,border-color .12s,transform .06s,opacity .12s;color:var(--mut)}
.ibtn:hover{background:#26262b;border-color:var(--bd2);color:var(--tx)}
.ibtn:active{transform:scale(.96)}
.ibtn:disabled{opacity:.35;cursor:not-allowed}
.wrap{flex:1;display:flex;min-height:0}
.side{width:210px;flex:none;overflow-y:auto;border-right:1px solid var(--bd);background:#101012;padding:12px;display:flex;flex-direction:column;gap:14px}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:6px;display:block}
.t2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.t2 button{min-height:44px;border-radius:8px;background:#202024;border:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--mut);transition:background .12s,border-color .12s,color .12s,transform .06s}
.t2 button:hover{background:#26262b;color:var(--tx)}
.t2 button:active{transform:scale(.97)}
.t2 button.on{background:var(--tint);border-color:rgba(245,158,11,.55);color:var(--amber)}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.sw{height:36px;border-radius:7px;border:1px solid rgba(255,255,255,.16);transition:transform .1s,box-shadow .1s}
.sw:hover{transform:scale(1.09)}
.sw.on{box-shadow:0 0 0 2px #101012,0 0 0 4px var(--amber)}
input[type=color]{-webkit-appearance:none;appearance:none;width:100%;height:40px;border:1px solid var(--bd);border-radius:8px;background:#202024;padding:4px;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:5px}
input[type=color]::-moz-color-swatch{border:0;border-radius:5px}
.sizerow{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.sizerow b{font-family:var(--mono);font-size:12px;color:var(--amber);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#27272a}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--amber);margin-top:-7px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#27272a}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:var(--amber)}
.pv{margin-top:8px;height:56px;border-radius:8px;border:1px dashed var(--bd2);display:grid;place-items:center;background:#141416}
.pv i{display:block;border-radius:50%;background:var(--amber);transition:width .08s,height .08s,background .08s}
.hint{font-size:11px;color:var(--dim);line-height:1.6}
.stage{flex:1;min-width:0;min-height:0;display:grid;place-items:center;padding:16px;background:#0b0b0d;position:relative;overflow:auto}
.board{position:relative;max-width:100%;max-height:100%;border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);overflow:hidden;line-height:0}
canvas{touch-action:none;cursor:crosshair;display:block;max-width:100%;max-height:100%;width:auto;height:auto}
#ghost{position:absolute;border-radius:50%;pointer-events:none;border:1.5px solid rgba(251,191,36,.9);transform:translate(-50%,-50%);display:none;z-index:5}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(14px);background:#202024;color:var(--tx);border:1px solid rgba(245,158,11,.45);border-left:3px solid var(--amber);padding:9px 16px;border-radius:10px;font-size:13px;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:99;max-width:88vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#confirm{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
#confirm.show{display:flex}
.cf{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;max-width:340px;width:100%;box-shadow:var(--sh)}
.cf h3{font-size:15px;font-weight:700;margin-bottom:6px}
.cf p{font-size:13px;color:var(--mut);margin-bottom:18px}
.cf-a{display:flex;gap:10px;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 16px;border-radius:8px;background:#202024;border:1px solid var(--bd);font-size:13px;font-weight:600;transition:background .12s,border-color .12s,transform .06s}
.btn:hover{background:#26262b;border-color:var(--bd2)}
.btn:active{transform:scale(.97)}
.btn.amber{background:var(--amber);border-color:transparent;color:#1c1206}
.btn.amber:hover{background:var(--amber-h)}
noscript>div{padding:40px;text-align:center;color:var(--mut)}
@media (max-width:720px){
.wrap{flex-direction:column}
.side{width:100%;flex:none;border-right:0;border-bottom:1px solid var(--bd);display:grid;grid-template-columns:1fr 1fr;gap:12px;overflow:visible}
.side .sec-col{grid-column:1/-1}
.pal{grid-template-columns:repeat(10,1fr)}
.sw{height:32px}
.stage{padding:10px}
}
</style>
</head>
<body>
<noscript><div>Drawing Pad needs JavaScript to draw. Please enable it and reload.</div></noscript>
<header class="topbar">
  <div class="tb-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M11.3 2.2l2.5 2.5-8.7 8.7-3.4 1 1-3.4 8.6-8.8z"/></svg></div>
  <span class="tb-name">Drawing Pad</span>
  <span class="chip">Sulfur</span>
  <span class="spacer"></span>
  <button class="ibtn" id="undo" aria-label="Undo (Ctrl+Z)" title="Undo (Ctrl+Z)" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h6.5a3.5 3.5 0 1 1 0 7H7"/><path d="M6 4 3 7l3 3"/></svg></button>
  <button class="ibtn" id="redo" aria-label="Redo (Ctrl+Y)" title="Redo (Ctrl+Y)" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 7H6.5a3.5 3.5 0 1 0 0 7H9"/><path d="M10 4l3 3-3 3"/></svg></button>
  <button class="ibtn" id="png" aria-label="Save PNG" title="Save PNG"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v7M5 7l3 3 3-3"/><path d="M3 11v1.5A1.5 1.5 0 0 0 4.5 14h7a1.5 1.5 0 0 0 1.5-1.5V11"/></svg></button>
  <button class="ibtn" id="clear" aria-label="Clear drawing" title="Clear drawing"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h11M6 4V2.8c0-.4.4-.8.8-.8h2.4c.4 0 .8.4.8.8V4M4 4l.6 9.2c0 .4.4.8.9.8h5c.5 0 .9-.4.9-.8L12 4"/></svg></button>
</header>
<div class="wrap">
  <aside class="side">
    <div>
      <label class="lbl" id="lbl-tool">Tool</label>
      <div class="t2" role="group" aria-labelledby="lbl-tool">
        <button id="brushBtn" class="on" aria-label="Brush"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M11.3 2.2l2.5 2.5-8.7 8.7-3.4 1 1-3.4 8.6-8.8z"/></svg>brush</button>
        <button id="eraseBtn" aria-label="Eraser"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2.5 11.5l6.3-8.7 4.9 3.6-6.2 8.6H4.7l-2.2-3.5z"/><path d="M6.2 6.4l4.4 3.2"/></svg>erase</button>
      </div>
    </div>
    <div>
      <label class="lbl" id="lbl-pal">Swatches</label>
      <div class="pal" id="pal" role="group" aria-labelledby="lbl-pal"></div>
    </div>
    <div class="sec-col">
      <label class="lbl" for="custom">Custom color</label>
      <input type="color" id="custom" value="#f59e0b" aria-label="Custom color">
    </div>
    <div class="sec-col">
      <div class="sizerow"><label class="lbl" for="size" style="margin:0">Brush size</label><b id="sizeVal">6 px</b></div>
      <input type="range" id="size" min="1" max="40" step="1" value="6" aria-label="Brush size, 1 to 40 pixels">
      <div class="pv" aria-hidden="true"><i id="pvd"></i></div>
      <p class="hint" style="margin-top:10px">One finger draws on touch. Undo keeps the last 30 strokes.</p>
    </div>
  </aside>
  <main class="stage" id="stage">
    <div class="board"><canvas id="cv" width="1200" height="800" aria-label="Drawing canvas — draw here"></canvas></div>
    <div id="ghost" aria-hidden="true"></div>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="confirm" role="dialog" aria-modal="true" aria-labelledby="cfTitle">
  <div class="cf">
    <h3 id="cfTitle">Are you sure?</h3>
    <p id="cfMsg"></p>
    <div class="cf-a">
      <button class="btn" id="cfNo">Cancel</button>
      <button class="btn amber" id="cfOk">Confirm</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';
var $ = function(s){ return document.querySelector(s); };
var W = 1200, H = 800, BG = '#101014';
var COLORS = ['#f59e0b','#fbbf24','#f97316','#ef4444','#ec4899','#a855f7','#3b82f6','#14b8a6','#22c55e','#f4f4f5'];

/* ---- toast ---- */
var toastEl = $('#toast'), toastT = 0;
function toast(msg, ms){ toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove('show'); }, ms || 1900); }

/* ---- confirm ---- */
var cf = $('#confirm'), cfRes = null;
function cfEnd(v){ cf.classList.remove('show'); if (cfRes) { var r = cfRes; cfRes = null; r(v); } }
$('#cfOk').addEventListener('click', function(){ cfEnd(true); });
$('#cfNo').addEventListener('click', function(){ cfEnd(false); });
cf.addEventListener('click', function(e){ if (e.target === cf) cfEnd(false); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && cf.classList.contains('show')) cfEnd(false); });
function confirmDlg(title, msg, okLabel){
  $('#cfTitle').textContent = title; $('#cfMsg').textContent = msg;
  var ok = $('#cfOk'); ok.textContent = okLabel || 'Confirm';
  cf.classList.add('show'); ok.focus();
  return new Promise(function(res){ cfRes = res; });
}

/* ---- state ---- */
var color = '#f59e0b', brush = 6, mode = 'brush';
var cv = $('#cv'), ctx = cv.getContext('2d');
var drawing = false, last = null, lastMid = null;
var undoS = [], redoS = [];
var ghostEl = $('#ghost'), stage = $('#stage');

ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
ctx.lineCap = 'round'; ctx.lineJoin = 'round';
undoS.push(ctx.getImageData(0, 0, W, H));

/* ---- palette ---- */
var palEl = $('#pal');
COLORS.forEach(function(c){
  var b = document.createElement('button');
  b.className = 'sw'; b.style.background = c;
  b.setAttribute('aria-label', c); b.title = c;
  b.addEventListener('click', function(){ setColor(c); setMode('brush'); });
  palEl.appendChild(b);
});
function setColor(c){
  color = c;
  Array.prototype.forEach.call(palEl.children, function(el, i){
    el.classList.toggle('on', COLORS[i] === c && mode === 'brush');
  });
  try { $('#custom').value = c; } catch(e){}
  $('#pvd').style.background = c;
  ghost();
}
function setMode(m){
  mode = m;
  $('#brushBtn').classList.toggle('on', m === 'brush');
  $('#eraseBtn').classList.toggle('on', m === 'eraser');
  cv.style.cursor = m === 'eraser' ? 'cell' : 'crosshair';
  pvd.style.background = m === 'eraser' ? '#71717a' : color;
  Array.prototype.forEach.call(palEl.children, function(el, i){
    el.classList.toggle('on', COLORS[i] === color && m === 'brush');
  });
  ghost();
}
$('#brushBtn').addEventListener('click', function(){ setMode('brush'); });
$('#eraseBtn').addEventListener('click', function(){ setMode('eraser'); });
$('#custom').addEventListener('input', function(e){ setColor(e.target.value); setMode('brush'); });

/* ---- brush size ---- */
var sizeEl = $('#size'), sizeVal = $('#sizeVal'), pvd = $('#pvd');
function applySize(v){
  brush = v; sizeVal.textContent = v + ' px';
  pvd.style.width = v + 'px'; pvd.style.height = v + 'px';
  pvd.style.background = mode === 'eraser' ? '#71717a' : color;
  ghost();
}
sizeEl.addEventListener('input', function(e){ applySize(parseInt(e.target.value, 10) || 1); });
applySize(6);

/* ---- drawing ---- */
function pos(e){
  var r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function begin(p){
  drawing = true; last = p; lastMid = p;
  ctx.strokeStyle = mode === 'eraser' ? BG : color;
  ctx.fillStyle = ctx.strokeStyle;
  ctx.lineWidth = brush;
  ctx.beginPath(); ctx.arc(p.x, p.y, brush / 2, 0, Math.PI * 2); ctx.fill();
}
function extend(p){
  if (!drawing) return;
  var mid = { x: (last.x + p.x) / 2, y: (last.y + p.y) / 2 };
  ctx.beginPath();
  ctx.moveTo(lastMid.x, lastMid.y);
  ctx.quadraticCurveTo(last.x, last.y, mid.x, mid.y);
  ctx.stroke();
  last = p; lastMid = mid;
}
function endStroke(){
  if (!drawing) return;
  drawing = false; last = null; lastMid = null;
  try { undoS.push(ctx.getImageData(0, 0, W, H)); } catch(e){}
  if (undoS.length > 31) undoS.shift();
  redoS.length = 0; syncHist();
}
cv.addEventListener('pointerdown', function(e){
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch(err){}
  begin(pos(e));
});
cv.addEventListener('pointermove', function(e){ extend(pos(e)); ghostMove(e); });
cv.addEventListener('pointerup', endStroke);
cv.addEventListener('pointercancel', endStroke);

/* ---- ghost cursor preview ---- */
function ghost(){
  if (mode === 'eraser') { ghostEl.style.background = 'rgba(161,161,170,.15)'; ghostEl.style.borderColor = 'rgba(251,191,36,.9)'; }
  else { ghostEl.style.background = color; ghostEl.style.borderColor = 'rgba(255,255,255,.55)'; }
}
function ghostMove(e){
  var r = cv.getBoundingClientRect(), sr = stage.getBoundingClientRect();
  var k = r.width / W;
  var d = Math.max(3, brush * k);
  ghostEl.style.width = d + 'px'; ghostEl.style.height = d + 'px';
  ghostEl.style.left = (e.clientX - sr.left + stage.scrollLeft) + 'px';
  ghostEl.style.top = (e.clientY - sr.top + stage.scrollTop) + 'px';
  ghostEl.style.display = 'block';
}
cv.addEventListener('pointerenter', function(){ ghost(); });
cv.addEventListener('pointerleave', function(){ ghostEl.style.display = 'none'; });

/* ---- history ---- */
function undo(){
  if (undoS.length < 2) return;
  redoS.push(undoS.pop());
  ctx.putImageData(undoS[undoS.length - 1], 0, 0);
  syncHist();
}
function redo(){
  if (!redoS.length) return;
  var snap = redoS.pop();
  undoS.push(snap);
  ctx.putImageData(snap, 0, 0);
  syncHist();
}
function syncHist(){
  $('#undo').disabled = undoS.length < 2;
  $('#redo').disabled = !redoS.length;
}
$('#undo').addEventListener('click', undo);
$('#redo').addEventListener('click', redo);
syncHist();

/* ---- clear / save ---- */
function wipe(){
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  try { undoS.push(ctx.getImageData(0, 0, W, H)); } catch(e){}
  if (undoS.length > 31) undoS.shift();
  redoS.length = 0; syncHist();
}
$('#clear').addEventListener('click', function(){
  confirmDlg('Clear drawing?', 'The whole canvas goes back to blank. Undo can bring it back.', 'Clear').then(function(ok){
    if (!ok) return;
    wipe(); toast('Canvas cleared');
  });
});
$('#png').addEventListener('click', function(){
  try {
    var a = document.createElement('a');
    a.href = cv.toDataURL('image/png');
    a.download = 'sulfur-drawing.png';
    document.body.appendChild(a); a.click(); a.remove();
    toast('PNG saved');
  } catch (err) { toast('Save failed'); }
});

/* ---- keyboard ---- */
document.addEventListener('keydown', function(e){
  var t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;
  if (e.ctrlKey || e.metaKey) {
    var k = e.key.toLowerCase();
    if (k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (k === 'y') { e.preventDefault(); redo(); }
  }
});

setColor('#f59e0b'); setMode('brush');
})();
</script>
</body>
</html>
