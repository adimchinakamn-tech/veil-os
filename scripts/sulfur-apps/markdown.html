<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Markdown — Sulfur OS</title>
<style>
:root{color-scheme:dark;--bg:#09090b;--card:#18181b;--bd:#27272a;--bd2:#3f3f46;--tx:#e4e4e7;--mut:#a1a1aa;--dim:#71717a;--amber:#f59e0b;--amber-h:#fbbf24;--tint:rgba(245,158,11,.14);--mono:ui-monospace,Menlo,Consolas,monospace;--sh:0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{display:block}
.topbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(24,24,27,.92);border-bottom:1px solid var(--bd);flex:none}
.tb-icon{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#fbbf24,#d97706);color:#1c1206;display:grid;place-items:center;flex:none}
.tb-name{font-weight:700;font-size:14.5px;white-space:nowrap}
.chip{font-size:10px;font-weight:800;letter-spacing:.18em;color:var(--amber);background:var(--tint);border:1px solid rgba(245,158,11,.35);padding:2px 8px;border-radius:999px;flex:none}
.spacer{flex:1}
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 14px;border-radius:8px;background:#202024;border:1px solid var(--bd);font-size:12.5px;font-weight:600;transition:background .12s,border-color .12s,transform .06s}
.tbtn:hover{background:#26262b;border-color:var(--bd2)}
.tbtn:active{transform:scale(.97)}
.tbtn.amber{background:var(--amber);border-color:transparent;color:#1c1206}
.tbtn.amber:hover{background:var(--amber-h)}
.tools{display:flex;gap:5px;padding:8px 12px;border-bottom:1px solid var(--bd);background:#101012;flex:none;overflow-x:auto}
.tools button{min-width:40px;height:40px;padding:0 11px;border-radius:8px;background:#202024;border:1px solid var(--bd);display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mut);transition:background .12s,border-color .12s,color .12s,transform .06s;flex:none}
.tools button:hover{background:#26262b;color:var(--tx)}
.tools button:active{transform:scale(.96)}
.tools .k{font-family:var(--mono);font-size:12.5px;color:var(--tx)}
.split{flex:1;display:flex;min-height:0}
.pane{flex:1;min-width:0;display:flex;flex-direction:column}
.pane+.pane{border-left:1px solid var(--bd)}
.ph{flex:none;display:flex;align-items:center;gap:8px;padding:7px 14px;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--bd);background:#101012}
.ph .dot{width:6px;height:6px;border-radius:50%;background:var(--amber)}
textarea{flex:1;min-height:0;width:100%;resize:none;border:0;outline:none;background:#0c0c0e;color:var(--tx);font-family:var(--mono);font-size:13px;line-height:1.7;padding:16px;tab-size:2}
.pvwrap{flex:1;min-height:0;overflow-y:auto;padding:18px 22px;background:#0c0c0e}
.pv{max-width:44em;font-size:14px;line-height:1.65;color:var(--tx);word-wrap:break-word}
.pv h1,.pv h2,.pv h3,.pv h4{margin:18px 0 8px;line-height:1.25;color:#fafafa}
.pv h1{font-size:26px;border-bottom:1px solid var(--bd);padding-bottom:6px}
.pv h2{font-size:21px}
.pv h3{font-size:17px}
.pv h4{font-size:15px}
.pv p{margin:8px 0}
.pv a{color:var(--amber);text-decoration:underline;text-underline-offset:2px}
.pv a:hover{color:var(--amber-h)}
.pv code{font-family:var(--mono);font-size:12px;background:rgba(245,158,11,.12);color:#fcd34d;border-radius:5px;padding:1px 5px}
.pv pre{margin:10px 0;background:#131316;border:1px solid var(--bd);border-radius:10px;padding:12px 14px;overflow-x:auto}
.pv pre code{background:none;color:#d4d4d8;padding:0;font-size:12px;line-height:1.6}
.pv blockquote{margin:10px 0;padding:2px 14px;border-left:3px solid var(--amber);background:rgba(245,158,11,.07);border-radius:0 8px 8px 0;color:var(--mut)}
.pv ul,.pv ol{margin:8px 0;padding-left:26px}
.pv li{margin:3px 0}
.pv ul ul,.pv ol ol,.pv ul ol,.pv ol ul{margin:3px 0}
.pv hr{border:0;border-top:1px solid var(--bd);margin:18px 0}
.pv del{color:var(--dim)}
.pv>:first-child{margin-top:0}
.foot{display:flex;align-items:center;gap:16px;padding:7px 14px;border-top:1px solid var(--bd);background:rgba(24,24,27,.92);flex:none;font-size:12px;color:var(--dim);flex-wrap:wrap}
.foot b{color:var(--mut);font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.saved{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut);opacity:0;transition:opacity .25s}
.saved.show{opacity:1}
.saved i{width:7px;height:7px;border-radius:50%;background:var(--amber);display:inline-block}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(14px);background:#202024;color:var(--tx);border:1px solid rgba(245,158,11,.45);border-left:3px solid var(--amber);padding:9px 16px;border-radius:10px;font-size:13px;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:99;max-width:88vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
noscript>div{padding:40px;text-align:center;color:var(--mut)}
@media (max-width:719px){
body{overflow:auto}
.split{flex-direction:column}
.pane{height:46vh;flex:none}
.pane+.pane{border-left:0;border-top:1px solid var(--bd)}
}
</style>
</head>
<body>
<noscript><div>Markdown needs JavaScript for live preview. Please enable it and reload.</div></noscript>
<header class="topbar">
  <div class="tb-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3.5h4l1.5 5.5 1.5-5.5h4l-3.5 9h-4l-3.5-9z" transform="translate(0 1.5)"/></svg></div>
  <span class="tb-name">Markdown</span>
  <span class="chip">Sulfur</span>
  <span class="spacer"></span>
  <button class="tbtn" id="copyHtml">Copy HTML</button>
  <button class="tbtn amber" id="exportMd">Export .md</button>
</header>
<div class="tools" role="toolbar" aria-label="Formatting">
  <button data-a="bold" title="Bold" aria-label="Bold"><b>B</b></button>
  <button data-a="italic" title="Italic" aria-label="Italic"><i>I</i></button>
  <button data-a="h" title="Heading (toggle ##)" aria-label="Toggle heading"><span class="k">H</span></button>
  <button data-a="code" title="Inline code" aria-label="Inline code"><span class="k">&lt;&gt;</span></button>
  <button data-a="quote" title="Quote" aria-label="Quote"><span class="k">&gt;</span></button>
  <button data-a="ul" title="Bullet list" aria-label="Bullet list"><span class="k">•</span></button>
  <button data-a="ol" title="Numbered list" aria-label="Numbered list"><span class="k">1.</span></button>
</div>
<div class="split">
  <section class="pane" aria-label="Editor">
    <div class="ph"><span class="dot"></span>Markdown</div>
    <textarea id="ta" spellcheck="false" aria-label="Markdown source" placeholder="# Start typing…"></textarea>
  </section>
  <section class="pane" aria-label="Preview">
    <div class="ph"><span class="dot"></span>Preview</div>
    <div class="pvwrap"><div class="pv" id="pv" aria-live="polite"></div></div>
  </section>
</div>
<footer class="foot">
  <span><b id="w">0</b> words</span>
  <span><b id="c">0</b> chars</span>
  <span><b id="l">1</b> lines</span>
  <span class="saved" id="saved" aria-live="polite"><i></i><span id="savedTxt">Saved</span></span>
</footer>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
var $ = function(s){ return document.querySelector(s); };
var KEY = 'sulfur.studio.md';
var DEFAULT = '# Welcome to **Sulfur Markdown**\n\nA tiny editor with a live preview — everything runs offline in one file.\n\n## Features\n- Headings, **bold**, *italic*, ~~strike~~\n- `inline code` and fenced blocks\n- Nested lists\n  - like this one\n- [links](https://example.com) open in a new tab\n\n1. ordered lists\n2. also work\n\n> Block quotes look like this.\n\n---\n\n```js\nfunction greet(name) {\n  return "Hello, " + name;\n}\n```\n\nHTML in your text, like <script>alert(1)<\/script>, is escaped and shown as plain text.\n';

/* ---- guarded storage ---- */
var LS = (function(){ var ok = false, mem = {};
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); ok = true; } catch(e){}
  return { ok: ok,
    get: function(k){ if (ok) { try { return localStorage.getItem(k); } catch(e){} }
      return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },
    set: function(k, v){ if (ok) { try { localStorage.setItem(k, v); return true; } catch(e){} }
      mem[k] = String(v); return false; } };
})();

/* ---- toast ---- */
var toastEl = $('#toast'), toastT = 0;
function toast(msg, ms){ toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove('show'); }, ms || 1900); }

/* ---- clipboard with fallback ---- */
function copyText(text, okMsg){
  var legacy = function(){
    try {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly','');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, text.length);
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      toast(ok ? (okMsg || 'Copied') : 'Copy failed');
    } catch (e) { toast('Copy failed'); }
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ toast(okMsg || 'Copied'); }, legacy);
      return;
    }
  } catch (e) {}
  legacy();
}

/* ================= tiny markdown renderer ================= */
function esc(s){
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');
}
function inline(s){
  var codes = [];
  var t = esc(s);
  t = t.replace(/`([^`\n]+)`/g, function(m, c){ codes.push('<code>' + c + '</code>'); return '\u0000I' + (codes.length - 1) + '\u0000'; });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*/g, '$1<em>$2</em>');
  t = t.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(m, txt, url){
    var safe = (/^(https?:\/\/|mailto:|\/\/|#|\/)/i.test(url)) ? url : '#';
    return '<a href="' + safe + '" target="_blank" rel="noopener noreferrer">' + txt + '</a>';
  });
  t = t.replace(/\u0000I(\d+)\u0000/g, function(m, i){ return codes[+i] || ''; });
  return t;
}
var HR = /^(\s*)(-{3,}|\*{3,}|_{3,})\s*$/;
var LI = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
var HD = /^(#{1,4})\s+(.*)$/;
function blockStart(line){
  return HD.test(line) || /^>\s?/.test(line) || LI.test(line) || HR.test(line) ||
    /^\u0000B\d+\u0000\s*$/.test(line);
}
function processLines(lines, codes){
  var out = [], i = 0;
  while (i < lines.length) {
    var line = lines[i];
    if (!line.trim()) { i++; continue; }
    var bm = /^\u0000B(\d+)\u0000\s*$/.exec(line);
    if (bm) { out.push(codes[+bm[1]] || ''); i++; continue; }
    if (HR.test(line)) { out.push('<hr>'); i++; continue; }
    var hm = HD.exec(line);
    if (hm) { out.push('<h' + hm[1].length + '>' + inline(hm[2]) + '</h' + hm[1].length + '>'); i++; continue; }
    if (/^>\s?/.test(line)) {
      var q = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { q.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + processLines(q, codes) + '</blockquote>');
      continue;
    }
    if (LI.test(line)) {
      var items = [];
      while (i < lines.length) {
        var m = LI.exec(lines[i]);
        if (!m) break;
        items.push({ ind: Math.min(3, Math.floor(m[1].replace(/\t/g, '  ').length / 2)), ord: /\d/.test(m[2][0]), txt: m[3] });
        i++;
      }
      out.push(buildList(items));
      continue;
    }
    var para = [];
    while (i < lines.length && lines[i].trim() && !blockStart(lines[i])) { para.push(lines[i]); i++; }
    out.push('<p>' + para.map(inline).join('<br>') + '</p>');
  }
  return out.join('\n');
}
function buildList(items){
  var pos = 0, prev = items[0].ind;
  for (var k = 1; k < items.length; k++) {
    if (items[k].ind > prev) items[k].ind = prev + 1; /* quantize nesting jumps */
    prev = items[k].ind;
  }
  function parse(indent){
    var ord = items[pos].ord, html = '<' + (ord ? 'ol' : 'ul') + '>';
    while (pos < items.length && items[pos].ind >= indent) {
      html += '<li>' + inline(items[pos].txt); pos++;
      if (pos < items.length && items[pos].ind > indent) html += parse(items[pos].ind);
      html += '</li>';
    }
    return html + '</' + (ord ? 'ol' : 'ul') + '>';
  }
  return parse(items[0].ind);
}
function renderMD(src){
  var codes = [];
  var s = String(src == null ? '' : src).replace(/```[^\n]*\n([\s\S]*?)(?:```|(?![\s\S]))/g, function(m, c){
    codes.push('<pre><code>' + esc(c.replace(/\n$/, '')) + '</code></pre>');
    return '\u0000B' + (codes.length - 1) + '\u0000';
  });
  var html = processLines(s.split('\n'), codes);
  return html.replace(/\u0000B(\d+)\u0000/g, function(m, i){ return codes[+i] || ''; });
}
/* ================= end renderer ================= */

/* ---- editor wiring ---- */
var ta = $('#ta'), pv = $('#pv');
function update(){
  try { pv.innerHTML = renderMD(ta.value); } catch (e) { pv.textContent = 'Render error'; }
  var v = ta.value;
  $('#w').textContent = (v.match(/\S+/g) || []).length;
  $('#c').textContent = v.length;
  $('#l').textContent = v ? v.split('\n').length : 1;
  scheduleSave();
}
ta.addEventListener('input', update);

/* ---- toolbar ---- */
function wrapSel(before, after){
  var s = ta.selectionStart, e = ta.selectionEnd;
  ta.setRangeText(before + ta.value.slice(s, e) + after, s, e);
  ta.focus();
  ta.setSelectionRange(s + before.length, e + before.length);
  update();
}
function prefixLines(pfx){
  var v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
  var ls = v.lastIndexOf('\n', s - 1) + 1;
  var le = v.indexOf('\n', e); if (le < 0) le = v.length;
  var lines = v.slice(ls, le).split('\n');
  var all = lines.length > 0 && lines.every(function(l){ return l.indexOf(pfx) === 0; });
  var out = lines.map(function(l){ return all ? l.slice(pfx.length) : pfx + l; }).join('\n');
  ta.setRangeText(out, ls, le);
  ta.focus();
  ta.setSelectionRange(ls, ls + out.length);
  update();
}
Array.prototype.forEach.call(document.querySelectorAll('.tools button'), function(b){
  b.addEventListener('click', function(){
    var a = b.dataset.a;
    if (a === 'bold') wrapSel('**', '**');
    else if (a === 'italic') wrapSel('*', '*');
    else if (a === 'code') wrapSel('`', '`');
    else if (a === 'h') prefixLines('## ');
    else if (a === 'quote') prefixLines('> ');
    else if (a === 'ul') prefixLines('- ');
    else if (a === 'ol') prefixLines('1. ');
  });
});

/* ---- tab inserts two spaces (indent / outdent selection) ---- */
ta.addEventListener('keydown', function(e){
  if (e.key !== 'Tab' || e.ctrlKey || e.metaKey || e.altKey) return;
  e.preventDefault();
  var v = ta.value, s = ta.selectionStart, en = ta.selectionEnd;
  if (s === en && !e.shiftKey) { ta.setRangeText('  ', s, en, 'end'); }
  else {
    var ls = v.lastIndexOf('\n', s - 1) + 1;
    var le = v.indexOf('\n', en); if (le < 0) le = v.length;
    var lines = v.slice(ls, le).split('\n');
    var out = lines.map(function(l){
      if (e.shiftKey) { return l.replace(/^ {1,2}/, '') || ''; }
      return '  ' + l;
    }).join('\n');
    ta.setRangeText(out, ls, le);
    ta.setSelectionRange(ls, ls + out.length);
  }
  update();
});

/* ---- export & copy ---- */
$('#exportMd').addEventListener('click', function(){
  try {
    var b = new Blob([ta.value], { type: 'text/markdown;charset=utf-8' });
    var u = URL.createObjectURL(b);
    var a = document.createElement('a');
    a.href = u; a.download = 'sulfur-note.md';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ try { URL.revokeObjectURL(u); } catch (e) {} }, 4000);
    toast('Exported .md');
  } catch (err) { toast('Export failed'); }
});
$('#copyHtml').addEventListener('click', function(){ copyText(renderMD(ta.value), 'HTML copied'); });

/* ---- autosave / restore ---- */
var saveT = 0, savedT = 0;
function scheduleSave(){ clearTimeout(saveT); saveT = setTimeout(saveNow, 700); }
function saveNow(){
  var persisted = LS.set(KEY, ta.value);
  $('#savedTxt').textContent = persisted ? 'Saved' : 'Saved in memory';
  $('#saved').classList.add('show');
  clearTimeout(savedT); savedT = setTimeout(function(){ $('#saved').classList.remove('show'); }, 2200);
}
(function restore(){
  var restored = false;
  try {
    var raw = LS.get(KEY);
    if (typeof raw === 'string' && raw.length > 0 && raw !== DEFAULT) { ta.value = raw; restored = true; }
    else ta.value = DEFAULT;
  } catch (e) { ta.value = DEFAULT; }
  update();
  if (restored) toast('Draft restored');
})();
})();
</script>
</body>
</html>
