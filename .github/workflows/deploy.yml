name: Deploy to InfinityFree

on:
  push:
    branches:
      - main 
jobs:
  web-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 🚀 Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.H }}
        username: ${{ secrets.HH }}
        password: ${{ secrets.HHH }}
        server-dir: htdocs/
        protocol: ftp         
        port: 21              
