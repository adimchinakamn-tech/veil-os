<script>
//<![CDATA[

/* page-local wiring: dock navigation + recently-viewed rail + stats line */
(function () {
  "use strict";
  var V = window.VEILOS;

  /* dock + inline links */
  document.querySelectorAll("[data-os-nav]").forEach(function (b) {
    b.addEventListener("click", function () {
      window.location.href = V.page(b.getAttribute("data-os-nav"));
    });
  });

  /* recently viewed — the real rail, fed by this copy's visit log */
  function renderRecent() {
    var root = document.querySelector("[data-os-recent-root]");
    if (!root) return;
    var list = V.historyAll();
    if (!list.length) { root.hidden = true; return; }
    root.hidden = false;
    var grid = document.querySelector("[data-os-recent-grid]");
    var html = "";
    list.slice(0, 8).forEach(function (v) {
      var label = (v.title || v.host).slice(0, 42);
      html += '<button type="button" data-os-revisit="' + V.esc(v.url) + '" aria-label="Revisit ' + V.esc(v.host) + '" class="group flex items-center gap-2.5 rounded-2xl border border-white/10 bg-black/35 p-3 text-left backdrop-blur-md transition-all hover:-translate-y-0.5 hover:border-emerald-500/40 hover:bg-black/50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-300">' +
        '<span class="flex size-8 shrink-0 items-center justify-center rounded-lg bg-zinc-800"><img src="https://icons.duckduckgo.com/ip3/' + V.esc(v.host) + '.ico" alt="" width="18" height="18" loading="lazy" class="size-[18px] rounded-sm object-contain" /></span>' +
        '<span class="min-w-0 flex-1"><span class="block truncate text-[12.5px] font-medium text-zinc-200 group-hover:text-zinc-100">' + V.esc(label) + '</span>' +
        '<span class="block truncate text-[10.5px] text-zinc-500">' + V.esc(v.host) + "</span></span></button>";
    });
    grid.innerHTML = html;
    grid.querySelectorAll("[data-os-revisit]").forEach(function (b) {
      b.addEventListener("click", function () { window.open(b.getAttribute("data-os-revisit"), "_blank", "noopener"); });
    });

    var stats = document.querySelector("[data-os-stats]");
    if (stats) {
      var hosts = {};
      list.forEach(function (v) { hosts[v.host] = 1; });
      var sites = Object.keys(hosts).length;
      stats.innerHTML = V.esc(sites + " site" + (sites === 1 ? "" : "s") + " visited · " + list.length + " page load" + (list.length === 1 ? "" : "s")) +
        '<span aria-hidden="true" class="mx-2">·</span><button type="button" data-os-nav="settings" class="underline-offset-4 transition hover:text-emerald-300 hover:underline">Settings</button>';
      stats.querySelector("[data-os-nav]").addEventListener("click", function () {
        window.location.href = V.page("settings");
      });
    }
  }
  renderRecent();

  /* F — fullscreen, exactly like the app's home hotkey */
  document.addEventListener("keydown", function (e) {
    var t = e.target;
    var typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable);
    if ((e.key === "f" || e.key === "F") && !typing && !e.metaKey && !e.ctrlKey && !e.altKey) {
      if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
      else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(function () {});
    }
  });
})();

//]]>
</script>
</body>
