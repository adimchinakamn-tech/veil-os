<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veil Lab — Gravity Lab</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#07070a;color:#f4f4f5;font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;flex-direction:column;gap:10px;padding:12px 14px;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid rgba(34,211,238,.6);outline-offset:2px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.18em;color:#22d3ee}
h1{font-size:17px;font-weight:700}
header{display:flex;align-items:baseline;gap:10px;flex:none}
header .sub{color:#71717a;font-size:12px}
.panel{background:rgba(19,19,22,.85);border:1px solid rgba(34,211,238,.16);border-radius:14px;backdrop-filter:blur(6px)}
.ctl{flex:none;padding:9px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.lab{font-size:10px;font-weight:700;letter-spacing:.12em;color:#71717a;text-transform:uppercase}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.seg{display:flex;gap:3px;background:#0c0c0e;border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{padding:4px 11px;border-radius:8px;font-size:12px;color:#a1a1aa;transition:.15s}
.seg button.on{background:rgba(34,211,238,.16);color:#67e8f9;box-shadow:0 0 12px rgba(34,211,238,.22)}
.seg button:hover:not(.on){color:#e4e4e7}
button.icon{padding:6px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.09);background:#131316;
  font-size:12px;color:#d4d4d8;display:inline-flex;align-items:center;gap:6px;transition:.15s}
button.icon:hover{border-color:rgba(34,211,238,.5);color:#67e8f9}
.val{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#67e8f9;min-width:30px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:#27272a;width:110px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;
  background:#22d3ee;box-shadow:0 0 10px rgba(34,211,238,.6);cursor:pointer}
.stage{position:relative;flex:1;min-height:0;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.07)}
canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
.hud{position:absolute;left:10px;top:8px;pointer-events:none;font-size:11.5px;line-height:1.6}
.hud b{color:#67e8f9;font-weight:600}
.hud .k{color:#52525b}
#tip{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;pointer-events:none;
  font-size:11.5px;color:#71717a;background:rgba(9,9,11,.72);padding:4px 12px;border-radius:999px;white-space:nowrap}
</style>
</head>
<body>
<header><span class="tag">VEIL LAB · 02</span><h1>Gravity Lab</h1><span class="sub">orbital sandbox · drag to fling · hold to sink a well</span></header>

<div class="panel ctl">
  <span class="lab">Scene</span>
  <div class="seg" id="scenes">
    <button data-s="solar" class="on">Solar</button><button data-s="binary">Binary</button>
    <button data-s="galaxy">Galaxy</button><button data-s="cloud">Cloud</button><button data-s="chaos">Chaos</button>
  </div>
  <span class="lab">Gravity</span><input id="g" type="range" min="10" max="300" value="100" aria-label="Gravity strength"><span class="val" id="gv">1.0×</span>
  <span class="lab">Trails</span><input id="tr" type="range" min="0" max="96" value="86" aria-label="Trail persistence"><span class="val" id="trv">86%</span>
  <button class="icon" id="bloom" title="Toggle the glow pass">Bloom on</button>
  <button class="icon" id="wipe" title="Wipe particles, keep the wells">Wipe</button>
  <button class="icon" id="reset" title="Reset the scene">Reset</button>
</div>

<div class="stage">
  <canvas id="cv" aria-label="Gravity simulation canvas — drag to launch a particle, press and hold to create an attractor well"></canvas>
  <div class="hud mono" id="hud"></div>
  <div id="tip">drag = launch a comet · hold = plant a gravity well · wells drag too</div>
</div>

<script>
"use strict";
/* ── world state ──────────────────────────────────────────────── */
var cv = document.getElementById("cv"), cx = cv.getContext("2d");
var W = 0, H = 0, DPR = window.devicePixelRatio || 1;
var parts = [], wells = [], gravity = 1, trail = 0.86, bloom = true;
var scene = "solar", drag = null, dragWell = null, simT = 0;
/* gravitational constant, tuned so a central 260-mass well gives
 * lively px/s orbital speeds at 60fps */
var K = 12000;
function fit() {
  var r = cv.parentElement.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = W * DPR; cv.height = H * DPR;
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  paintFade(1);
}
addEventListener("resize", fit);

/* ── entities ─────────────────────────────────────────────────── */
function addWell(x, y, m, glow) {
  var w = { x: x, y: y, m: m, r: Math.max(7, Math.sqrt(m) * 2.2), glow: glow !== false, vx: 0, vy: 0 };
  wells.push(w); return w;
}
function addPart(x, y, vx, vy, hue) {
  if (parts.length > 900) parts.shift();
  parts.push({ x: x, y: y, vx: vx, vy: vy, hue: hue != null ? hue : 20 + Math.random() * 320, life: 1, trailPts: [] });
}
function orbitVel(x, y, w, dir) {
  var dx = x - w.x, dy = y - w.y, d = Math.max(24, Math.hypot(dx, dy));
  /* circular-orbit speed: v = sqrt(K·m / d) — px per second */
  var v = Math.sqrt((w.m * K * gravity) / d);
  var a = Math.atan2(dy, dx) + (dir ? Math.PI / 2 : -Math.PI / 2);
  return { vx: w.vx + Math.cos(a) * v, vy: w.vy + Math.sin(a) * v };
}

/* ── scenes ───────────────────────────────────────────────────── */
var SCENES = {
  solar: function () {
    wells = [addWell(W / 2, H / 2, 260)];
    for (var i = 0; i < 130; i++) {
      var a = Math.random() * Math.PI * 2, d = 60 + Math.random() * Math.min(W, H) * 0.42;
      var x = W / 2 + Math.cos(a) * d, y = H / 2 + Math.sin(a) * d;
      var v = orbitVel(x, y, wells[0], true);
      addPart(x, y, v.vx, v.vy, 30 + (d % 300));
    }
  },
  binary: function () {
    var c = 150 + Math.min(W, H) * 0.05;
    var A = addWell(W / 2 - c, H / 2, 120), B = addWell(W / 2 + c, H / 2, 120);
    var vv = Math.sqrt((120 * K * gravity) / (c * 4)); /* each orbits the barycentre at radius c */
    A.vy = -vv; B.vy = vv;
    for (var i = 0; i < 110; i++) {
      var a = Math.random() * Math.PI * 2, d = 190 + Math.random() * Math.min(W, H) * 0.32;
      var x = W / 2 + Math.cos(a) * d, y = H / 2 + Math.sin(a) * d;
      var v = orbitVel(x, y, { x: W / 2, y: H / 2, m: 240, vx: 0, vy: 0 }, Math.random() < 0.5);
      addPart(x, y, v.vx, v.vy);
    }
  },
  galaxy: function () {
    wells = [];
    var core = addWell(W / 2, H / 2, 210);
    for (var arm = 0; arm < 3; arm++) {
      for (var i = 6; i < 60; i++) {
        var t = i / 60, a = arm * (Math.PI * 2 / 3) + t * 3.6, d = 30 + t * Math.min(W, H) * 0.44;
        var x = core.x + Math.cos(a) * d, y = core.y + Math.sin(a) * d * 0.62;
        var v = orbitVel(x, y, core, true);
        addPart(x, y, v.vx, v.vy, (arm * 90 + t * 140) % 360);
      }
    }
  },
  cloud: function () {
    wells = [addWell(W / 2, H / 2, 180)];
    for (var i = 0; i < 220; i++) {
      var x = W * 0.1 + Math.random() * W * 0.8, y = H * 0.1 + Math.random() * H * 0.8;
      addPart(x, y, (Math.random() - 0.5) * 26, (Math.random() - 0.5) * 26);
    }
  },
  chaos: function () {
    wells = [];
    for (var i = 0; i < 5; i++) addWell(W * (0.2 + 0.15 * i), H * (0.3 + 0.45 * Math.sin(i * 2.2 + 1)), 40 + Math.random() * 70);
    for (var j = 0; j < 260; j++) addPart(W * 0.1 + Math.random() * W * 0.8, H * 0.1 + Math.random() * H * 0.8,
      (Math.random() - 0.5) * 60, (Math.random() - 0.5) * 60);
  }
};
function loadScene(s) { scene = s; parts = []; wells = []; SCENES[s](); paintFade(1); }
document.getElementById("scenes").addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  this.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
  loadScene(b.dataset.s);
});

/* ── interaction ──────────────────────────────────────────────── */
function pos(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
cv.addEventListener("pointerdown", function (e) {
  cv.setPointerCapture(e.pointerId);
  var p = pos(e);
  for (var i = 0; i < wells.length; i++) {
    var w = wells[i];
    if (Math.hypot(p.x - w.x, p.y - w.y) < w.r + 8) { dragWell = w; drag = null; return; }
  }
  drag = { x0: p.x, y0: p.y, x: p.x, y: p.y, t: performance.now(), holding: false };
});
cv.addEventListener("pointermove", function (e) {
  var p = pos(e);
  if (dragWell) { dragWell.x = p.x; dragWell.y = p.y; return; }
  if (!drag) return;
  drag.x = p.x; drag.y = p.y;
  if (!drag.holding && performance.now() - drag.t > 240 && Math.hypot(drag.x - drag.x0, drag.y - drag.y0) < 9) {
    drag.holding = true;                 /* press-and-hold: grow a new well */
    drag.well = addWell(drag.x, drag.y, 4);
  }
  if (drag.holding && drag.well) {
    drag.well.m = Math.min(420, drag.well.m + 2.6);
    drag.well.r = Math.max(7, Math.sqrt(drag.well.m) * 2.2);
  }
});
["pointerup", "pointercancel"].forEach(function (ev) {
  cv.addEventListener(ev, function (e) {
    if (dragWell) { dragWell = null; return; }
    if (!drag) return;
    if (drag.holding && drag.well) { drag = null; return; }   /* keep the planted well */
    var dt = Math.max(16, performance.now() - drag.t) / 1000;
    var vx = (drag.x - drag.x0) / dt * 0.55, vy = (drag.y - drag.y0) / dt * 0.55;
    addPart(drag.x0, drag.y0, vx, vy, 190);
    drag = null;
  });
});

/* ── controls ─────────────────────────────────────────────────── */
document.getElementById("g").oninput = function () { gravity = this.value / 100; document.getElementById("gv").textContent = gravity.toFixed(1) + "×"; };
document.getElementById("tr").oninput = function () { trail = this.value / 100; document.getElementById("trv").textContent = this.value + "%"; };
document.getElementById("bloom").onclick = function () { bloom = !bloom; this.textContent = bloom ? "Bloom on" : "Bloom off"; };
document.getElementById("wipe").onclick = function () { parts = []; paintFade(1); };
document.getElementById("reset").onclick = function () { loadScene(scene); };

/* ── physics + render ─────────────────────────────────────────── */
function paintFade(a) { cx.fillStyle = "rgba(7,7,10," + a + ")"; cx.fillRect(0, 0, W, H); }
function step(dt) {
  simT += dt;
  /* wells orbit each other (light: only pull, no self) */
  for (var a = 0; a < wells.length; a++) {
    var wa = wells[a], fx = 0, fy = 0;
    for (var b = 0; b < wells.length; b++) {
      if (a === b) continue;
      var wb = wells[b], dx = wb.x - wa.x, dy = wb.y - wa.y, d2 = Math.max(900, dx * dx + dy * dy), d = Math.sqrt(d2);
      var f = (K * gravity * wa.m * wb.m) / d2;
      fx += (dx / d) * f; fy += (dy / d) * f;
    }
    wa.vx += (fx / wa.m) * dt; wa.vy += (fy / wa.m) * dt;
  }
  for (var i = 0; i < wells.length; i++) { wells[i].x += wells[i].vx * dt; wells[i].y += wells[i].vy * dt; }
  /* particles feel every well */
  for (var p = parts.length - 1; p >= 0; p--) {
    var pt = parts[p], fx2 = 0, fy2 = 0;
    for (var w = 0; w < wells.length; w++) {
      var wl = wells[w], dx2 = wl.x - pt.x, dy2 = wl.y - pt.y;
      var d2m = Math.max(280, dx2 * dx2 + dy2 * dy2), dm = Math.sqrt(d2m);
      var g2 = (K * gravity * wl.m) / d2m;
      fx2 += (dx2 / dm) * g2; fy2 += (dy2 / dm) * g2;
      if (dm < wl.r * 0.7) { /* swallowed by the well */
        wl.m = Math.min(560, wl.m + 0.5); wl.r = Math.max(7, Math.sqrt(wl.m) * 2.2);
        parts.splice(p, 1); pt = null; break;
      }
    }
    if (!pt) continue;
    pt.vx += fx2 * dt; pt.vy += fy2 * dt;
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    if (pt.x < -80 || pt.x > W + 80 || pt.y < -80 || pt.y > H + 80) parts.splice(p, 1);
  }
}
function render() {
  paintFade(1 - trail * 0.9);
  if (bloom) cx.globalCompositeOperation = "lighter";
  /* wells — glowing cores */
  for (var i = 0; i < wells.length; i++) {
    var w = wells[i], pulse = 1 + Math.sin(simT * 2 + i) * 0.06;
    var grad = cx.createRadialGradient(w.x, w.y, 0, w.x, w.y, w.r * 4.2 * pulse);
    grad.addColorStop(0, "rgba(103,232,249,.9)");
    grad.addColorStop(0.25, "rgba(34,211,238,.28)");
    grad.addColorStop(1, "rgba(34,211,238,0)");
    cx.fillStyle = grad;
    cx.beginPath(); cx.arc(w.x, w.y, w.r * 4.2 * pulse, 0, 7); cx.fill();
    cx.fillStyle = "#e0feff";
    cx.beginPath(); cx.arc(w.x, w.y, Math.min(9, w.r * 0.5), 0, 7); cx.fill();
  }
  /* particles — neon streaks */
  for (var p = 0; p < parts.length; p++) {
    var pt = parts[p], sp = Math.hypot(pt.vx, pt.vy);
    var light = Math.min(72, 46 + sp / 9);
    cx.strokeStyle = "hsla(" + pt.hue + ",95%," + light + "%,.9)";
    cx.lineWidth = 1.6; cx.lineCap = "round";
    cx.beginPath();
    cx.moveTo(pt.x - pt.vx * 0.055, pt.y - pt.vy * 0.055);
    cx.lineTo(pt.x, pt.y);
    cx.stroke();
  }
  /* launch arrow while dragging */
  if (drag && !drag.holding) {
    cx.strokeStyle = "rgba(103,232,249,.8)"; cx.lineWidth = 1.4; cx.setLineDash([5, 5]);
    cx.beginPath(); cx.moveTo(drag.x0, drag.y0); cx.lineTo(drag.x, drag.y); cx.stroke();
    cx.setLineDash([]);
    cx.fillStyle = "rgba(103,232,249,.9)";
    cx.beginPath(); cx.arc(drag.x0, drag.y0, 3.5, 0, 7); cx.fill();
  }
  cx.globalCompositeOperation = "source-over";
  var hud = document.getElementById("hud");
  hud.innerHTML = "<b>" + parts.length + "</b> <span class='k'>particles</span> · <b>" + wells.length +
    "</b> <span class='k'>wells</span> · <b>" + gravity.toFixed(1) + "×</b> <span class='k'>gravity</span>";
}
var last = performance.now();
(function loop(now) {
  requestAnimationFrame(loop);
  var dt = Math.min(0.05, (now - last) / 1000); last = now;
  step(dt); render();
})(last);

fit(); loadScene("solar");
</script>
</body>
</html>
