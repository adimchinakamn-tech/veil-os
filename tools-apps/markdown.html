<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veil Toolkit — Markdown Editor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#09090b;color:#f4f4f5;font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;gap:12px;padding:14px 16px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid rgba(52,211,153,.6);outline-offset:2px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.18em;color:#34d399}
h1{font-size:17px;font-weight:700}
header{display:flex;align-items:baseline;gap:10px;flex:none}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:1fr 1fr;gap:12px}
@media(min-width:720px){main{grid-template-columns:1fr 1fr;grid-template-rows:1fr}}
.panel{background:#131316;border:1px solid rgba(255,255,255,.08);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.07);flex:none}
.plabel{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:#71717a;text-transform:uppercase}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#ed{flex:1;min-height:60px;width:100%;resize:none;border:0;border-radius:0;background:transparent;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#f4f4f5;padding:14px 16px;overflow:auto;white-space:pre-wrap;overflow-wrap:break-word}
#ed::placeholder{color:#71717a}
#pv{flex:1;min-height:60px;overflow:auto;padding:16px 18px;font-size:14px;line-height:1.65;overflow-wrap:break-word}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:16px 0 8px;line-height:1.25;color:#fafafa}
.md h1{font-size:25px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1)}
.md h2{font-size:20px}
.md h3{font-size:16.5px}
.md h4,.md h5,.md h6{font-size:14.5px}
.md p{margin:8px 0}
.md a{color:#34d399;text-decoration:underline;text-underline-offset:2px}
.md code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em;background:rgba(52,211,153,.1);color:#6ee7b7;border-radius:5px;padding:1px 5px}
.md pre{margin:10px 0;background:#0c0c0e;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:12px 14px;overflow-x:auto}
.md pre code{background:none;color:#d4d4d8;padding:0;font-size:12px;line-height:1.6}
.md blockquote{margin:10px 0;padding:2px 14px;border-left:3px solid #10b981;background:rgba(16,185,129,.07);border-radius:0 8px 8px 0;color:#a1a1aa}
.md ul,.md ol{margin:8px 0;padding-left:24px}
.md li{margin:3px 0}
.md hr{border:0;border-top:1px solid rgba(255,255,255,.12);margin:16px 0}
.md strong{color:#fafafa}
.md em{color:#d4d4d8}
.md .hint{color:#71717a;font-style:italic}
.foot{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:9px 14px;background:#131316;border:1px solid rgba(255,255,255,.08);border-radius:14px;font-size:12px;color:#a1a1aa}
.foot .st b{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;color:#f4f4f5;font-weight:600}
#saved{color:#34d399;font-size:11.5px;opacity:0;transition:opacity .25s}
#saved.show{opacity:1}
#clear{margin-left:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);background:#131316;border:1px solid rgba(52,211,153,.35);color:#6ee7b7;padding:9px 18px;border-radius:999px;font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.45);white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.btn{border:1px solid rgba(52,211,153,.35);background:rgba(16,185,129,.12);color:#6ee7b7;padding:7px 13px;border-radius:10px;font-size:12.5px;font-weight:600;cursor:pointer;transition:background .12s,color .12s,transform .1s;font-family:inherit}
.btn:hover{background:rgba(16,185,129,.22)}
.btn:active{transform:scale(.96)}
.btn.solid{background:#10b981;border-color:transparent;color:#032015}
.btn.solid:hover{background:#34d399}
.btn.ghost{border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#d4d4d8}
.btn.ghost:hover{background:rgba(255,255,255,.09);color:#fafafa}
.btn.danger{border-color:rgba(248,113,113,.35);background:rgba(239,68,68,.12);color:#fca5a5}
.btn.on{background:#10b981;border-color:transparent;color:#032015}
input,select,textarea{background:#18181b;border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#f4f4f5;padding:7px 10px;font-size:13.5px;outline:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:rgba(52,211,153,.55)}
/* additive sizing on top of the shared button/input base */
.btn{min-height:36px}
.btn.ghost.danger{border-color:rgba(248,113,113,.35);color:#fca5a5}
.btn.ghost.danger:hover{background:rgba(239,68,68,.15);color:#fecaca}
</style>
</head>
<body>
<header><span class="tag">VEIL TOOLKIT</span><h1>Markdown Editor</h1></header>

<main>
  <section class="panel">
    <div class="bar" id="tools">
      <button class="btn ghost" data-md="bold" title="bold"><b>B</b></button>
      <button class="btn ghost" data-md="italic" title="italic"><i>I</i></button>
      <button class="btn ghost mono" data-md="code" title="code">code</button>
      <button class="btn ghost" data-md="h1" title="heading 1">H1</button>
      <button class="btn ghost" data-md="h2" title="heading 2">H2</button>
      <button class="btn ghost" data-md="link" title="link">link</button>
      <button class="btn ghost" data-md="quote" title="blockquote">quote</button>
      <button class="btn ghost" data-md="list" title="list item">list</button>
      <button class="btn ghost" data-md="hr" title="horizontal rule">hr</button>
    </div>
    <textarea id="ed" spellcheck="false" placeholder="# Start typing markdown…"></textarea>
  </section>
  <section class="panel">
    <div class="bar"><span class="plabel">preview</span></div>
    <div id="pv" class="md"></div>
  </section>
</main>

<footer class="panel foot">
  <span class="st"><b id="sw">0</b> words</span>
  <span class="st"><b id="sc">0</b> chars</span>
  <span class="st"><b id="sl">1</b> lines</span>
  <span class="st"><b id="sr">0</b> min read</span>
  <span id="saved">saved ✓</span>
  <button class="btn ghost danger" id="clear">clear</button>
</footer>

<div class="toast" id="toast"></div>

<script>
"use strict";
var store=(function(){try{var k="__v";localStorage.setItem(k,"1");localStorage.removeItem(k);return localStorage}catch(e){var m={};return{getItem:function(k){return k in m?m[k]:null},setItem:function(k,v){m[k]=String(v)},removeItem:function(k){delete m[k]}}}})();
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

var KEY="veil.tk.md";
var ed=document.getElementById("ed"),pv=document.getElementById("pv");
var sw=document.getElementById("sw"),sc=document.getElementById("sc"),sl=document.getElementById("sl"),sr=document.getElementById("sr");
var savedEl=document.getElementById("saved"),clearBtn=document.getElementById("clear");
var toastEl=document.getElementById("toast"),toastT=null,savedT=null,saveT=null;

function toast(msg){toastEl.textContent=msg;toastEl.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove("show")},1600)}

var WELCOME=[
"# Veil Markdown","",
"An offline **markdown editor** — the draft *auto-saves* as you type.",
"",
"## What renders","",
"- **bold**, *italic*, `code`",
"- [links](https://example.com) — only http(s):// and # are clickable",
"- blockquotes, ordered lists, rules","",
"> Everything runs locally in this one file. No network, no fonts, no tracking.","",
"1. Type on the left",
"2. Watch it render on the right",
"3. Leave any time — the draft persists","",
"---","",
"```js",
"// fenced code works too",
"const toolkit = { offline: true, apps: 10 };",
"```",""].join("\n");

/* ---- mini markdown renderer: escape first, then transform ---- */
function inline(t){
  var codes=[];
  t=t.replace(/`([^`\n]+)`/g,function(m,c){codes.push("<code>"+c+"</code>");return "\x00"+(codes.length-1)+"\x00"});
  t=t.replace(/\*\*([^*]+)\*\*/g,function(m,c){return "<strong>"+c+"</strong>"});
  t=t.replace(/\*([^*\n]+)\*/g,function(m,c){return "<em>"+c+"</em>"});
  t=t.replace(/\[([^\]]*)\]\(([^()\s]*)\)/g,function(m,tx,ur){
    if(/^(https?:\/\/|#)/i.test(ur))return '<a href="'+ur+'" target="_blank" rel="noopener">'+tx+"</a>";
    return m;
  });
  t=t.replace(/\x00(\d+)\x00/g,function(m,i){return codes[+i]});
  return t;
}

function renderMd(src){
  if(!src.trim())return '<p class="hint">nothing to preview yet…</p>';
  var lines=esc(src).split("\n");
  var out=[],i=0,hn=0;
  var H=/^(#{1,6})\s+(.*)$/;
  while(i<lines.length){
    var L=lines[i];
    if(/^```/.test(L)){
      var buf=[];i++;
      while(i<lines.length&&!/^```/.test(lines[i])){buf.push(lines[i]);i++}
      i++;
      out.push("<pre><code>"+buf.join("\n")+"</code></pre>");
      continue;
    }
    if(/^\s*-{3,}\s*$/.test(L)){out.push("<hr>");i++;continue}
    var m=H.exec(L);
    if(m){hn++;var lv=m[1].length;
      out.push('<h'+lv+' id="h-'+hn+'">'+inline(m[2])+"</h"+lv+">");i++;continue}
    if(/^&gt;\s?/.test(L)){
      var q=[];
      while(i<lines.length&&/^&gt;\s?/.test(lines[i])){q.push(lines[i].replace(/^&gt;\s?/,""));i++}
      out.push("<blockquote>"+q.map(inline).join("<br>")+"</blockquote>");
      continue;
    }
    if(/^[-*]\s+/.test(L)){
      var it=[];
      while(i<lines.length&&/^[-*]\s+/.test(lines[i])){it.push("<li>"+inline(lines[i].replace(/^[-*]\s+/,""))+"</li>");i++}
      out.push("<ul>"+it.join("")+"</ul>");continue;
    }
    if(/^\d+\.\s+/.test(L)){
      var oi=[];
      while(i<lines.length&&/^\d+\.\s+/.test(lines[i])){oi.push("<li>"+inline(lines[i].replace(/^\d+\.\s+/,""))+"</li>");i++}
      out.push("<ol>"+oi.join("")+"</ol>");continue;
    }
    if(L.trim()===""){i++;continue}
    var pa=[];
    while(i<lines.length&&lines[i].trim()!==""&&!/^```/.test(lines[i])&&!H.test(lines[i])
      &&!/^&gt;\s?/.test(lines[i])&&!/^[-*]\s+/.test(lines[i])&&!/^\d+\.\s+/.test(lines[i])&&!/^\s*-{3,}\s*$/.test(lines[i])){
      pa.push(lines[i]);i++;
    }
    out.push("<p>"+pa.map(inline).join("<br>")+"</p>");
  }
  return out.join("\n");
}

function update(){
  pv.innerHTML=renderMd(ed.value);
  var t=ed.value;
  var w=t.trim()?t.trim().split(/\s+/).length:0;
  sw.textContent=w;
  sc.textContent=t.length;
  sl.textContent=t?t.split("\n").length:0;
  sr.textContent=(w===0?0:Math.max(1,Math.ceil(w/200)))+" ";
}

function flashSaved(){savedEl.classList.add("show");clearTimeout(savedT);savedT=setTimeout(function(){savedEl.classList.remove("show")},1100)}
function saveDraft(){clearTimeout(saveT);saveT=setTimeout(function(){try{store.setItem(KEY,ed.value)}catch(e){}flashSaved()},400)}

ed.addEventListener("input",function(){update();saveDraft()});

/* ---- toolbar: wrap selection or prefix lines ---- */
function touch(){ed.focus();update();saveDraft()}
function wrapSel(before,after,ph){
  var st=ed.selectionStart,en=ed.selectionEnd,v=ed.value;
  if(st===en){
    var ins=before+ph+after;
    ed.value=v.slice(0,st)+ins+v.slice(en);
    ed.selectionStart=st+before.length;
    ed.selectionEnd=st+before.length+ph.length;
  }else{
    var sel=v.slice(st,en);
    ed.value=v.slice(0,st)+before+sel+after+v.slice(en);
    ed.selectionStart=st+before.length;
    ed.selectionEnd=st+before.length+sel.length;
  }
  touch();
}
function lineBounds(){
  var v=ed.value,st=ed.selectionStart;
  var ls=v.lastIndexOf("\n",st-1)+1;
  var le=v.indexOf("\n",st);if(le<0)le=v.length;
  return{v:v,ls:ls,le:le,line:v.slice(ls,le)};
}
function setHeading(lvl){
  var b=lineBounds(),m=/^(#{1,6})\s+/.exec(b.line);
  var body=m?b.line.slice(m[0].length):b.line;
  var nl=(m&&m[1].length===lvl)?body:(new Array(lvl+1).join("#")+" "+body);
  ed.value=b.v.slice(0,b.ls)+nl+b.v.slice(b.le);
  ed.selectionStart=ed.selectionEnd=b.ls+nl.length;
  touch();
}
function togglePrefix(p){
  var b=lineBounds();
  var nl=b.line.indexOf(p)===0?b.line.slice(p.length):p+b.line;
  ed.value=b.v.slice(0,b.ls)+nl+b.v.slice(b.le);
  ed.selectionStart=ed.selectionEnd=b.ls+nl.length;
  touch();
}
function insertHr(){
  var v=ed.value,st=ed.selectionStart;
  var pre=(st>0&&v.charAt(st-1)!=="\n")?"\n":"";
  var post=(st<v.length&&v.charAt(st)!=="\n")?"\n":"";
  ed.value=v.slice(0,st)+pre+"---"+post+v.slice(st);
  ed.selectionStart=ed.selectionEnd=st+pre.length+3;
  touch();
}
Array.prototype.forEach.call(document.querySelectorAll("[data-md]"),function(b){
  b.addEventListener("click",function(){
    var k=b.getAttribute("data-md");
    if(k==="bold")wrapSel("**","**","text");
    else if(k==="italic")wrapSel("*","*","text");
    else if(k==="code")wrapSel("`","`","code");
    else if(k==="link")wrapSel("[","](https://)","text");
    else if(k==="h1")setHeading(1);
    else if(k==="h2")setHeading(2);
    else if(k==="quote")togglePrefix("> ");
    else if(k==="list")togglePrefix("- ");
    else if(k==="hr")insertHr();
  });
});

/* ---- clear with click-again confirm ---- */
var armed=false,armT=null;
clearBtn.addEventListener("click",function(){
  if(!armed){armed=true;clearBtn.textContent="click again to clear";
    armT=setTimeout(function(){armed=false;clearBtn.textContent="clear"},2200);return}
  clearTimeout(armT);armed=false;clearBtn.textContent="clear";
  ed.value="";try{store.removeItem(KEY)}catch(e){}
  update();toast("draft cleared");ed.focus();
});

/* ---- boot ---- */
var saved=store.getItem(KEY);
ed.value=(saved===null||saved===undefined)?WELCOME:saved;
update();
</script>
</body>
</html>
