            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-play size-4.5 translate-x-[1px]" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>

<script src="assets/os.js"></script>
<script>
(function () {
  "use strict";
  var V = window.VEILOS;
  var input = document.getElementById("music-q");
  var go = document.getElementById("music-go");
  var grid = document.getElementById("results-grid");
  var title = document.getElementById("results-title");

  function card(label, sub, art) {
    var media = art
      ? '<img alt="" loading="lazy" class="size-full object-cover" src="' + V.esc(art) + '"/>'
      : '<div class="flex size-full items-center justify-center bg-zinc-800/70"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-disc-3 size-8 text-zinc-600" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="2"></circle><path d="M6 12c0-1.7.7-3.2 1.8-4.2"></path><circle cx="12" cy="12" r="10"></circle><path d="M18 12c0 1.7-.7 3.2-1.8 4.2"></path></svg></div>';
    return '<div class="group relative"><button type="button" class="relative block aspect-square w-full overflow-hidden rounded-2xl border border-zinc-800/80 bg-zinc-900 outline-none transition-all duration-200 hover:-translate-y-1 hover:border-fuchsia-500/50" disabled="">' + media +
      '<span class="absolute inset-0 flex items-center justify-center bg-black/40 opacity-0 backdrop-blur-[2px] transition-opacity duration-200 group-hover:opacity-100"><span class="flex size-11 items-center justify-center rounded-full bg-fuchsia-500 text-zinc-950 shadow-xl shadow-fuchsia-500/40 transition-transform duration-200 scale-75 group-hover:scale-100"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-play size-5 translate-x-[1px]" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg></span></span></button>' +
      '<p class="mt-2 line-clamp-2 text-[12.5px] font-medium leading-tight text-zinc-100" title="' + V.esc(label) + '">' + V.esc(label) + '</p>' +
      '<p class="mt-0.5 text-[10.5px] capitalize leading-tight text-zinc-500">' + V.esc(sub) + "</p></div>";
  }

  function skeletons(n) {
    var html = "";
    for (var i = 0; i < n; i++) {
      html += '<div class="group relative"><div class="aspect-square w-full animate-pulse rounded-2xl bg-zinc-800/60"></div><div class="mt-2 h-3 w-[86%] animate-pulse rounded bg-zinc-800/60"></div><div class="mt-1.5 h-2.5 w-[52%] animate-pulse rounded bg-zinc-800/50"></div></div>';
    }
    return html;
  }

  input.addEventListener("input", function () { go.disabled = !input.value.trim(); });

  /* the shelf's resting state — the same shimmer cards the app shows
     while its curated shelves load */
  title.textContent = "Shelves";
  grid.innerHTML = skeletons(5);

  document.getElementById("music-search").addEventListener("submit", function (e) {
    e.preventDefault();
    var q = input.value.trim();
    if (!q) return;
    title.textContent = "Searching…";
    grid.innerHTML = skeletons(5);
    /* the search reaches SoundCloud through the service — on this copy the
       shelf shows the honest pending state, then the notice below stands */
    setTimeout(function () {
      title.textContent = "Results for \u201C" + q + "\u201D";
      grid.innerHTML = card(q, "awaiting the music service", "") + card(q + " — radio", "awaiting the music service", "") + card(q + " ( remix )", "awaiting the music service", "");
      document.getElementById("np-title").textContent = q;
      document.getElementById("np-sub").textContent = "queued — playback connects when the service is online";
    }, 1400);
  });
})();
</script>
