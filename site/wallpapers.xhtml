      (isApplied ? '<span class="absolute left-2.5 top-2.5 z-10 rounded-full border border-emerald-400/30 bg-emerald-500/20 px-2 py-0.5 text-[9.5px] font-bold uppercase tracking-wider text-emerald-300 backdrop-blur-md">applied</span>' : "") +
      "</div>" +
      '<div class="absolute inset-x-0 bottom-0 p-3"><p class="truncate text-sm font-semibold leading-tight text-zinc-50 drop-shadow-sm">' + name.charAt(0).toUpperCase() + name.slice(1) + '</p><p class="mt-0.5 truncate text-[11px] leading-tight text-zinc-400">animated theme</p></div></button>';
  }

  function feedCard(c, isLive) {
    if (isLive) {
      return '<button type="button" aria-label="Preview ' + V.esc(c.name) + '" data-live=\'' + V.esc(JSON.stringify({ id: "mbgs-" + c.id, kind: "video", name: c.name, src: c.video, thumb: c.thumb, desc: "motionbgs · live wallpaper" })) + '\' class="group relative block w-full overflow-hidden rounded-2xl border border-zinc-800/80 bg-zinc-900 text-left outline-none transition-all duration-200 hover:-translate-y-1 hover:border-emerald-500/60 hover:shadow-[0_18px_42px_-14px_rgba(16,185,129,0.45)] focus-visible:ring-2 focus-visible:ring-emerald-500/70">' +
        '<div class="relative aspect-video w-full overflow-hidden"><img alt="" loading="lazy" decoding="async" class="size-full object-cover transition-all duration-500 group-hover:scale-[1.04]" src="' + V.esc(c.thumb) + '"/>' +
        '<span class="absolute left-2.5 top-2.5 z-10 flex items-center gap-1 rounded-full border border-emerald-400/25 bg-emerald-500/15 px-2 py-0.5 text-[9.5px] font-bold uppercase tracking-wider text-emerald-300 backdrop-blur-md"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-2.5" aria-hidden="true"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"></path><rect x="2" y="6" width="14" height="12" rx="2"></rect></svg>live</span></div>' +
        '<div class="absolute inset-x-0 bottom-0 p-3"><p class="truncate text-sm font-semibold leading-tight text-zinc-50 drop-shadow-sm">' + V.esc(c.name) + '</p><p class="mt-0.5 truncate text-[11px] leading-tight text-zinc-400">motionbgs · 4K motion</p></div></button>';
    }
    return '<a href="' + V.esc(c.detail) + '" target="_blank" rel="noopener noreferrer" aria-label="' + V.esc(c.name) + ' — open the 4K page" class="group relative block w-full overflow-hidden rounded-2xl border border-zinc-800/80 bg-zinc-900 text-left outline-none transition-all duration-200 hover:-translate-y-1 hover:border-emerald-500/60 hover:shadow-[0_18px_42px_-14px_rgba(16,185,129,0.45)] focus-visible:ring-2 focus-visible:ring-emerald-500/70">' +
      '<div class="relative aspect-video w-full overflow-hidden"><img alt="" loading="lazy" decoding="async" class="size-full object-cover transition-all duration-500 group-hover:scale-[1.04]" src="' + V.esc(c.thumb) + '"/>' +
      '<span class="absolute left-2.5 top-2.5 z-10 rounded-full border border-white/10 bg-black/50 px-2 py-0.5 text-[9.5px] font-bold uppercase tracking-wider text-zinc-200 backdrop-blur-md">' + V.esc(c.category) + "</span></div>" +
      '<div class="absolute inset-x-0 bottom-0 p-3"><p class="truncate text-sm font-semibold leading-tight text-zinc-50 drop-shadow-sm">' + V.esc(c.name) + '</p><p class="mt-0.5 truncate text-[11px] leading-tight text-zinc-400">4K · opens the source</p></div></a>';
  }

  function currentList() {
    if (tab === "themes") return null;
    if (tab === "live") return liveItems.map(function (c) { return { type: "live", c: c }; });
    if (tab === "4k") return fourk.map(function (c) { return { type: "4k", c: c }; });
    var f = favs();
    var list = pack.map(function (w) { return { type: "pack", w: w }; });
    /* filters */
    if (pill !== "all") {
      if (pill === "favorites") list = list.filter(function (x) { return f.indexOf(x.w.id) > -1; });
      else if (pill === "live") list = list.filter(function (x) { return x.w.kind === "video"; });
      else if (pill === "static") list = list.filter(function (x) { return x.w.kind === "image"; });
      else list = list.filter(function (x) { return (x.w.tags || []).indexOf(pill) > -1; });
    }
    if (query) {
      var q = query.toLowerCase();
      list = list.filter(function (x) {
        return x.w.name.toLowerCase().indexOf(q) > -1 || (x.w.desc || "").toLowerCase().indexOf(q) > -1 || (x.w.tags || []).join(" ").toLowerCase().indexOf(q) > -1;
      });
    }
    /* favorites float first */
    list.sort(function (a, b) { return (f.indexOf(b.w.id) > -1 ? 1 : 0) - (f.indexOf(a.w.id) > -1 ? 1 : 0); });
    return list;
  }

  function render() {
    var grid = document.getElementById("wp-grid");
    if (tab === "themes") {
      var html = "";
      Object.keys(themes).forEach(function (name) { html += themeCard(name, themes[name]); });
      grid.innerHTML = html;
      $$("[data-theme]").forEach(function (b) {
        b.addEventListener("click", function () {
          apply({ id: "theme-" + b.getAttribute("data-theme"), src: "", kind: "animated", name: b.getAttribute("data-theme"), theme: b.getAttribute("data-theme") });
          render();
        });
      });
      return;
    }
    var list = currentList();
    var html = tab === "pack" ? ADD_CARD : "";
    list.forEach(function (x) {
      html += x.type === "pack" ? packCard(x.w) : feedCard(x.c, x.type === "live");
    });
    if (!list.length && tab === "pack") {
      html += '<div class="col-span-full rounded-2xl border border-zinc-800/80 bg-zinc-900/40 p-8 text-center text-[13px] text-zinc-500">Nothing matches that filter.</div>';
    }
    grid.innerHTML = html;
    bindCards();
  }

  function bindCards() {
    var addCard = document.getElementById("add-card");
    if (addCard) addCard.addEventListener("click", function () { document.getElementById("wp-file").click(); });
    $$("[data-wp]").forEach(function (b) {
      b.addEventListener("click", function (e) {
        if (e.target.closest("[data-fav]")) return;
        openLightbox(JSON.parse(b.getAttribute("data-wp")));
      });
    });
    $$("[data-live]").forEach(function (b) {
      b.addEventListener("click", function () { openLightbox(JSON.parse(b.getAttribute("data-live"))); });
    });
    $$("[data-fav]").forEach(function (h) {
      h.addEventListener("click", function (e) {
        e.stopPropagation();
        e.preventDefault();
        var id = h.getAttribute("data-fav");
        var f = favs();
        var i = f.indexOf(id);
        if (i > -1) f.splice(i, 1); else f.push(id);
        setFavs(f);
        render();
      });
    });
    /* hover video previews — the app's 450ms cadence */
    $$("[data-hover-video]").forEach(function (v) {
      var t = null;
      var card = v.closest(".group");
      card.addEventListener("mouseenter", function () {
        t = setTimeout(function () { v.src = v.getAttribute("data-hover-video"); v.play().catch(function () {}); }, 450);
      });
      card.addEventListener("mouseleave", function () {
        if (t) clearTimeout(t);
        v.pause();
      });
    });
  }

  function openLightbox(w) {
    selected = w;
    document.getElementById("lb-name").textContent = w.name;
    document.getElementById("lb-desc").textContent = w.desc || (w.kind === "video" ? "motion backdrop" : "still backdrop");
    document.getElementById("lb-media").innerHTML = w.kind === "video"
      ? '<video src="' + V.esc(asset(w.src)) + '" autoplay loop muted playsinline class="size-full object-cover"></video>'
      : '<img src="' + V.esc(asset(w.src)) + '" alt="' + V.esc(w.name) + '" class="size-full object-cover" />';
    var lb = document.getElementById("wp-lightbox");
    lb.classList.remove("hidden");
    lb.classList.add("flex");
  }
  document.getElementById("lb-close").addEventListener("click", function () {
    var lb = document.getElementById("wp-lightbox");
    lb.classList.add("hidden");
    lb.classList.remove("flex");
    document.getElementById("lb-media").innerHTML = "";
  });
  document.getElementById("wp-lightbox").addEventListener("click", function (e) {
    if (e.target === this) document.getElementById("lb-close").click();
  });
  document.getElementById("lb-apply").addEventListener("click", function () {
    if (selected) {
      apply({ id: selected.id, src: selected.src, kind: selected.kind, name: selected.name, thumb: selected.thumb });
      render();
      document.getElementById("lb-close").click();
    }
  });

  /* upload — genuinely works: the file becomes a data-URI wallpaper */
  document.getElementById("add-yours-btn").addEventListener("click", function () { document.getElementById("wp-file").click(); });
  document.getElementById("wp-file").addEventListener("change", function () {
    var f = this.files && this.files[0];
    if (!f) return;
    if (f.size > 300 * 1024 * 1024) return;
    var rd = new FileReader();
    rd.onload = function () {
      var kind = f.type.indexOf("video/") === 0 ? "video" : "image";
      var w = { id: "own-" + Date.now().toString(36), kind: kind, name: f.name.replace(/\.[a-z0-9]+$/i, ""), src: rd.result, thumb: rd.result, desc: "your upload", tags: [] };
      pack.unshift(w);
      document.getElementById("wp-counter").textContent = pack.length + " uploads · " + pack.filter(function (x) { return x.kind === "video"; }).length + " live";
      document.getElementById("pack-count").textContent = pack.length;
      apply({ id: w.id, src: w.src, kind: w.kind, name: w.name, thumb: w.thumb });
      render();
    };
    rd.readAsDataURL(f);
    this.value = "";
  });

  /* tabs + pills + search */
  $$(".wp-tab").forEach(function (t) {
    t.addEventListener("click", function () {
      tab = t.getAttribute("data-wtab");
      $$(".wp-tab").forEach(function (x) {
        var on = x === t;
        x.setAttribute("aria-selected", on);
        x.className = x.className.replace(/bg-emerald-500\/15 text-emerald-300 shadow-\[0_0_16px_-6px_rgba\(16,185,129,0\.8\)\] ring-1 ring-emerald-500\/40|text-zinc-400 hover:bg-zinc-800\/60 hover:text-zinc-200/g, "").trim() + " " +
          (on ? "bg-emerald-500/15 text-emerald-300 shadow-[0_0_16px_-6px_rgba(16,185,129,0.8)] ring-1 ring-emerald-500/40" : "text-zinc-400 hover:bg-zinc-800/60 hover:text-zinc-200");
      });
      var controls = document.getElementById("wp-controls");
      controls.style.display = tab === "pack" ? "" : "none";
      render();
    });
  });
  $$(".wp-pill").forEach(function (p) {
    p.addEventListener("click", function () {
      pill = p.getAttribute("data-pill");
      $$(".wp-pill").forEach(function (x) {
        var on = x === p;
        x.setAttribute("aria-selected", on);
        x.className = x.className.replace(/border-emerald-500\/60 bg-emerald-500\/15 text-emerald-300 shadow-\[0_0_16px_-6px_rgba\(16,185,129,0\.8\)\]|border-zinc-800 bg-zinc-900\/60 text-zinc-400 hover:border-zinc-700 hover:text-zinc-200/g, "").trim() + " " +
          (on ? "border-emerald-500/60 bg-emerald-500/15 text-emerald-300 shadow-[0_0_16px_-6px_rgba(16,185,129,0.8)]" : "border-zinc-800 bg-zinc-900/60 text-zinc-400 hover:border-zinc-700 hover:text-zinc-200");
      });
      render();
    });
  });
  document.getElementById("wp-search").addEventListener("input", function () { query = this.value.trim(); render(); });

  /* load + boot */
  Promise.all([
    V.dataOf("wallpapers-pack.json"),
    V.dataOf("wallpapers.json"),
    V.dataOf("wallpapers-live.json"),
  ]).then(function (res) {
    pack = (res[0] && res[0].pack) || [];
    themes = (res[0] && res[0].themes) || {};
    fourk = (res[1] && res[1].items) || [];
    liveItems = (res[2] && res[2].items) || [];
    var liveCount = pack.filter(function (w) { return w.kind === "video" || w.fallback; }).length;
    document.getElementById("wp-counter").textContent = pack.length + " uploads · " + liveCount + " live";
    document.getElementById("pack-count").textContent = pack.length;
    render();
  }).catch(function () {});
})();

//]]>
</script>
</body>
</html>
