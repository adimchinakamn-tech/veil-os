<script>
//<![CDATA[

(function () {
  "use strict";
  var V = window.VEILOS;

  /* the feed's own loading skeleton — exactly the app's shimmer cards */
  function skeleton(n) {
    var html = "";
    for (var i = 0; i < n; i++) {
      html += '<div class="flex flex-col"><div class="aspect-video w-full animate-pulse rounded-xl bg-zinc-800/70"></div><div class="mt-3 flex gap-3"><div class="size-9 shrink-0 animate-pulse rounded-full bg-zinc-800/70"></div><div class="min-w-0 flex-1 space-y-2 pt-0.5"><div class="h-3.5 w-[92%] animate-pulse rounded bg-zinc-800/70"></div><div class="h-3 w-[60%] animate-pulse rounded bg-zinc-800/60"></div><div class="h-3 w-[40%] animate-pulse rounded bg-zinc-800/50"></div></div></div></div>';
    }
    return html;
  }
  var grid = document.getElementById("feed-grid");
  grid.innerHTML = skeleton(8);

  /* reload replays the skeleton, like the app's shelf refresh */
  document.getElementById("reload-feed").addEventListener("click", function () {
    grid.innerHTML = skeleton(8);
  });

  /* search opens YouTube results — the same query the program searches */
  document.getElementById("yt-search").addEventListener("submit", function (e) {
    e.preventDefault();
    var q = document.getElementById("yt-q").value.trim();
    if (!q) return;
    V.pushHistory("https://www.youtube.com/results?search_query=" + encodeURIComponent(q), q + " — YouTube");
    window.open("https://www.youtube.com/results?search_query=" + encodeURIComponent(q), "_blank", "noopener");
  });
})();

//]]>
</script>
