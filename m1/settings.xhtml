<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#020e0a" />
<title>Veil OS</title>
<meta name="description" content="Veil OS — the live web desktop. Chat, stream, arcade, wallpapers, music and AI in one place." />
<meta property="og:title" content="Veil OS" />
<meta property="og:description" content="The live web desktop — chat, stream, arcade, wallpapers, music and AI." />
<meta property="og:type" content="website" />
<link rel="icon" type="image/png" href="veil-icon-192.png" />
<link rel="apple-touch-icon" href="veil-icon-192.png" />
<style>
  :root{
    --bg:#020e0a; --panel:#07130d; --line:#143526;
    --accent:#34d399; --accent-bright:#6ee7b7;
    --accent-soft:rgba(52,211,153,.14);
    --text:#e8f5ee; --muted:#84a897;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  #live{
    position:fixed; inset:0; width:100%; height:100%;
    border:0; background:var(--bg);
    opacity:0; transition:opacity .45s ease;
    z-index:1;
  }
  #live.on{opacity:1}
  #splash{
    position:fixed; inset:0; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:30px;
    background:
      radial-gradient(1100px 760px at 50% 28%, #04170f 0%, var(--bg) 72%),
      var(--bg);
    transition:opacity .5s ease, visibility 0s linear .5s;
  }
  #splash.off{opacity:0; visibility:hidden; pointer-events:none}
  .orbs{position:absolute; inset:0; overflow:hidden; z-index:-1; filter:blur(60px); opacity:.55}
  .orb{position:absolute; border-radius:50%}
  .orb.a{width:46vmax; height:46vmax; left:-14vmax; top:-16vmax;
    background:radial-gradient(circle at 35% 35%, rgba(52,211,153,.30), transparent 62%);
    animation:drift1 26s ease-in-out infinite alternate}
  .orb.b{width:40vmax; height:40vmax; right:-12vmax; bottom:-14vmax;
    background:radial-gradient(circle at 60% 60%, rgba(110,231,183,.14), transparent 60%);
    animation:drift2 32s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:translate3d(9vmax,7vmax,0) scale(1.12)}}
  @keyframes drift2{to{transform:translate3d(-8vmax,-6vmax,0) scale(.92)}}
  @media (prefers-reduced-motion: reduce){ .orb{animation:none} .fill::after{animation:none} }
  .brand{display:flex; flex-direction:column; align-items:center; gap:18px}
  .mark{
    width:88px; height:88px; border-radius:22px;
    display:flex; align-items:center; justify-content:center;
    filter:drop-shadow(0 22px 55px rgba(52,211,153,.35));
  }
  .mark svg{width:88px; height:88px; display:block; border-radius:22px}
  .word{font-size:30px; font-weight:650; letter-spacing:.5px}
  .word b{color:var(--accent); font-weight:650}
  .sub{font-size:12px; letter-spacing:3.2px; text-transform:uppercase; color:var(--muted)}
  .loadwrap{display:flex; flex-direction:column; align-items:center; gap:16px; width:min(320px,74vw)}
  .status{
    display:flex; align-items:center; gap:10px;
    padding:9px 16px; border-radius:999px;
    background:var(--panel); border:1px solid var(--line);
    font-size:13px; color:var(--muted); white-space:nowrap;
  }
  .dot{width:8px; height:8px; border-radius:50%; background:var(--accent)}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(52,211,153,.45)}
    70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}
    100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}
  }
  .dot{box-shadow:0 0 0 0 var(--accent-soft); animation:pulse 1.6s ease-out infinite}
  .bar{
    width:100%; height:6px; border-radius:999px;
    background:rgba(52,211,153,.10);
    border:1px solid rgba(52,211,153,.16);
    overflow:hidden;
  }
  .fill{
    height:100%; width:0%;
    border-radius:999px;
    background:linear-gradient(90deg, #34d399, #6ee7b7);
    box-shadow:0 0 14px rgba(52,211,153,.55);
    position:relative; overflow:hidden;
    transition:width .18s ease-out;
  }
  .fill::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.38), transparent);
    transform:translateX(-100%);
    animation:sheen 1.5s ease-in-out infinite;
  }
  @keyframes sheen{to{transform:translateX(100%)}}
  .pct{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11.5px; letter-spacing:1.5px; color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  #slow{
    position:fixed; left:50%; bottom:34px; transform:translate(-50%,14px);
    z-index:3; display:flex; align-items:center; gap:14px;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px 12px 18px; font-size:13.5px; color:var(--text);
    box-shadow:0 18px 50px -12px rgba(0,0,0,.65);
    opacity:0; visibility:hidden; transition:all .35s ease; max-width:min(92vw,560px);
  }
  #slow.on{opacity:1; visibility:visible; transform:translate(-50%,0)}
  #slow .msg{color:var(--muted); line-height:1.45}
  #slow .msg b{color:var(--text); font-weight:600}
  .btn{
    appearance:none; cursor:pointer; user-select:none;
    font:inherit; font-size:13px; font-weight:600;
    padding:9px 16px; border-radius:10px; white-space:nowrap;
    background:var(--accent); color:#03150d; border:0;
    transition:transform .12s ease, filter .12s ease;
  }
  .btn:hover{filter:brightness(1.08)} .btn:active{transform:scale(.97)}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
  .noscript-box{position:fixed; inset:0; z-index:9; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--muted); font-size:16px}
</style>
</head>
<body>
<iframe id="live" title="Veil OS — live desktop"
  allow="autoplay; fullscreen; clipboard-read; clipboard-write; encrypted-media; geolocation; microphone; camera; picture-in-picture; display-capture"
  allowfullscreen="allowfullscreen"
  referrerpolicy="strict-origin-when-cross-origin"></iframe>

<div id="splash" aria-hidden="true">
  <div class="orbs"><div class="orb a"></div><div class="orb b"></div></div>
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="g-tile" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#065f46"></stop>
            <stop offset="1" stop-color="#022c22"></stop>
          </linearGradient>
          <radialGradient id="g-glow" cx="0.5" cy="0.42" r="0.62">
            <stop offset="0" stop-color="#34d399" stop-opacity="0.30"></stop>
            <stop offset="1" stop-color="#34d399" stop-opacity="0"></stop>
          </radialGradient>
          <linearGradient id="g-shield" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6ee7b7"></stop>
            <stop offset="1" stop-color="#34d399"></stop>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="14" fill="url(#g-tile)"></rect>
        <rect width="64" height="64" rx="14" fill="url(#g-glow)"></rect>
        <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="12.75" fill="none" stroke="#34d399" stroke-opacity="0.45" stroke-width="2.5"></rect>
        <g fill="none" stroke="url(#g-shield)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(11.6 11.6) scale(1.7)">
          <path d="M12 22s8-3.6 8-10V5.5L12 2 4 5.5V12c0 6.4 8 10 8 10Z"></path>
          <path d="M9 12h2v4"></path>
        </g>
      </svg>
    </div>
    <div class="word">Veil<b>OS</b></div>
    <div class="sub">Live CDN</div>
  </div>
  <div class="loadwrap">
    <div class="status"><span class="dot"></span><span id="statusText">Contacting the live desktop…</span></div>
    <div class="bar" id="bar" role="progressbar" aria-label="Loading Veil OS" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="fill" id="fill"></div>
    </div>
    <div class="pct" id="pct">0%</div>
  </div>
</div>

<div id="slow" role="status">
  <div class="msg"><b>Still connecting.</b> The live box may be waking from a cold boot — it usually comes up within a minute.</div>
  <button class="btn" id="retryBtn" type="button">Retry</button>
</div>

<noscript>
  <div class="noscript-box"><span>Veil OS needs JavaScript to run.</span></div>
</noscript>

<script type="text/javascript">
//<![CDATA[
(function () {
  "use strict";
  /* Veil CDN front — streams the LIVE Veil OS edge-to-edge.
   * The upstream origin is stored as a build fingerprint (hex ^ key)
   * instead of a literal URL: view-source shows only an opaque hash,
   * and the frame carries no src attribute until runtime navigation.
   * To repoint this front at a different origin, regenerate the
   * fingerprint (hex of each char XOR 0x5b) and re-copy to every stub. */
  var BUILD = "332f2f2b286174742b293e2d323e2c7638333a2f766e386f6c686c696e766d6b3a6a766f6b6a3a763a6e6968763d686b6e6e3f3a6e6c6c3e6375282b3a383e7621753a32";
  var K = 0x5b;

  var frame = document.getElementById("live");
  var splash = document.getElementById("splash");
  var statusText = document.getElementById("statusText");
  var slow = document.getElementById("slow");
  var bar = document.getElementById("bar");
  var fill = document.getElementById("fill");
  var pct = document.getElementById("pct");

  var loaded = false;
  var p = 0;

  function render() {
    fill.style.width = p.toFixed(1) + "%";
    pct.textContent = Math.floor(p) + "%";
    bar.setAttribute("aria-valuenow", String(Math.floor(p)));
  }

  /* Eased fake progress: quick off the line, then a patient crawl toward 92%
   * while the live desktop streams in. The load handler snaps it to 100%. */
  var tick = setInterval(function () {
    if (loaded) { return; }
    p += (92 - p) * 0.045 + 0.08;
    if (p > 92) { p = 92; }
    render();
  }, 110);
  render();

  var t4s = setTimeout(function () {
    if (!loaded) { statusText.textContent = "Waking the box — cold boots take a moment…"; }
  }, 4000);
  var t15s = setTimeout(function () {
    if (!loaded) { slow.classList.add("on"); }
  }, 15000);

  frame.addEventListener("load", function () {
    /* The frame boots at about:blank (same-origin). Only a cross-origin
     * document — the live desktop — counts as loaded. */
    try {
      if (frame.contentWindow.location.href === "about:blank") { return; }
    } catch (e) { /* cross-origin = the real thing */ }
    loaded = true;
    clearInterval(tick);
    clearTimeout(t4s); clearTimeout(t15s);
    slow.classList.remove("on");
    p = 100; render();
    statusText.textContent = "Connected";
    frame.classList.add("on");
    setTimeout(function () { splash.classList.add("off"); }, 300);
  });

  /* Direct-open links stay inert (#) in the DOM and only arm with the
   * real destination on first interaction — the markup never carries
   * the upstream origin. */
  function armLinks(U) { /* open-direct removed */ }

  document.getElementById("retryBtn").addEventListener("click", function () {
    location.reload();
  });

  /* Decode the fingerprint and navigate the frame WITHOUT a src
   * attribute — inspect-element shows an empty frame until the app
   * is live, and view-source never shows the origin at all. */
  var U = "";
  for (var i = 0; i < BUILD.length; i += 2) {
    U += String.fromCharCode(parseInt(BUILD.substr(i, 2), 16) ^ K);
  }
  armLinks(U);
  try {
    frame.contentWindow.location.replace(U);
  } catch (e) {
    frame.src = U;
  }

  /* veil-beacon — self-heal: if this front's fingerprint went stale
   * (the live session moved to a new preview URL), follow the beacon
   * the box pushes to the repo (served + purged via jsDelivr). Never
   * overrides a frame that already finished loading the real app. */
  try {
    var BEACONS = ["https://gcore.jsdelivr.net/", "https://cdn.jsdelivr.net/", "https://fastly.jsdelivr.net/"].map(function (h) { return h + "gh/ok5678765s/veil-os@main/backups/live-origin.json"; });
    (function nextBeacon(i) {
      if (i >= BEACONS.length) return;
      fetch(BEACONS[i], { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })

        catch (e2) { frame.src = o; }

        .catch(function () { nextBeacon(i + 1); });

</script>
</body>
</html>
