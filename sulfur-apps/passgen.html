<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Password Generator — Sulfur OS</title>
<style>
:root{color-scheme:dark;--bg:#09090b;--card:#18181b;--bd:#27272a;--bd2:#3f3f46;--tx:#e4e4e7;--mut:#a1a1aa;--dim:#71717a;--amber:#f59e0b;--amber-h:#fbbf24;--tint:rgba(245,158,11,.14);--mono:ui-monospace,Menlo,Consolas,monospace;--sh:0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{display:block}
.topbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(24,24,27,.92);border-bottom:1px solid var(--bd);flex:none}
.tb-icon{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#fbbf24,#d97706);color:#1c1206;display:grid;place-items:center;flex:none}
.tb-name{font-weight:700;font-size:14.5px;white-space:nowrap}
.chip{font-size:10px;font-weight:800;letter-spacing:.18em;color:var(--amber);background:var(--tint);border:1px solid rgba(245,158,11,.35);padding:2px 8px;border-radius:999px;flex:none}
.spacer{flex:1}
main{flex:1;width:100%;max-width:540px;margin:0 auto;padding:18px 14px 30px;display:flex;flex-direction:column;gap:16px}
.tabs{display:flex;gap:5px;background:#131316;border:1px solid var(--bd);padding:5px;border-radius:12px}
.tabs button{flex:1;min-height:40px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mut);transition:background .12s,color .12s,transform .06s}
.tabs button:hover{color:var(--tx)}
.tabs button:active{transform:scale(.97)}
.tabs button.on{background:var(--tint);color:var(--amber);box-shadow:inset 0 0 0 1px rgba(245,158,11,.4)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);padding:16px 18px}
.card h2{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
.out{width:100%;text-align:left;background:#101013;border:1px solid var(--bd);border-radius:12px;padding:16px;min-height:64px;cursor:copy;transition:border-color .12s,background .12s}
.out:hover{border-color:rgba(245,158,11,.5);background:#121215}
.out:active{transform:scale(.99)}
.outv{font-family:var(--mono);font-size:17px;line-height:1.45;color:var(--tx);word-break:break-all}
.outv::after{content:"";display:inline-block;width:9px;height:18px;margin-left:3px;vertical-align:-3px;background:var(--amber);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.outnote{font-size:11px;color:var(--dim);margin-top:8px}
.btnrow{display:flex;gap:10px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;flex:1;padding:0 16px;border-radius:8px;background:#202024;border:1px solid var(--bd);font-size:13.5px;font-weight:600;transition:background .12s,border-color .12s,transform .06s}
.btn:hover{background:#26262b;border-color:var(--bd2)}
.btn:active{transform:scale(.97)}
.btn.amber{background:var(--amber);border-color:transparent;color:#1c1206}
.btn.amber:hover{background:var(--amber-h)}
.sliderow{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.sliderow .lab{font-size:13px;color:var(--mut)}
.sliderow b{font-family:var(--mono);font-size:14px;color:var(--amber);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:38px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#27272a}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--amber);margin-top:-7px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#27272a}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:var(--amber)}
.togs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tog{display:flex;align-items:center;gap:9px;min-height:44px;padding:0 12px;border-radius:8px;background:#141417;border:1px solid var(--bd);font-size:12.5px;color:var(--mut);text-align:left;transition:background .12s,border-color .12s,color .12s,transform .06s}
.tog:hover{background:#1a1a1f;color:var(--tx)}
.tog:active{transform:scale(.98)}
.tog.on{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.45);color:var(--tx)}
.tog .bx{width:18px;height:18px;border-radius:5px;border:1.5px solid #3f3f46;flex:none;display:grid;place-items:center;transition:background .12s,border-color .12s}
.tog.on .bx{background:var(--amber);border-color:var(--amber)}
.tog .bx svg{opacity:0;transition:opacity .12s}
.tog.on .bx svg{opacity:1}
.tog.wide{grid-column:1/-1}
.meter{height:6px;border-radius:3px;background:#27272a;overflow:hidden;margin:10px 0 8px}
.meter i{display:block;height:100%;border-radius:3px;background:var(--amber);transition:width .25s,background .25s}
.mrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.mrow .bits{font-family:var(--mono);font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.tier{font-size:13px;font-weight:700}
.crack{font-size:12px;color:var(--dim);margin-top:6px}
.crack b{color:var(--mut);font-weight:600}
.hist{display:flex;flex-direction:column;gap:6px}
.hrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:44px;padding:8px 12px;border-radius:8px;background:#141417;border:1px solid #202024;cursor:copy;transition:background .12s,border-color .12s}
.hrow:hover{background:#191920;border-color:rgba(245,158,11,.4)}
.hrow:active{transform:scale(.99)}
.hrow .idx{font-size:10.5px;font-weight:700;color:var(--dim);flex:none;width:20px}
.hrow .mask,.hrow .val{font-family:var(--mono);font-size:12.5px;color:var(--mut);word-break:break-all}
.hrow .val{display:none;color:var(--tx)}
.hrow:hover .val,.hrow:focus-visible .val{display:inline}
.hrow:hover .mask,.hrow:focus-visible .mask{display:none}
.hrow .meta{margin-left:auto;font-size:10.5px;color:var(--dim);flex:none}
.hempty{font-size:12.5px;color:var(--dim);text-align:center;padding:8px 0}
.note{font-size:11.5px;color:var(--dim);line-height:1.6}
.seg2{display:flex;gap:5px}
.seg2 button{flex:1;min-height:40px;border-radius:8px;background:#141417;border:1px solid var(--bd);font-size:12.5px;font-weight:600;color:var(--mut);transition:background .12s,color .12s,border-color .12s,transform .06s}
.seg2 button:hover{color:var(--tx)}
.seg2 button:active{transform:scale(.97)}
.seg2 button.on{background:var(--tint);border-color:rgba(245,158,11,.5);color:var(--amber)}
#pwPanel,#ppPanel{display:none}
#pwPanel.on,#ppPanel.on{display:block}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(14px);background:#202024;color:var(--tx);border:1px solid rgba(245,158,11,.45);border-left:3px solid var(--amber);padding:9px 16px;border-radius:10px;font-size:13px;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:99;max-width:88vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
noscript>div{padding:40px;text-align:center;color:var(--mut)}
@media (max-width:420px){.togs{grid-template-columns:1fr}.tog.wide{grid-column:auto}.outv{font-size:15px}}
</style>
</head>
<body>
<noscript><div>Password Generator needs JavaScript for random generation. Please enable it and reload.</div></noscript>
<header class="topbar">
  <div class="tb-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="8" r="3"/><path d="M8.5 8h5M11 8v2.5M13 8v2.5"/></svg></div>
  <span class="tb-name">Password Generator</span>
  <span class="chip">Sulfur</span>
  <span class="spacer"></span>
</header>
<main>
  <div class="tabs" role="tablist" aria-label="Generator mode">
    <button id="tabPw" class="on" role="tab" aria-selected="true">Password</button>
    <button id="tabPp" role="tab" aria-selected="false">Passphrase</button>
  </div>

  <div class="card">
    <div class="out" id="out" role="button" tabindex="0" aria-label="Generated output — press to copy">
      <div class="outv" id="outv"></div>
      <div class="outnote" id="outnote">Click to copy</div>
    </div>
    <div class="btnrow">
      <button class="btn" id="copyBtn">Copy</button>
      <button class="btn amber" id="regen">Regenerate</button>
    </div>
  </div>

  <div class="card">
    <h2>Strength</h2>
    <div class="mrow">
      <span class="tier" id="tier">—</span>
      <span class="bits" id="bits">0 bits of entropy</span>
    </div>
    <div class="meter"><i id="bar" style="width:0%"></i></div>
    <p class="crack" id="crack"></p>
  </div>

  <div class="card" id="pwPanel">
    <h2>Password options</h2>
    <div class="sliderow"><span class="lab">Length</span><b id="lenVal">20</b></div>
    <input type="range" id="len" min="8" max="64" step="1" value="20" aria-label="Password length, 8 to 64">
    <div class="togs" style="margin-top:10px">
      <button class="tog on" id="tgLower" role="checkbox" aria-checked="true"><span class="bx"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="#1c1206" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5l2.5 2.5L10 3.5"/></svg></span>abc lowercase</button>
      <button class="tog on" id="tgUpper" role="checkbox" aria-checked="true"><span class="bx"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="#1c1206" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5l2.5 2.5L10 3.5"/></svg></span>ABC uppercase</button>
      <button class="tog on" id="tgNums" role="checkbox" aria-checked="true"><span class="bx"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="#1c1206" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5l2.5 2.5L10 3.5"/></svg></span>123 digits</button>
      <button class="tog on" id="tgSyms" role="checkbox" aria-checked="true"><span class="bx"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="#1c1206" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5l2.5 2.5L10 3.5"/></svg></span>!@# symbols</button>
      <button class="tog wide" id="tgAmb" role="checkbox" aria-checked="false"><span class="bx"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="#1c1206" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5l2.5 2.5L10 3.5"/></svg></span>Exclude ambiguous 0&nbsp;O&nbsp;1&nbsp;l&nbsp;I&nbsp;|</button>
    </div>
  </div>

  <div class="card" id="ppPanel">
    <h2>Passphrase options</h2>
    <div class="sliderow"><span class="lab">Words</span><b id="wordVal">5</b></div>
    <input type="range" id="words" min="4" max="8" step="1" value="5" aria-label="Word count, 4 to 8">
    <div class="sliderow" style="margin-top:10px"><span class="lab">Separator</span></div>
    <div class="seg2" role="group" aria-label="Separator">
      <button id="sepHyphen">Hyphen (-)</button>
      <button id="sepSpace" class="on">Space</button>
    </div>
    <p class="note" style="margin-top:12px" id="wlNote"></p>
  </div>

  <div class="card">
    <h2>History — last 8</h2>
    <div class="hist" id="hist"><p class="hempty">Generated passwords appear here. Hover to peek, click to copy.</p></div>
    <p class="note" style="margin-top:10px">History lives in memory only — nothing is written to disk.</p>
  </div>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
var $ = function(s){ return document.querySelector(s); };
var LOWER = 'abcdefghijklmnopqrstuvwxyz', UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', NUMS = '0123456789', SYMS = '!@#$%^&*()-_=+[]{};:,.?/';
var WORDS = ('amber anchor apple arbor arrow atlas autumn bacon bamboo banjo basil beacon beech beryl birch bison blaze bloom blossom breeze bridge bronze brook bubble bucket cactus candle canvas canyon caramel cargo cedar cinder citrus cliff clover cobalt coral cosmic cotton coyote crane crater crimson crown crystal dahlia daisy dawn delta denim diamond dolphin domino dragon drift eagle echo eclipse ember emerald falcon fern fjord flame flint forest fossil galaxy garnet ginger glacier granite grove harbor hazel heron honey indigo ivory jade jasmine kayak kelp koala lagoon lantern lemon lilac lotus lunar lynx maple marble meadow melon meteor mint mirror moss nebula nectar nova oasis ocean olive onyx opal orbit orchid otter panda pebble pine plum poppy prism quill ripple robin').split(' ');

/* ---- toast ---- */
var toastEl = $('#toast'), toastT = 0;
function toast(msg, ms){ toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove('show'); }, ms || 1900); }

/* ---- clipboard with fallback ---- */
function copyText(text, okMsg){
  var legacy = function(){
    try {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly','');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, text.length);
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      toast(ok ? (okMsg || 'Copied') : 'Copy failed');
    } catch (e) { toast('Copy failed'); }
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ toast(okMsg || 'Copied'); }, legacy);
      return;
    }
  } catch (e) {}
  legacy();
}

/* ---- unbiased random int [0,n) ---- */
function rnd(n){
  try {
    if (window.crypto && crypto.getRandomValues) {
      var lim = Math.floor(0x100000000 / n) * n, buf = new Uint32Array(1);
      do { crypto.getRandomValues(buf); } while (buf[0] >= lim);
      return buf[0] % n;
    }
  } catch (e) {}
  return Math.floor(Math.random() * n);
}

/* ---- state ---- */
var mode = 'pw', len = 20, wordCount = 5, sep = ' ';
var sets = { lower: true, upper: true, nums: true, syms: true };
var amb = false, hist = [], current = '', currentBits = 0, currentKind = '';

function pool(){
  var p = '';
  if (sets.lower) p += LOWER;
  if (sets.upper) p += UPPER;
  if (sets.nums) p += NUMS;
  if (sets.syms) p += SYMS;
  if (amb) p = p.replace(/[0OlI1|]/g, '');
  return p;
}
function genPassword(){
  var p = pool(), out = '';
  for (var i = 0; i < len; i++) out += p[rnd(p.length)];
  return out;
}
function genPassphrase(){
  var w = [];
  for (var i = 0; i < wordCount; i++) w.push(WORDS[rnd(WORDS.length)]);
  return w.join(sep);
}

/* ---- strength ---- */
function tierOf(bits){
  if (bits < 28) return ['Very weak', '#ef4444'];
  if (bits < 36) return ['Weak', '#f97316'];
  if (bits < 60) return ['Fair', '#eab308'];
  if (bits < 100) return ['Strong', '#f59e0b'];
  return ['Excellent', '#fde047'];
}
function crackTime(bits){
  var s = Math.pow(2, bits - 1) / 1e10;
  if (!isFinite(s)) return 'beyond comprehension';
  var r = function(x){ return x >= 100 ? Math.round(x) : Math.round(x * 10) / 10; };
  if (s < 1) return 'instant';
  if (s < 60) return r(s) + ' seconds';
  if (s < 3600) return r(s / 60) + ' minutes';
  if (s < 86400) return r(s / 3600) + ' hours';
  if (s < 31557600) return r(s / 86400) + ' days';
  var y = s / 31557600;
  if (y < 1e3) return r(y) + ' years';
  if (y < 1e6) return r(y / 1e3) + ' thousand years';
  if (y < 1e9) return r(y / 1e6) + ' million years';
  if (y < 1e12) return r(y / 1e9) + ' billion years';
  if (y < 1e15) return r(y / 1e12) + ' trillion years';
  var e = Math.floor(Math.log10(y));
  return (y / Math.pow(10, e)).toFixed(1) + '×10^' + e + ' years';
}

/* ---- generate & paint ---- */
function generate(pushHist){
  if (mode === 'pw') {
    current = genPassword();
    currentBits = len * Math.log2(pool().length || 1);
    currentKind = len + ' chars';
  } else {
    current = genPassphrase();
    currentBits = wordCount * Math.log2(WORDS.length);
    currentKind = wordCount + ' words';
  }
  $('#outv').textContent = current;
  var t = tierOf(currentBits);
  $('#tier').textContent = t[0];
  $('#tier').style.color = t[1];
  $('#bits').textContent = currentBits.toFixed(1) + ' bits of entropy';
  $('#bar').style.width = Math.max(3, Math.min(100, currentBits / 128 * 100)) + '%';
  $('#bar').style.background = t[1];
  $('#crack').textContent = 'Crack time at 10 billion guesses/s: ' + crackTime(currentBits);
  if (pushHist) {
    hist.unshift({ v: current, bits: currentBits, kind: currentKind });
    if (hist.length > 8) hist.length = 8;
    renderHist();
  }
}
function renderHist(){
  var box = $('#hist');
  box.innerHTML = '';
  if (!hist.length) {
    var p = document.createElement('p');
    p.className = 'hempty';
    p.textContent = 'Generated passwords appear here. Hover to peek, click to copy.';
    box.appendChild(p);
    return;
  }
  hist.forEach(function(h, i){
    var row = document.createElement('button');
    row.className = 'hrow';
    row.type = 'button';
    row.setAttribute('aria-label', 'Copy history entry ' + (i + 1));
    var idx = document.createElement('span'); idx.className = 'idx'; idx.textContent = (i + 1);
    var mask = document.createElement('span'); mask.className = 'mask';
    mask.textContent = '\u2022'.repeat(Math.min(h.v.length, 24)) + (h.v.length > 24 ? '\u2026' : '');
    var val = document.createElement('span'); val.className = 'val'; val.textContent = h.v;
    var meta = document.createElement('span'); meta.className = 'meta';
    meta.textContent = Math.round(h.bits) + 'b · ' + h.kind;
    row.appendChild(idx); row.appendChild(mask); row.appendChild(val); row.appendChild(meta);
    row.addEventListener('click', function(){ copyText(h.v, 'Copied from history'); });
    box.appendChild(row);
  });
}

/* ---- controls ---- */
function setMode(m){
  mode = m;
  $('#tabPw').classList.toggle('on', m === 'pw');
  $('#tabPp').classList.toggle('on', m === 'pp');
  $('#tabPw').setAttribute('aria-selected', String(m === 'pw'));
  $('#tabPp').setAttribute('aria-selected', String(m === 'pp'));
  $('#pwPanel').classList.toggle('on', m === 'pw');
  $('#ppPanel').classList.toggle('on', m === 'pp');
  generate(true);
}
$('#tabPw').addEventListener('click', function(){ setMode('pw'); });
$('#tabPp').addEventListener('click', function(){ setMode('pp'); });

$('#len').addEventListener('input', function(e){ len = parseInt(e.target.value, 10) || 8; $('#lenVal').textContent = len; generate(true); });
$('#words').addEventListener('input', function(e){ wordCount = parseInt(e.target.value, 10) || 4; $('#wordVal').textContent = wordCount; generate(true); });

var togMap = { tgLower: 'lower', tgUpper: 'upper', tgNums: 'nums', tgSyms: 'syms' };
function paintTog(id){
  var on;
  if (id === 'tgAmb') on = amb; else on = sets[togMap[id]];
  var el = $('#' + id);
  el.classList.toggle('on', on);
  el.setAttribute('aria-checked', String(on));
}
Object.keys(togMap).forEach(function(id){
  $('#' + id).addEventListener('click', function(){
    var k = togMap[id], others = false;
    for (var key in sets) if (key !== k && sets[key]) { others = true; break; }
    if (sets[k] && !others) { toast('At least one character set must stay on'); return; }
    sets[k] = !sets[k];
    paintTog(id);
    generate(true);
  });
});
$('#tgAmb').addEventListener('click', function(){
  amb = !amb;
  paintTog('tgAmb');
  generate(true);
});

$('#sepHyphen').addEventListener('click', function(){ sep = '-'; paintSep(); generate(true); });
$('#sepSpace').addEventListener('click', function(){ sep = ' '; paintSep(); generate(true); });
function paintSep(){
  $('#sepHyphen').classList.toggle('on', sep === '-');
  $('#sepSpace').classList.toggle('on', sep === ' ');
}

$('#regen').addEventListener('click', function(){ generate(true); toast('Regenerated'); });
function doCopy(){ copyText(current, 'Password copied'); }
$('#copyBtn').addEventListener('click', doCopy);
$('#out').addEventListener('click', doCopy);
$('#out').addEventListener('keydown', function(e){
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); doCopy(); }
});

/* ---- init ---- */
$('#wlNote').textContent = 'Drawn from an embedded list of ' + WORDS.length + ' words — fully offline, cryptographically shuffled picks.';
['tgLower','tgUpper','tgNums','tgSyms','tgAmb'].forEach(paintTog);
paintSep();
generate(true);
})();
</script>
</body>
</html>
