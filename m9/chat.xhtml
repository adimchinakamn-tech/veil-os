<script>
//<![CDATA[

(function () {
  "use strict";
  var V = window.VEILOS;
  var L = window.VEILLIVE;
  var $ = V.$, $$ = V.$$;
  var state = {
    accounts: {},   /* id -> account (real, from the backup) */
    allMsgs: [],    /* every public-channel message (backup lane) */
    channelMsgs: null, /* active channel's rows straight from the app's API (fresher lane) */
    channelId: "main", /* the channel being viewed — restored at boot */
    apiBase: undefined, /* the app's API base: undefined=unresolved, null=unreachable, ""/url=live */
    realRecent: [], /* every public-channel message (roster lighting) */
    byId: {},
    me: null,       /* my live pseudo-account */
    liveUsers: {},  /* lower-username -> live user */
    liveMsgs: [],   /* rows from chat-live.json */
    pending: [],    /* optimistic sends not yet confirmed
    */
    editing: null,       /* message id with the inline edit box open */
    editDraft: "",       /* draft text kept alive across re-renders */
    editCaret: 0,        /* caret position kept with the draft */
    blockedNotice: null, /* muted/banned message pinned above the composer */
    realAccounts: [],
    gateMode: "login",
    liveOk: false,
  };

  /* the website's channel list, mirrored 1:1 — the timeline reads them
     from the backup (latest.json) or, when the app's API answers, live
     from the DB itself. The shared live room is #general-only. */
  var CHANNELS = [
    { id: "main", name: "general", label: "#general", desc: "General chat — say hi!", modOnly: false },
    { id: "sharelinks", name: "sharelinks", label: "#sharelinks", desc: "Drop links, sites, finds", modOnly: false },
    { id: "links", name: "links", label: "#links", desc: "Curated links — mods & owner", modOnly: true },
    { id: "announcements", name: "announcements", label: "#announcements", desc: "Official news — mods & owner", modOnly: true },
  ];
  function channelById(id) {
    for (var i = 0; i < CHANNELS.length; i++) if (CHANNELS[i].id === id) return CHANNELS[i];
    return CHANNELS[0];
  }

  /* seconds clock (the chat header shows h:mm:ss) */
  (function () {
    var el = document.querySelector("[data-os-seconds]");
    if (!el) return;
    function tick() {
      var d = new Date();
      var hh = d.getHours(), mm = String(d.getMinutes()).padStart(2, "0"), ss = String(d.getSeconds()).padStart(2, "0");
      var ampm = hh >= 12 ? "PM" : "AM";
      var h12 = hh % 12 === 0 ? 12 : hh % 12;
      el.textContent = String(h12).padStart(2, "0") + ":" + mm + ":" + ss + " " + ampm;
    }
    tick();
    setInterval(function () { if (!document.hidden) tick(); }, 1000);
  })();

  function roleColor(a) {
    if (!a) return "#e5e7eb";
    if (a.role === "admin" || a.role === "owner" || (a.username || "") === "Veil") return "#f59e0b";
    if (a.role === "moderator") return "#10b981";
    return "#e5e7eb";
  }
  function roleLabel(a) {
    if (!a) return null;
    if ((a.username || "") === "Veil" || a.role === "admin" || a.role === "owner") return "OWNER";
    if (a.role === "moderator") return "MOD";
    return null;
  }
  function displayName(a) { return (a.displayName || "").trim() || a.username; }
  function initials(name) {
    var parts = (name || "").trim().split(/\s+/).filter(Boolean);
    if (parts.length === 0) return "?";
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }
  function formatTime(iso) {
    var d = new Date(iso);
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }
  function dayKeyOf(iso) {
    var d = new Date(iso);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function dayLabelOf(iso) {
    var d = new Date(iso), now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var that = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var diff = Math.round((today.getTime() - that.getTime()) / 86400000);
    if (diff === 0) return "Today";
    if (diff === 1) return "Yesterday";
    var sameYear = d.getFullYear() === now.getFullYear();
    return d.toLocaleDateString([], sameYear ? { weekday: "long", month: "long", day: "numeric" } : { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  }

  function avatarHtml(a, size, dot) {
    var name = displayName(a);
    var inner;
    if (a.avatarImage) {
      inner = '<img alt="' + V.esc(name) + '" class="h-full w-full rounded-full object-cover" src="' + V.esc(a.avatarImage) + '" style="background-color: ' + V.esc(a.avatarColor || "#2c3e50") + ';" />';
    } else {
      inner = '<div class="grid h-full w-full place-items-center rounded-full font-semibold text-white" style="background-color: ' + V.esc(a.avatarColor || "#2c3e50") + '; font-size: ' + Math.round(size * 0.28) + 'px;">' + V.esc(initials(name)) + "</div>";
    }
    var dotHtml = dot ? '<span class="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 rounded-full border-2 border-black/60 bg-emerald-400"></span>' : "";
    return '<div class="relative"><div class="relative shrink-0" style="width: ' + size + "px; height: " + size + 'px;">' + inner + "</div>" + dotHtml + "</div>";
  }

  /* ---- message content (the app's renderer: /fx, /me, gifs, links) ---- */
  var GIF_RE = /^https?:\/\/(?:media\d*\.giphy\.com|media\.giphy\.com|i\.giphy\.com|media\.tenor\.com)\/\S+\.(?:gif|png|webp|mp4)(?:\?\S*)?$/i;
  var IMG_RE = /^https?:\/\/\S+\.(?:png|jpe?g|webp|gif)(?:\?\S*)?$/i;
  function renderContent(text, mark) {
    var t = String(text || "").trim();
    if (/^\/fx\s+/.test(t)) {
      return '<div class="my-1 flex justify-center"><span class="rounded-full border border-orange-400/25 bg-orange-400/10 px-3.5 py-1 text-[12.5px] font-medium tracking-wide text-orange-200">' + V.esc(t.replace(/^\/fx\s+/, "")) + "</span></div>" + (mark || "");
    }
    if (/^\/me\s+/.test(t)) {
      return '<p class="text-sm italic text-white/70">' + V.esc(t.replace(/^\/me\s+/, "")) + (mark || "") + "</p>";
    }
    if (GIF_RE.test(t) || IMG_RE.test(t)) {
      return '<img src="' + V.esc(t) + '" alt="shared gif" loading="lazy" class="mt-1 max-h-64 max-w-xs rounded-lg border border-white/10 object-cover" />' + (mark || "");
    }
    var parts = t.split(/(https?:\/\/[^\s]+)/g);
    var out = "";
    parts.forEach(function (p) {
      if (/^https?:\/\//.test(p)) {
        out += '<a href="' + V.esc(p) + '" target="_blank" rel="noopener noreferrer" class="text-orange-300 underline decoration-orange-300/40 hover:decoration-orange-300">' + V.esc(p) + "</a>";
      } else {
        out += "<span>" + V.esc(p) + "</span>";
      }
    });
    return '<p class="whitespace-pre-wrap break-words text-sm text-white/90">' + out + (mark || "") + "</p>";
  }

  function buildMsgHtml(msgs) {
    var html = "";
    var prevMsg = null;
    /* the day separators carry the day's message count, like the app */
    var dayCounts = {};
    msgs.forEach(function (m) {
      var k = dayKeyOf(m.createdAt);
      dayCounts[k] = (dayCounts[k] || 0) + 1;
    });
    msgs.forEach(function (m) {
      var a = state.accounts[m.accountId] || { username: "unknown", displayName: "unknown", avatarColor: "#2c3e50", role: "member" };
      var day = dayKeyOf(m.createdAt);
      var prevDay = prevMsg ? dayKeyOf(prevMsg.createdAt) : null;
      var grouped = prevMsg && prevMsg.accountId === m.accountId && prevDay === day &&
        (new Date(m.createdAt).getTime() - new Date(prevMsg.createdAt).getTime()) < 5 * 60 * 1000;
      if (day !== prevDay) {
        html += '<div class="mt-3 mb-1 flex items-center gap-3 px-3" role="separator" aria-label="' + V.esc(dayLabelOf(m.createdAt)) + '"><div class="h-px flex-1 bg-white/10"></div><span class="flex items-center gap-1.5 text-[10.5px] font-semibold uppercase tracking-wider text-white/45">' + V.esc(dayLabelOf(m.createdAt)) + '<span class="font-normal normal-case tracking-normal text-white/25">(' + dayCounts[day] + ')</span></span><div class="h-px flex-1 bg-white/10"></div></div>';
        grouped = false;
      }
      html += '<div class="group relative flex gap-3 px-3 py-1 transition-colors hover:bg-white/[0.03]' + (grouped ? " py-0.5" : " mt-2") + (m.pending ? " opacity-60" : "") + '">';
      html += '<div class="w-10 shrink-0">';
      if (!grouped) {
        html += '<button type="button" class="rounded-full outline-none ring-orange-400/60 transition focus-visible:ring-2" title="' + V.esc(displayName(a)) + ' — view profile">' + avatarHtml(a, 40, false) + "</button>";
      }
      html += "</div>";
      html += '<div class="min-w-0 flex-1">';
      if (!grouped) {
        html += '<div class="flex flex-wrap items-baseline gap-x-2 gap-y-0.5">';
        html += '<button type="button" class="rounded text-left text-sm font-semibold outline-none ring-orange-400/60 transition hover:underline focus-visible:ring-2" style="color: ' + roleColor(a) + ';">' + V.esc(displayName(a)) + "</button>";
        if (a.tag) html += '<span class="rounded px-1 py-0.5 text-[9px] font-semibold uppercase text-white" style="background-color: ' + V.esc(a.tagColor || roleColor(a)) + ';">' + V.esc(a.tag) + "</span>";
        var rl = roleLabel(a);
        if (rl) html += '<span class="rounded px-1 py-0.5 text-[9px] font-semibold uppercase text-white" style="background-color: ' + roleColor(a) + ';">' + rl + "</span>";
        html += '<span class="text-[10px] text-white/40">' + V.esc(formatTime(m.createdAt)) + "</span></div>";
      }
      var mine = state.me && m.accountId === state.me.id && m.live;
      var editing = !!mine && !m.pending && state.editing === m.id;
      if (editing) {
        /* inline edit box — Save/Cancel, Enter saves, Esc cancels */
        html += '<div class="mt-1"><textarea data-os-editbox rows="3" class="w-full resize-none rounded-lg border border-white/15 bg-black/40 px-2.5 py-1.5 text-sm text-white outline-none focus:border-orange-400/50">' + V.esc(state.editDraft) + "</textarea>" +
          '<div class="mt-1.5 flex items-center justify-end gap-1.5">' +
          '<button type="button" data-os-editcancel class="rounded-md px-2.5 py-1 text-xs font-medium text-white/60 hover:bg-white/10 hover:text-white">Cancel</button>' +
          '<button type="button" data-os-editsave class="rounded-md bg-orange-400 px-2.5 py-1 text-xs font-semibold text-black hover:opacity-90">Save</button>' +
          "</div></div>";
      } else {
        var mark = m.editedAt ? ' <span class="text-[10px] italic text-white/40">(edited)</span>' : "";
        html += renderContent(m.content, mark);
      }
      html += "</div>";
      /* hover actions — reply + pin (+ edit/delete for your own) */
      html += '<div class="absolute right-2 top-0 hidden items-center gap-0.5 rounded-md border border-white/10 bg-[#1c1c34] px-1 py-0.5 text-white/70 shadow-lg group-hover:flex">';
      html += '<button class="rounded p-1 hover:bg-white/10" title="Reply"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-reply h-3.5 w-3.5"><path d="M20 18v-2a4 4 0 0 0-4-4H4"></path><path d="m9 17-5-5 5-5"></path></svg></button>';
      html += '<button class="rounded p-1 hover:bg-white/10" title="Pin"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-pin h-3.5 w-3.5"><path d="M12 17v5"></path><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"></path></svg></button>';
      if (mine && !m.pending && state.editing !== m.id) html += '<button class="rounded p-1 hover:bg-white/10" title="Edit" data-os-edit="' + V.esc(m.id) + '"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-pencil h-3.5 w-3.5"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path><path d="m15 5 4 4"></path></svg></button>';
      if (mine) html += '<button class="rounded p-1 hover:bg-white/10" title="Delete" data-os-del="' + V.esc(m.id) + '"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-trash-2 h-3.5 w-3.5"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" x2="10" y1="11" y2="17"></line><line x1="14" x2="14" y1="11" y2="17"></line></svg></button>';
      html += "</div></div>";
      prevMsg = m;
    });
    return html;
  }

  function toast(text) {
    var t = document.getElementById("chat-toast");
    t.textContent = text;
    t.classList.remove("hidden");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.add("hidden"); }, 4200);
  }

  function mergedMsgs() {
    /* DB rows for THIS channel — the API lane is fresher when present,
     * the backup lane (all public channels) otherwise */
    var real = (state.channelMsgs || state.allMsgs || []).filter(function (m) {
      return (m.channelId || "main") === state.channelId;
    });
    /* the shared live room (git sends) is #general-only */
    var live = state.channelId === "main" ? state.liveMsgs : [];
    var all = real.concat(live, state.pending);
    var seen = {};
    var dedup = [];
    all.forEach(function (m) {
      if (m.id && seen[m.id]) return;
      seen[m.id] = true;
      dedup.push(m);
    });
    return dedup.sort(function (a, b) { return new Date(a.createdAt) - new Date(b.createdAt); });
  }

  /* save the inline edit — L.editMessage stamps editedAt, then the
     room is re-pulled so everyone sees the new text + (edited) */
  function saveEdit(box) {
    var id = state.editing;
    var text = String(box.value || "").trim();
    if (!id) return;
    if (!text) { toast("Message can't be empty."); return; }
    box.disabled = true;
    L.editMessage(L.identity(), id, text).then(function () {
      state.editing = null;
      state.editDraft = "";
      state.editCaret = 0;
      for (var i = 0; i < state.liveMsgs.length; i++) {
        if (state.liveMsgs[i].id === id) {
          state.liveMsgs[i].content = text;
          state.liveMsgs[i].editedAt = new Date().toISOString();
        }
      }
      render();
      loadLive();
    }).catch(function (e) {
      box.disabled = false;
      toast(L.friendlyError(e));
    });
  }

  function render() {
    var list = document.getElementById("chat-list");
    var msgs = mergedMsgs();
    /* empty channel — the app's exact empty state */
    list.innerHTML = msgs.length ? buildMsgHtml(msgs) :
      '<div class="grid place-items-center py-20 text-center text-white/40"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-hash mb-2 h-8 w-8 opacity-50"><line x1="4" x2="20" y1="9" y2="9"></line><line x1="4" x2="20" y1="15" y2="15"></line><line x1="10" x2="8" y1="3" y2="21"></line><line x1="16" x2="14" y1="3" y2="21"></line></svg><p class="text-sm">No messages here yet.</p><p class="mt-1 text-xs">Be the first to say something!</p></div>';
    var sc = document.getElementById("chat-scroll");
    $$("[data-os-del]", list).forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-os-del");
        L.deleteMessage(L.identity(), id).then(function () {
          state.liveMsgs = state.liveMsgs.filter(function (m) { return m.id !== id; });
          state.pending = state.pending.filter(function (m) { return m.id !== id; });
          if (state.editing === id) { state.editing = null; state.editDraft = ""; }
          render();
        }).catch(function (e) { toast(L.friendlyError(e)); });
      });
    });
    /* pencil on your own messages → inline textarea + Save/Cancel */
    $$("[data-os-edit]", list).forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-os-edit");
        var cur = null;
        state.liveMsgs.forEach(function (m) { if (m.id === id) cur = m; });
        state.pending.forEach(function (m) { if (m.id === id) cur = m; });
        state.editing = id;
        state.editDraft = cur ? String(cur.content || "") : "";
        state.editCaret = state.editDraft.length;
        render();
      });
    });
    var box = $("[data-os-editbox]", list);
    if (box) {
      /* polls re-render under the box — keep the draft, caret, focus */
      box.focus();
      try { box.setSelectionRange(state.editCaret, state.editCaret); } catch (e) { /* ignore */ }
      box.addEventListener("input", function () {
        state.editDraft = box.value;
        try { state.editCaret = box.selectionStart; } catch (e) { state.editCaret = box.value.length; }
      });
      box.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); saveEdit(box); }
        else if (e.key === "Escape") { e.preventDefault(); state.editing = null; state.editDraft = ""; render(); }
      });
      var cancelBtn = $("[data-os-editcancel]", list);
      var saveBtn = $("[data-os-editsave]", list);
      if (cancelBtn) cancelBtn.addEventListener("click", function () { state.editing = null; state.editDraft = ""; render(); });
      if (saveBtn) saveBtn.addEventListener("click", function () { saveEdit(box); });
      try { box.scrollIntoView({ block: "center" }); } catch (e) { sc.scrollTop = sc.scrollHeight; }
    } else {
      sc.scrollTop = sc.scrollHeight;
    }
  }

  /* ---- player list: real Online/Offline buckets like the app ---- */
  function renderMembers() {
    var box = document.getElementById("members-list");
    var nowMs = Date.now();
    var online = {};
    /* live users with a fresh heartbeat */
    for (var k in state.liveUsers) {
      if (!Object.prototype.hasOwnProperty.call(state.liveUsers, k)) continue;
      if (L.isOnlineLive(state.liveUsers[k], nowMs)) online["live:" + k] = true;
    }
    /* real accounts light up when they just talked (the backup is ~30s fresh) */
    var recent = (state.realRecent || []).concat(state.channelMsgs || []);
    recent.forEach(function (m) {
      var t = new Date(m.createdAt).getTime();
      if (isFinite(t) && nowMs - t < L.cfg.presenceWindowMs) online[m.accountId] = true;
    });
    if (state.me) online[state.me.id] = true;

    var all = state.realAccounts.slice();
    for (var u in state.liveUsers) {
      if (!Object.prototype.hasOwnProperty.call(state.liveUsers, u)) continue;
      var acc = L.pseudoAccount(state.liveUsers[u]);
      state.accounts[acc.id] = acc;
      all.push(acc);
    }
    /* I'm always on my own roster — even in the seconds before the CDN
       has caught up with my just-created account/heartbeat */
    if (state.me) {
      state.accounts[state.me.id] = state.me;
      all.push(state.me);
    }
    var seen = {};
    var uniq = all.filter(function (a) {
      var key = (a.username || "").toLowerCase();
      if (seen[key]) return false;
      seen[key] = true;
      return true;
    });
    var rank = function (x) { return x.role === "admin" || x.role === "owner" || x.username === "Veil" ? 0 : x.role === "moderator" ? 1 : 2; };
    var byRank = function (a, b) { return rank(a) - rank(b) || displayName(a).localeCompare(displayName(b)); };
    var notBanned = uniq.filter(function (a) { return !a.banned; });
    var on = notBanned.filter(function (a) { return online[a.id]; }).sort(byRank);
    var off = notBanned.filter(function (a) { return !online[a.id]; }).sort(byRank);

    /* website-linked members: my own via flag, or the room's linked mark */
    var isWebsite = function (a) {
      if (a.via === "website") return true;
      var u = state.liveUsers[String(a.username || "").toLowerCase()];
      return !!(u && u.linked);
    };
    var row = function (a, isOn) {
      var isMe = state.me && a.id === state.me.id;
      var rl = roleLabel(a);
      return '<button type="button" title="' + V.esc(displayName(a)) + ' — view profile" class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left outline-none ring-orange-400/60 transition focus-visible:ring-2 ' + (isMe ? "bg-orange-400/10" : "hover:bg-white/5") + '">' +
        '<div class="relative"><div class="relative shrink-0" style="width: 28px; height: 28px;">' +
        '<div class="grid h-full w-full place-items-center rounded-full font-semibold text-white" style="background-color: ' + V.esc(a.avatarColor || "#2c3e50") + '; font-size: 11.2px;">' + V.esc(initials(displayName(a))) + "</div></div>" +
        '<span class="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 rounded-full border-2 border-black/60 ' + (isOn ? "bg-emerald-400" : "bg-white/30") + '"></span></div>' +
        '<div class="min-w-0 flex-1"><div class="flex items-center gap-1.5"><span class="truncate text-sm font-medium" style="color: ' + roleColor(a) + ';">' + V.esc(displayName(a)) + "</span></div>" +
        '<div class="truncate text-[10px] text-white/40">@' + V.esc(a.username) + "</div></div>" +
        (rl ? '<span class="rounded px-1 py-0.5 text-[9px] font-semibold uppercase text-white" style="background-color: ' + roleColor(a) + ';">' + rl + "</span>" : "") +
        (a.muted ? '<span class="rounded bg-white/5 px-1 py-0.5 text-[9px] font-semibold uppercase tracking-wide text-white/40" title="Muted by a moderator">muted</span>' : "") +
        (isWebsite(a) ? '<span class="rounded bg-white/5 px-1 py-0.5 text-[9px] font-semibold uppercase tracking-wide text-white/40" title="Signed in with the website account">website</span>' : "") +
        "</button>";
    };

    var html = '<section><h4 class="mb-1 px-1 text-[10px] font-semibold uppercase tracking-wide text-white/40">Online — ' + on.length + "</h4><div class=\"space-y-0.5\">";
    if (!on.length) {
      html += '<p class="px-1 py-2 text-[11px] text-white/30">No one online right now.</p>';
    } else {
      on.forEach(function (a) { html += row(a, true); });
    }
    html += '</div></section>';
    html += '<section><h4 class="mb-1 px-1 text-[10px] font-semibold uppercase tracking-wide text-white/40">Offline — ' + off.length + '</h4><div class="space-y-0.5">';
    off.slice(0, 30).forEach(function (a) { html += row(a, false); });
    html += "</div></section>";
    box.innerHTML = html;
    document.getElementById("online-count").textContent = on.length + " online";
  }

  /* ---- data loads ---- */
  function loadReal() {
    V.dataOf("latest.json").then(function (d) {
      state.accounts = {};
      (d.accounts || []).forEach(function (a) { state.accounts[a.id] = a; });
      state.byId = {};
      (d.messages || []).forEach(function (m) { state.byId[m.id] = m; });
      /* the backup lane carries every public channel — the timeline
       * filters per viewed channel; roster lighting sees them all */
      state.allMsgs = d.messages || [];
      state.realRecent = d.messages || [];
      state.realAccounts = d.accounts || [];
      render();
      renderMembers();
    }).catch(function () {});
  }

  /* ---- the app's API lane: live channel data, no CDN lag at all.
     When the website answers, the timeline reads the DB directly every
     few seconds — messages from the website show up on their own, no
     restart, no 30s backup wait. Falls back to the backup silently. */
  function apiMsgToRow(m) {
    if (m && m.account) {
      var prev = state.accounts[m.account.id];
      if (prev && prev.bio && !m.account.bio) m.account.bio = prev.bio;
      state.accounts[m.account.id] = m.account;
    }
    return {
      id: m.id,
      accountId: m.account ? m.account.id : m.accountId,
      content: m.content,
      createdAt: m.createdAt,
      editedAt: m.editedAt || null,
      channelId: m.channelId || "main",
    };
  }
  function loadChannel() {
    if (state.apiBase === null || state.apiBase === undefined) return;
    fetch(state.apiBase + "/api/chat-data?channel=" + encodeURIComponent(state.channelId) + "&t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || !j.ok || !Array.isArray(j.messages)) return;
        state.channelMsgs = j.messages.map(apiMsgToRow);
        render();
        renderMembers();
      })
      .catch(function () { /* next tick retries — the backup still feeds us */ });
  }

  function loadLive() {
    /* L.fetchRoom: the GitHub API first (fresh even when the CDN edge is
       throttled), the CDN merge as fallback */
    L.fetchRoom().then(function (s) {
      if (!s) { state.liveOk = false; return; }
      state.liveOk = true;
      state.liveUsers = s.users || {};
      state.liveMsgs = (s.messages || []).map(function (m) { return L.msgToRow(m); });
      /* my identity must still exist in the room — otherwise sign back in.
         A JUST-created identity may not be on the CDN yet (the purge
         lands a beat after the write), so fresh sign-ins get a grace
         window instead of an insta-logout. */
      var id = L.identity();
      if (id && !L.findUser(s, id.username)) {
        if (Date.now() - lastAuthAt < 120000) {
          applyIdentity(id);
        } else {
          L.clearIdentity();
          applyIdentity(null);
        }
      } else if (id) {
        applyIdentity(id);
      }
      render();
      renderMembers();
    });
  }

  /* ---- identity + gate ---- */
  var lastAuthAt = 0; /* a fresh sign-in survives CDN lag (see loadLive) */
  function applyIdentity(idAcc) {
    var gate = document.getElementById("auth-gate");
    var meAvatar = document.getElementById("me-avatar");
    state.blockedNotice = null; /* the fresh room state below re-decides */
    if (idAcc && state.liveUsers[String(idAcc.username).toLowerCase()]) {
      state.me = L.pseudoAccount(state.liveUsers[String(idAcc.username).toLowerCase()]);
    } else if (idAcc) {
      state.me = L.pseudoAccount({ username: idAcc.username, displayName: idAcc.displayName || idAcc.username, avatarColor: "#f97316" });
    } else {
      state.me = null;
    }
    if (state.me) {
      gate.classList.add("hidden");
      gate.classList.remove("flex");
      var name = displayName(state.me);
      meAvatar.style.backgroundColor = state.me.avatarColor || "#2c3e50";
      meAvatar.textContent = initials(name);
      document.getElementById("coins-count").textContent = state.me.coins != null ? state.me.coins : 100;
      document.title = "Veil Chat — " + name;
      if (idAcc && idAcc.via) state.me.via = idAcc.via; /* website-linked sign-in */
    } else {
      gate.classList.remove("hidden");
      gate.classList.add("flex");
      document.title = "Veil Chat";
    }
    render();
    renderMembers();
    updateBlock();
  }

  function setGateMode(mode) {
    state.gateMode = mode;
    var tl = document.getElementById("tab-login");
    var tr = document.getElementById("tab-register");
    var on = "flex-1 rounded-lg px-3 py-1.5 transition-colors bg-white/15 text-white";
    var off = "flex-1 rounded-lg px-3 py-1.5 transition-colors text-white/60 hover:text-white";
    tl.className = mode === "login" ? on : off;
    tr.className = mode === "register" ? on : off;
    document.getElementById("gate-sub").textContent = mode === "login" ? "Welcome back" : "Create a new account to join the chat.";
    document.getElementById("gate-submit-label").textContent = mode === "login" ? "Log In" : "Create account";
    document.getElementById("gate-error").classList.add("hidden");
  }
  document.getElementById("tab-login").addEventListener("click", function () { setGateMode("login"); });
  document.getElementById("tab-register").addEventListener("click", function () { setGateMode("register"); });
  document.getElementById("gate-back").addEventListener("click", function () {
    window.location.href = V.page("index");
  });

  var gateUser = document.getElementById("gate-username");
  var gatePass = document.getElementById("gate-password");
  var gateSubmit = document.getElementById("gate-submit");
  var gateError = document.getElementById("gate-error");
  var gateSpin = document.getElementById("gate-spinner");
  function gateUpdate() {
    var u = gateUser.value.trim(), p = gatePass.value;
    gateSubmit.disabled = !u || !p;
  }
  gateUser.addEventListener("input", gateUpdate);
  gatePass.addEventListener("input", gateUpdate);

  function gateFail(msg) {
    gateError.textContent = msg;
    gateError.classList.remove("hidden");
    gateSpin.classList.add("hidden");
    gateSubmit.disabled = false;
  }

  document.getElementById("gate-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var u = gateUser.value.trim();
    var p = gatePass.value;
    if (!u || !p) return;
    /* real account names can't be impersonated on the CDN room */
    if (state.gateMode === "register") {
      var lower = u.toLowerCase();
      var clash = state.realAccounts.some(function (a) { return (a.username || "").toLowerCase() === lower; });
      if (clash) { gateFail("That username is already taken."); return; }
    }
    gateSubmit.disabled = true;
    gateSpin.classList.remove("hidden");
    gateError.classList.add("hidden");
    var done = function (acc) {
      lastAuthAt = Date.now();
      gateSpin.classList.add("hidden");
      gateSubmit.disabled = false;
      gateUser.value = "";
      gatePass.value = "";
      gateUpdate();
      applyIdentity(acc);
      L.heartbeat(acc, true);
      loadLive();
    };
    var fail = function (err) { gateFail(L.friendlyError(err)); };
    if (state.gateMode === "register") L.register(u, p).then(done, fail);
    else L.login(u, p).then(done, fail);
  });

  document.getElementById("signout-btn").addEventListener("click", function () {
    L.clearIdentity();
    applyIdentity(null);
    setGateMode("login");
  });

  /* ---- composer — sends land in the shared room ---- */
  var input = document.getElementById("composer-input");
  var send = document.getElementById("composer-send");
  var notice = document.getElementById("composer-notice");
  /* muted/banned by a website moderator: a persistent notice above the
     composer, send box locked until the room says otherwise */
  function blockReason() {
    if (state.blockedNotice) return state.blockedNotice;
    if (state.me && state.me.banned) return state.me.banReason || "You are banned from this room.";
    if (state.me && state.me.muted) return "You are muted — a moderator silenced this room for you.";
    return null;
  }
  function updateBlock() {
    var reason = blockReason();
    if (reason) {
      notice.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-volume-x h-3.5 w-3.5 shrink-0"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"></path><line x1="22" x2="16" y1="9" y2="15"></line><line x1="16" x2="22" y1="9" y2="15"></line></svg>' +
        "<span>" + V.esc(reason) + "</span>";
      notice.classList.remove("hidden");
      notice.classList.add("flex");
      input.disabled = true;
      send.disabled = true;
    } else {
      notice.classList.add("hidden");
      notice.classList.remove("flex");
      updateComposerAccess();
    }
  }
  function updateSend() { send.disabled = !input.value.trim() || !state.me || !!blockReason(); }
  input.addEventListener("input", updateSend);

  /* channels beyond #general live on the website's DB — posting there
     needs a website-linked sign-in (the app's API + its session token).
     #general posts through the shared live room, anyone signed in. */
  function siteToken() {
    try { return window.localStorage.getItem("veil:site-token") || ""; } catch (e) { return ""; }
  }
  function isModGit() {
    var me = state.me;
    return !!(me && (me.role === "admin" || me.role === "owner" || me.role === "moderator" ||
      String(me.username || "").toLowerCase() === "veil"));
  }
  function canPostHere() {
    if (state.channelId === "main") return true;
    var c = channelById(state.channelId);
    if (c.modOnly && !isModGit()) return false;
    return !!(siteToken() && state.apiBase !== null && state.apiBase !== undefined);
  }
  function updateComposerAccess() {
    var c = channelById(state.channelId);
    if (state.channelId === "main") {
      input.disabled = false;
      input.placeholder = "Message " + c.label + " — try /help";
      updateSend();
      return;
    }
    var ok = canPostHere();
    input.disabled = !ok;
    input.placeholder = ok
      ? "Message " + c.label + " — try /help"
      : (c.modOnly && !isModGit())
        ? c.label + " — read-only (mods & owner post here)"
        : "Posting here needs your website account — sign in with it";
    if (!ok) send.disabled = true;
    else updateSend();
  }
  function doSend() {
    var text = input.value.trim();
    if (!text || !state.me) return;
    var idAcc = L.identity();
    if (!idAcc) { applyIdentity(null); return; }
    var optimistic = {
      id: "pending-" + Date.now().toString(36),
      accountId: state.me.id,
      content: text,
      createdAt: new Date().toISOString(),
      channelId: state.channelId,
      live: state.channelId === "main",
      pending: true,
    };
    state.pending.push(optimistic);
    input.value = "";
    updateSend();
    render();
    if (state.channelId !== "main") {
      /* the website's DB — the app's API carries it (website-linked) */
      fetch(state.apiBase + "/api/chat-data", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ token: siteToken(), channelId: state.channelId, content: text }),
      }).then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, j: j }; });
      }).then(function (res) {
        state.pending = state.pending.filter(function (m) { return m.id !== optimistic.id; });
        if (res.ok && res.j && res.j.ok && res.j.message) {
          if (Array.isArray(state.channelMsgs)) state.channelMsgs.push(apiMsgToRow(res.j.message));
          else state.channelMsgs = [apiMsgToRow(res.j.message)];
          render();
          renderMembers();
        } else {
          throw new Error((res.j && res.j.error) || "The website didn't accept the message.");
        }
      }).catch(function (e) {
        state.pending = state.pending.filter(function (m) { return m.id !== optimistic.id; });
        render();
        toast(String((e && e.message) || e));
        input.value = text;
        updateSend();
      });
      return;
    }
    L.sendMessage(idAcc, text).then(function (row) {
      state.pending = state.pending.filter(function (m) { return m.id !== optimistic.id; });
      state.liveMsgs.push(row);
      render();
      renderMembers();
      loadLive();
    }).catch(function (e) {
      state.pending = state.pending.filter(function (m) { return m.id !== optimistic.id; });
      render();
      var msg = L.friendlyError(e);
      if (e && (e.banned || /banned|mute/i.test(String(e.message || "")))) {
        /* muted/banned — persistent notice above the composer, box locked */
        state.blockedNotice = msg;
        updateBlock();
        input.value = text;
      } else {
        toast(msg);
        input.value = text;
        updateSend();
      }
    });
  }
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); doSend(); }
  });
  send.addEventListener("click", doSend);

  /* ---- channel switcher — the app's dropdown, mirrored 1:1 ---- */
  var chBtn = document.getElementById("channel-btn");
  var chMenu = document.getElementById("channel-menu");
  var chLabel = document.getElementById("channel-label");
  var chDesc = document.getElementById("channel-desc");
  function hashSvg(cls) {
    return '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-hash ' + cls + '"><line x1="4" x2="20" y1="9" y2="9"></line><line x1="4" x2="20" y1="15" y2="15"></line><line x1="10" x2="8" y1="3" y2="21"></line><line x1="16" x2="14" y1="3" y2="21"></line></svg>';
  }
  function buildChannelMenu() {
    var html = '<div class="px-2 py-1 text-[10px] font-semibold uppercase tracking-wide text-white/40">Channels</div><div class="space-y-0.5">';
    CHANNELS.forEach(function (c) {
      html += '<button type="button" role="menuitem" data-os-channel="' + c.id + '" class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-sm ' + (state.channelId === c.id ? "bg-white/10" : "hover:bg-white/5") + '" title="' + V.esc(c.desc) + '">' +
        hashSvg("h-3.5 w-3.5 text-white/40") +
        '<span class="flex-1 text-left">' + V.esc(c.name) + "</span>" +
        '<span class="text-[10px] text-white/30">' + V.esc(c.desc) + "</span></button>";
    });
    html += "</div>";
    chMenu.innerHTML = html;
    $$("[data-os-channel]", chMenu).forEach(function (b) {
      b.addEventListener("click", function () {
        setChannel(b.getAttribute("data-os-channel"));
        closeChannelMenu();
      });
    });
  }
  var chMenuOpen = false;
  function closeChannelMenu() {
    chMenuOpen = false;
    chMenu.classList.add("hidden");
    chBtn.setAttribute("aria-expanded", "false");
  }
  chBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    chMenuOpen = !chMenuOpen;
    chMenu.classList.toggle("hidden", !chMenuOpen);
    chBtn.setAttribute("aria-expanded", String(chMenuOpen));
  });
  document.addEventListener("click", function (e) {
    if (chMenuOpen && !chMenu.contains(e.target) && e.target !== chBtn) closeChannelMenu();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && chMenuOpen) closeChannelMenu();
  });
  function updateChannelUi() {
    var c = channelById(state.channelId);
    chLabel.textContent = c.label;
    chBtn.title = c.label;
    chDesc.textContent = c.desc;
    updateComposerAccess();
  }
  function setChannel(id) {
    if (!channelById(id) || id === state.channelId) return;
    state.channelId = id;
    state.channelMsgs = null; /* refetch the new channel's API lane */
    state.pending = [];      /* pending sends belong to the old channel */
    try { window.localStorage.setItem("veil:chat-channel", id); } catch (e) { /* ignore */ }
    updateChannelUi();
    buildChannelMenu();
    render();
    loadChannel();
  }

  /* members toggle — same behavior as the app's */
  var aside = document.getElementById("members-aside");
  document.getElementById("members-close").addEventListener("click", function () { aside.style.display = "none"; });
  document.getElementById("members-toggle").addEventListener("click", function () {
    aside.style.display = aside.style.display === "none" ? "" : "none";
  });

  /* ---- boot ---- */
  try {
    var savedCh = window.localStorage.getItem("veil:chat-channel");
    if (savedCh && channelById(savedCh) && savedCh !== "main") state.channelId = savedCh;
  } catch (e) { /* private mode */ }
  buildChannelMenu();
  updateChannelUi();
  loadReal();
  loadLive();
  applyIdentity(L.identity());
  updateSend();
  /* the app's API lane — resolves once, then the channel poll uses it */
  V.api().then(function (base) {
    state.apiBase = base;
    loadChannel();
    updateComposerAccess();
  });
  setInterval(function () { if (!document.hidden) loadReal(); }, 15000);
  setInterval(function () { if (!document.hidden) loadLive(); }, L.cfg.pollMs);
  setInterval(function () { if (!document.hidden) loadChannel(); }, 5000);
  setInterval(function () {
    if (!document.hidden && L.identity()) L.heartbeat(L.identity(), false);
  }, 15000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) {
      loadReal();
      loadLive();
      loadChannel();
      if (L.identity()) L.heartbeat(L.identity(), true);
    }
  });
})();

//]]>
</script>
</body>
